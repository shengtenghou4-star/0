name: case-16ea58b925aa10dfbb25ac9f1dabdb91

on:
  pull_request:
    paths:
      - 'cases/16ea58b925aa10dfbb25ac9f1dabdb91/**'

permissions:
  contents: read

jobs:
  fixed-case:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy scipy scikit-learn h5py requests
      - run: python cases/16ea58b925aa10dfbb25ac9f1dabdb91/run.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-16ea58b925aa10dfbb25ac9f1dabdb91
          path: cases/16ea58b925aa10dfbb25ac9f1dabdb91/artifacts/
          if-no-files-found: error
          retention-days: 7
