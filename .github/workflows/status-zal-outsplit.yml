# refresh 2026-08-01T14:13Z
name: Status ZAL Outside Split

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/status-zal-outsplit.yml'

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Query target workflow and publish status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.request
          token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'status-zal-outsplit'}
          runs_url='https://api.github.com/repos/shengtenghou4-star/0/actions/workflows/matrix-zal-outsplit-7a8f.yml/runs?per_page=5'
          with urllib.request.urlopen(urllib.request.Request(runs_url,headers=headers),timeout=120) as r:
              data=json.load(r)
          out={'schema':1,'workflow':'matrix-zal-outsplit-7a8f.yml','runs':[{'id':x['id'],'status':x['status'],'conclusion':x['conclusion'],'run_number':x['run_number'],'head_sha':x['head_sha'],'created_at':x['created_at'],'updated_at':x['updated_at'],'html_url':x['html_url']} for x in data.get('workflow_runs',[])]}
          payload=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode()
          path='status/zal-outsplit.json'
          url=f'https://api.github.com/repos/shengtenghou4-star/0/contents/{path}'
          sha=None
          try:
              with urllib.request.urlopen(urllib.request.Request(url+'?ref=main',headers=headers),timeout=120) as r:
                  sha=json.load(r)['sha']
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
          body={'message':'Refresh ZAL outside-split status [skip ci]','content':base64.b64encode(payload).decode(),'branch':'main'}
          if sha: body['sha']=sha
          req=urllib.request.Request(url,data=json.dumps(body,separators=(',',':')).encode(),method='PUT',headers={**headers,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=120) as r: r.read()
          PY
