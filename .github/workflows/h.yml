name: Matrix H

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/h.yml'

permissions:
  contents: read

concurrency:
  group: matrix-h
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Extract private opaque summaries
        shell: bash
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile, urllib.parse, urllib.request
          token=os.environ['LAB_QUEUE_TOKEN']; repo='shengtenghou4-star/00'; branch='results'
          targets=[
            ('8e47fe6a0738c37c3107c46e1a8b8815','30630015947-1'),
            ('b4dadfb90754737a047544541558dcc7','30630943505-1'),
          ]
          wanted={
            'output/summary.json','output/third.solver.summary.json','output/fourth.solver.summary.json','output/fifth.solver.summary.json',
            'output/third.open.map.json.zlib.b64','output/fourth.open.map.json.zlib.b64','output/fifth.open.map.json.zlib.b64',
            'output/task.stderr.txt','output/task.stdout.txt','payload.sha256','return-code.txt','runner.sha256','solver-source-commit.txt','solver-version.txt','stderr.txt','stdout.txt'
          }
          def api(path, *, accept='application/vnd.github+json', method='GET', data=None):
              safe='/'.join(urllib.parse.quote(x,safe='') for x in path.split('/'))
              url=f'https://api.github.com/repos/{repo}/contents/{safe}'
              if method=='GET': url += '?' + urllib.parse.urlencode({'ref':branch})
              headers={'Authorization':f'Bearer {token}','Accept':accept,'X-GitHub-Api-Version':'2022-11-28','User-Agent':'matrix-h'}
              if data is not None: headers['Content-Type']='application/json'
              req=urllib.request.Request(url,data=data,method=method,headers=headers)
              with urllib.request.urlopen(req,timeout=300) as r: return r.read()
          def put(path, content):
              body=json.dumps({'message':'Store focused opaque inspection','content':base64.b64encode(content).decode(),'branch':branch},separators=(',',':')).encode()
              api(path,method='PUT',data=body)
          for cid,run in targets:
              raw=api(f'relay/results/{cid}/{run}/result.tar.gz',accept='application/vnd.github.raw+json')
              report={'schema':2,'capsule_id':cid,'run':run,'archive_bytes':len(raw),'archive_sha256':hashlib.sha256(raw).hexdigest(),'files':{}}
              with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
                  for m in tf.getmembers():
                      p=pathlib.PurePosixPath(m.name)
                      if p.is_absolute() or '..' in p.parts or m.issym() or m.islnk() or m.isdev(): raise SystemExit('unsafe archive')
                      if m.isfile() and m.name in wanted:
                          data=tf.extractfile(m).read()
                          report['files'][m.name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'content':data.decode('utf-8','replace')}
              out=(json.dumps(report,sort_keys=True,indent=2)+'\n').encode()
              put(f'relay/focused-inspections/{cid}/{run}/inspection.json',out)
          print('Stored focused inspections.')
          PY
