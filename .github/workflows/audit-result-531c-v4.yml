          checks['layer_sequence']=ordered==['third','fourth','fifth','sixth'];checks['layer_accounting']=allok;checks['explicit_solver_logs']=all(x['explicit_final_status_ok'] for x in layer_audit.values());checks['terminal']=prev==0
          maps={};mok=True
          for lname in ordered:
            n=f'output/{lname}.open.map.json.zlib.b64';enc=files[n];dec=zlib.decompress(base64.b64decode(b''.join(enc.split()),validate=True));s=dec.decode('utf-8');obj=[] if not s.strip() else (json.loads(s) if s.lstrip().startswith(('[','{')) else [json.loads(x) for x in s.splitlines() if x.strip()]);top=summary[f'{lname}_open_map'];ok=hashlib.sha256(enc).hexdigest()==top['encoded_sha256'] and hashlib.sha256(dec).hexdigest()==top['decoded_sha256'] and len(obj)==top['entries']==layers[lname]['survivors'];mok &= ok;maps[lname]={'ok':ok,'entries':len(obj),'encoded_sha256':hashlib.sha256(enc).hexdigest(),'decoded_sha256':hashlib.sha256(dec).hexdigest()}
          checks['maps']=mok;accepted=all(checks.values());report={'schema':'profile37-result-adversarial-audit/v4','capsule_id':cid,'run':run,'mode':mode,'accepted':accepted,'decision':'ACCEPT_TERMINAL_UNSAT' if accepted else 'HOLD_NO_PROOF_CREDIT','failed_checks':[k for k,v in checks.items() if not v],'checks':checks,'receipt':receipt,'archive_bytes':len(raw),'archive_sha256':hashlib.sha256(raw).hexdigest(),'retarget_receipt':retarget,'cnf_audit':cnf_audit,'layer_audit':layer_audit,'map_audit':maps,'summary':summary,'input':inp,'members':members};out=f'relay/focused-inspections/{cid}/{run}/adversarial-audit-v4.json';d=(json.dumps(report,sort_keys=True,indent=2)+'\n').encode();body=json.dumps({'message':'Store ZAL 531c adversarial audit v4','content':base64.b64encode(d).decode(),'branch':branch},separators=(',',':')).encode();api(out,method='PUT',data=body);print(json.dumps({'accepted':accepted,'failed':report['failed_checks'],'out':out},sort_keys=True))
