name: Audit Result 531c v4

on:
  push:
    paths:
      - '.github/workflows/audit-result-531c-v4.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Audit final target statuses
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,io,json,os,pathlib,tarfile,urllib.parse,urllib.request,zlib
          token=os.environ['LAB_QUEUE_TOKEN'];repo='shengtenghou4-star/00';branch='results';cid='531c0a7e8b9d4f21a6c3e5d7f9012b4c';run='30685883451-1';target=[7,8,8,8,8,8,8,8,10];old=[8,8,9,9,7,8,8,8,9];mode='t4:7,8,8,8|8,8,8,8,10'
          def api(path,accept='application/vnd.github+json',method='GET',data=None):
            safe='/'.join(urllib.parse.quote(x,safe='') for x in path.split('/'));url=f'https://api.github.com/repos/{repo}/contents/{safe}'+(('?'+urllib.parse.urlencode({'ref':branch})) if method=='GET' else '');h={'Authorization':f'Bearer {token}','Accept':accept,'X-GitHub-Api-Version':'2022-11-28','User-Agent':'audit-531c-v4'}
            if data is not None:h['Content-Type']='application/json'
            with urllib.request.urlopen(urllib.request.Request(url,data=data,method=method,headers=h),timeout=300) as r:return r.read()
          p=f'relay/results/{cid}/{run}';e=json.loads(api(f'{p}/receipt.json'));receipt=json.loads(base64.b64decode(e['content']));raw=api(f'{p}/result.tar.gz','application/vnd.github.raw+json');files={};members=[]
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
            for m in tf.getmembers():
              q=pathlib.PurePosixPath(m.name)
              if q.is_absolute() or '..' in q.parts or m.issym() or m.islnk() or m.isdev():raise SystemExit('unsafe archive')
              z={'name':m.name,'size':m.size,'type':'file' if m.isfile() else 'other'}
              if m.isfile():d=tf.extractfile(m).read();files[m.name]=d;z['sha256']=hashlib.sha256(d).hexdigest()
              members.append(z)
          text=lambda n:files[n].decode('utf-8','replace');js=lambda n:json.loads(text(n));inp=js('output/input.json');summary=js('output/summary.json');retarget=js('retarget-receipt.json')
          checks={'receipt_capsule':receipt.get('capsule_id')==cid,'receipt_run':str(receipt.get('run_id'))=='30685883451' and str(receipt.get('run_attempt'))=='1','archive_bytes':receipt.get('result_bytes')==len(raw),'archive_sha':receipt.get('result_sha256')==hashlib.sha256(raw).hexdigest(),'return_codes':receipt.get('return_code')==0 and text('return-code.txt').strip()=='0','input_target':inp.get('schema')=='profile37-target-input/v1' and inp.get('mode')==mode and inp.get('inside')==target,'input_dedup':inp.get('deduplication',{}).get('mode_absent_from_terminal_set') is True and inp.get('deduplication',{}).get('mode_present_in_open_set') is True,'summary_target':summary.get('t')==4 and summary.get('inside')==target and summary.get('profile')==([9]+[8]*13+[7]*2+[6]),'summary_sat_zero':summary.get('sat')==0,'retarget_identity':retarget.get('schema')=='opaque-engine-retarget/v1' and retarget.get('engine_capsule')=='8e47fe6a0738c37c3107c46e1a8b8815' and retarget.get('engine_payload_sha256')=='c219e70ec357f8ba0cb34eb82c7d1d51406f7b823728f18818d93ff2118d13d3','retarget_vectors':retarget.get('old_inside')==old and retarget.get('new_inside')==target and retarget.get('max_layer')==7,'retarget_rule':retarget.get('patch_rule')=='single exact source-anchor substitution; all other engine code unchanged','retarget_hash_changed':retarget.get('original_task_sha256')!=retarget.get('patched_task_sha256')}
          payload={}
          for line in text('output/payload-files.sha256').splitlines():
            if line.strip():h,pn=line.split(None,1);payload[pn.strip()]=h
          ish=hashlib.sha256(files['output/input.json']).hexdigest();checks['payload_bindings']=payload.get('/tmp/capsule/input.json')==ish==retarget.get('target_input_sha256') and payload.get('/tmp/capsule/task.py')==retarget.get('patched_task_sha256') and payload.get('/tmp/capsule/runner.cpp')=='d57e79c6475fb2fcbeeb3298276660c712167c96f9c507f152a013a522b3cc7c';checks['solver_receipts']=len(text('solver-source-commit.txt').strip())==40 and bool(text('solver-version.txt').strip()) and len(text('runner.sha256').strip().split()[0])==64
          cn=next(n for n in files if n.endswith('base.cnf'));cnf=files[cn];csha=hashlib.sha256(cnf).hexdigest();dv=dc=None;zeros=0
