            else:zeros+=sum(t==b'0' for t in q.split())
          sc=summary['cnf'];checks['cnf_binding']=sc.get('sha256')==csha and sc.get('variables')==dv and sc.get('clauses')==dc==zeros;cnf_audit={'name':cn,'sha256':csha,'variables':dv,'declared_clauses':dc,'counted_clauses':zeros}
          layers=summary['layers'];ordered=[x for x in ('third','fourth','fifth','sixth','seventh') if x in layers];layer_audit={};prev=None;allok=True
          for lname in ordered:
            L=layers[lname];V=L['v4'];S=L['solver'];ordinary_ok=(L.get('exact_orbits')==V.get('input')) if lname=='third' else (lambda O:(O['raw']==O['ordinary_retained']+sum(v for k,v in O.items() if k not in {'raw','parents','ordinary_retained'} and isinstance(v,int)) and O['parents']==prev))(L['ordinary']);v4sum=sum(v for d in V.get('per_k',{}).values() for v in d.values());v4_ok=V['input']==V['rejected']+V['retained'] and V['rejected']==v4sum and V['retained']==S['input'];solver_ok=S['input']==S['unsat']+S['sat']+S['open'] and S['unsat']==sum(S['unsat_by_budget'].values()) and L['survivors']==S['open'] and S['sat']==0 and ((S['open']==0 and S['exit_code']==20) or (S['open']>0 and S['exit_code']==0))
