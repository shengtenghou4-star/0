name: case-bio001-s26-nguyen

on:
  pull_request:
    paths:
      - 'cases/bio001-s26-nguyen/**'

permissions:
  contents: read

jobs:
  acquire-train-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade requests
      - run: python cases/bio001-s26-nguyen/acquire.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bio001-s26-nguyen-train-dev
          path: cases/bio001-s26-nguyen/artifacts/
          if-no-files-found: error
          retention-days: 7
