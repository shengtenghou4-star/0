name: BIO-001 S48 publish Dryad archive manifest

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Skip if frozen target manifest already exists
        id: guard
        shell: bash
        run: |
          if [ -f s48_frozen_target/archive_manifest.json ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify frozen inventory executable
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum tools/s48_archive_inventory.py | awk '{print $1}')" = "63230a4370f7efc3e6f6f8738f0d87dba22cb53431627cb73a03c80cb9596e0c"
          python -m py_compile tools/s48_archive_inventory.py
      - name: Download and inventory archive without extracting members
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s48_target s48_frozen_target
          curl -L --fail --retry 3 --retry-all-errors --connect-timeout 30 -A 'Mozilla/5.0' -o s48_target/dryad.zip 'https://datadryad.org/downloads/file_stream/2876840'
          python tools/s48_archive_inventory.py s48_target/dryad.zip s48_frozen_target/archive_manifest.json
          mv s48_frozen_target/archive_manifest.json.names.txt s48_frozen_target/archive_manifest.names.txt
          test ! -e s48_frozen_target/dryad.zip
      - name: Commit metadata-only target manifest
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add s48_frozen_target/archive_manifest.json s48_frozen_target/archive_manifest.names.txt
          git diff --cached --quiet && exit 0
          git commit -m 'BIO-001 S48 freeze Dryad archive metadata [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
