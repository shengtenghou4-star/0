name: case-bio-adult-biomass-56580-20260801

on:
  pull_request:
    paths:
      - ".github/workflows/case_bio_adult_biomass_56580_20260801.yml"

permissions:
  contents: read

jobs:
  fixed-case:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and inspect exact eLife source workbook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p case_output
          python -m pip install --quiet openpyxl
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import urllib.request

          from openpyxl import load_workbook

          url = "https://cdn.elifesciences.org/articles/56580/elife-56580-fig6-data1-v1.xlsx"
          filename = "elife-56580-fig6-data1-v1.xlsx"
          destination = pathlib.Path("case_output") / filename
          request = urllib.request.Request(url, headers={"User-Agent": "CyberGenesis-public-evidence/1.0"})
          sha256 = hashlib.sha256()
          size = 0
          with urllib.request.urlopen(request, timeout=180) as response, destination.open("wb") as handle:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  handle.write(chunk)
                  sha256.update(chunk)
                  size += len(chunk)

          wb = load_workbook(destination, data_only=True, read_only=True)
          sheets = []
          for ws in wb.worksheets:
              rows = []
              for row in ws.iter_rows(values_only=True):
                  values = [value.isoformat() if hasattr(value, "isoformat") else value for value in row]
                  if any(value is not None for value in values):
                      rows.append(values)
              sheets.append({
                  "title": ws.title,
                  "max_row": ws.max_row,
                  "max_column": ws.max_column,
                  "nonempty_rows": rows,
              })

          result = {
              "schema": "cybergenesis-elife-source-workbook-v1",
              "case": "bio-adult-biomass-56580-20260801",
              "source_url": url,
              "filename": filename,
              "bytes": size,
              "sha256": sha256.hexdigest(),
              "sheet_count": len(sheets),
              "sheets": sheets,
          }
          pathlib.Path("case_output/WORKBOOK_DUMP.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          pathlib.Path("case_output/DOWNLOAD_RECEIPT.json").write_text(
              json.dumps({k: result[k] for k in ("schema", "case", "source_url", "filename", "bytes", "sha256", "sheet_count")}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload fixed-case output
        uses: actions/upload-artifact@v4
        with:
          name: case-bio-adult-biomass-56580-20260801
          path: case_output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
