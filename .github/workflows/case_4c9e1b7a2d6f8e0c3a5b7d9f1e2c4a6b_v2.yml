name: case-4c9e1b7a2d6f8e0c3a5b7d9f1e2c4a6b-v2

on:
  pull_request:
    paths:
      - ".github/workflows/case_4c9e1b7a2d6f8e0c3a5b7d9f1e2c4a6b_v2.yml"

permissions:
  contents: read

jobs:
  fixed-case:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Query fixed Zenodo candidate surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p case_output
          python - <<'PY'
          import html, json, pathlib, re, urllib.parse, urllib.request
          excluded={"1026507","1029071","1191748","1201276","1191045"}
          headers={"User-Agent":"reference-matrix/1.0","Accept":"application/json"}
          candidates=[]; seen=set()
          for page in range(1,41):
              url="https://zenodo.org/api/records/?"+urllib.parse.urlencode({"q":"days_of_adulthood","size":25,"page":page})
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=120) as response:
                  payload=json.load(response)
              hits=payload.get("hits",{}).get("hits",[])
              if not hits: break
              for record in hits:
                  rid=str(record.get("id","")); metadata=record.get("metadata",{})
                  text=metadata.get("title","")+"\n"+html.unescape(re.sub(r"<[^>]+>","\n",metadata.get("description","")))
                  if not rid or rid in excluded or rid in seen or "CGC N2 (Bristol, UK)" not in text: continue
                  day=re.search(r"days_of_adulthood\s*:\s*(\d+)",text,re.I)
                  wcon=[f for f in record.get("files",[]) if f.get("key","").endswith(".wcon.zip")]
                  if not day or len(wcon)!=1 or not wcon[0].get("checksum","").startswith("md5:"): continue
                  base=re.search(r"base_name\s*:\s*([^\n]+)",text,re.I); fps=re.search(r"frames per second\s*:\s*([0-9.]+)",text,re.I)
                  f=wcon[0]
                  candidates.append({"record_id":rid,"days_of_adulthood":int(day.group(1)),"title":metadata.get("title"),"doi":metadata.get("doi"),"base_name":base.group(1).strip() if base else None,"fps":float(fps.group(1)) if fps else None,"filename":f.get("key"),"md5":f.get("checksum").split(":",1)[1],"bytes":f.get("size"),"content_url":f.get("links",{}).get("content") or f.get("links",{}).get("self")})
                  seen.add(rid)
              total=payload.get("hits",{}).get("total",0)
              if isinstance(total,dict): total=total.get("value",0)
              if page*25>=int(total or 0): break
          candidates.sort(key=lambda r:(r["days_of_adulthood"],r["record_id"]))
          result={"schema":"reference-matrix-candidate-discovery-v2","case":"4c9e1b7a2d6f8e0c3a5b7d9f1e2c4a6b","candidate_count":len(candidates),"candidates":candidates}
          pathlib.Path("case_output/CANDIDATES.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
      - name: Upload fixed-case output
        uses: actions/upload-artifact@v4
        with:
          name: case-4c9e1b7a2d6f8e0c3a5b7d9f1e2c4a6b-v2
          path: case_output/
          if-no-files-found: error
          retention-days: 1
