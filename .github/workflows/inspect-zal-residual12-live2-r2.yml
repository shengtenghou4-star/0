name: Inspect ZAL Residual12 Live2 R2

on:
  push:
    paths:
      - '.github/workflows/inspect-zal-residual12-live2-r2.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reaudit completed private packages per case
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, re, tarfile, urllib.parse, urllib.request
          token=os.environ['LAB_QUEUE_TOKEN']; repo='shengtenghou4-star/00'; branch='results'
          request='7a8f12c0e4b64d3a9f2e5c7b1d8a0f63'; run='30792311484-1'
          cases=['b_8_8_9_9__n_8_8_11','b_9_9_9_9__n_8_8_9']
          expected={'mode':'t4:7,8,8,8|8,8,8,8,9','inside':[7,8,8,8,8,8,8,8,9],'frontier':'d8407d78795835cbdfe80737cf7b646561af8b91','residual':'1ef1a69fbc5c418fa39028a6fb73c01d75782cf7','cover':'0ada21e204825a2421c8fafef50395e829e27ebe4164fc34f4d5df3d80d1088b','source_package':'6d09573322d84449b438f7c324602c804d276fcebcd226e21effd5066061c63a','source_merged':'3a4702dc24755f2f4658454bbe9e711e0030f3c74abdb06afae4722912ef7a08'}
          def fetch(path):
              q=urllib.parse.urlencode({'ref':branch}); req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}?{q}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'inspect-zal-residual12-live2-r2'})
              with urllib.request.urlopen(req,timeout=180) as r: env=json.load(r)
              return base64.b64decode(env['content'])
          def put(path,data):
              body=json.dumps({'message':'Store corrected ZAL live two-case audit','content':base64.b64encode(data).decode(),'branch':branch},separators=(',',':')).encode(); req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=body,method='PUT',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'inspect-zal-residual12-live2-r2'})
              with urllib.request.urlopen(req,timeout=180) as r: r.read()
          rows=[]; failures=[]; source_commits=set(); versions=set()
          for cid in cases:
              prefix=f'relay/results/{request}/{run}/cases/{cid}'; receipt_raw=fetch(f'{prefix}/receipt.json'); package=fetch(f'{prefix}/result.tar.gz'); receipt=json.loads(receipt_raw)
              root=pathlib.Path('/tmp')/('r2-'+hashlib.sha256(cid.encode()).hexdigest()[:16]); root.mkdir()
              with tarfile.open(fileobj=io.BytesIO(package),mode='r:gz') as tf:
                  for m in tf.getmembers():
                      p=pathlib.Path(m.name)
                      if p.is_absolute() or '..' in p.parts or m.issym() or m.islnk() or m.isdev(): raise SystemExit('unsafe package')
                  tf.extractall(root,filter='data')
              audit_path=root/'exact'/'case-audit.json'; report_path=root/'exact'/'case'/'report.json'; log_path=root/'exact'/'case'/'solver.log'; recovery_path=root/'source-recovery-receipt.json'; commit_path=root/'solver-source-commit.txt'; version_path=root/'solver-version.txt'; binary_path=root/'solver.sha256'
              required=[audit_path,report_path,log_path,recovery_path,commit_path,version_path,binary_path]
              if not all(p.exists() for p in required): failures.append(f'{cid}:missing_required_file'); continue
              audit=json.loads(audit_path.read_text()); report=json.loads(report_path.read_text()); recovery=json.loads(recovery_path.read_text()); commit=commit_path.read_text().strip(); version=version_path.read_text().strip(); binary=binary_path.read_text().strip()
              checks={
                'package_sha':hashlib.sha256(package).hexdigest()==receipt.get('result_sha256'),
                'receipt_identity':receipt.get('request_id')==request and str(receipt.get('run_id'))=='30792311484' and str(receipt.get('run_attempt'))=='1' and receipt.get('case_id')==cid,
                'receipt_terminal':receipt.get('wrapper_return_code')==0 and receipt.get('contract_pass') is True and receipt.get('solver_status')=='UNSAT' and receipt.get('solver_exit_code')==20,
                'audit_identity':audit.get('schema')=='profile37-outside-degree-residual-case/v1' and audit.get('mode')==expected['mode'] and audit.get('inside')==expected['inside'] and audit.get('case_id')==cid,
                'audit_bindings':audit.get('frontier_git_blob')==expected['frontier'] and audit.get('residual_checkpoint_git_blob')==expected['residual'] and audit.get('complete_cover_patterns_sha256')==expected['cover'] and audit.get('source_package_sha256')==expected['source_package'] and audit.get('source_merged_sha256')==expected['source_merged'] and audit.get('contract_pass') is True,
                'report_binding':audit.get('result')==report and report.get('case_id')==cid and report.get('status')=='UNSAT' and report.get('exit_code')==20 and report.get('binding_pass') is True and report.get('frontier_git_blob')==expected['frontier'] and report.get('cnf_sha256')==audit.get('source_cnf_sha256') and report.get('source_report_sha256')==audit.get('source_report_sha256'),
                'solver_log':'UNSATISFIABLE' in log_path.read_text(errors='replace'),
                'recovery':recovery.get('request_id')==request and recovery.get('case_id')==cid and recovery.get('frontier_git_blob')==expected['frontier'] and recovery.get('residual_checkpoint_git_blob')==expected['residual'],
                'solver_commit':bool(re.fullmatch(r'[0-9a-f]{40}',commit)),
                'solver_version':bool(version),
                'solver_binary_hash':bool(re.fullmatch(r'[0-9a-f]{64}\s+\S+',binary)),
              }
              bad=sorted(k for k,v in checks.items() if not v)
              if bad: failures.append(f'{cid}:'+','.join(bad))
              source_commits.add(commit); versions.add(version)
              rows.append({'case_id':cid,'checks':checks,'package_sha256':hashlib.sha256(package).hexdigest(),'case_audit_sha256':hashlib.sha256(audit_path.read_bytes()).hexdigest(),'report_sha256':hashlib.sha256(report_path.read_bytes()).hexdigest(),'cnf_sha256':report.get('cnf_sha256'),'variables':report.get('variables'),'clauses':report.get('clauses'),'solver_exit_code':report.get('exit_code'),'solver_status':report.get('status'),'solver_source_commit':commit,'solver_version':version,'solver_binary_hash_record':binary})
          if len(source_commits)!=1: failures.append('solver_source_commit_inconsistent')
          if len(versions)!=1: failures.append('solver_version_inconsistent')
          summary={'schema':'profile37-residual12-live-completed-case-audit/v2','request_id':request,'run_attempt':run,'mode':expected['mode'],'inside':expected['inside'],'audited_case_ids':cases,'audited_case_count':len(rows),'explicit_unsat_exit20_count':sum(r['solver_exit_code']==20 and r['solver_status']=='UNSAT' for r in rows),'failures':failures,'rows':rows,'binary_reproducibility_note':'Fresh builds from the same source commit and version may have different binary hashes; each per-case binary hash is provenance-bound and validated individually. Cross-job binary identity is not a proof premise.','verdict':'ACCEPT_TWO_CASE_LEVEL_UNSAT' if not failures and len(rows)==2 else 'REJECT_NO_PROOF_CREDIT','global_checkpoint_increment':0,'mode_terminal':False}
          raw=(json.dumps(summary,indent=2,sort_keys=True)+'\n').encode(); put(f'relay/focused-inspections/{request}/{run}/live-completed-2-audit-v2.json',raw)
          if failures: raise SystemExit(json.dumps(failures))
          PY
