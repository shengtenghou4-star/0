name: case-bio-reproductive-timecourse-88253-20260802

on:
  pull_request:
    paths:
      - ".github/workflows/case_bio_reproductive_timecourse_88253_20260802.yml"

permissions:
  contents: read

jobs:
  fixed-case:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify exact eLife source workbook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p case_output
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import urllib.request
          import zipfile

          url = "https://cdn.elifesciences.org/articles/88253/elife-88253-fig4-data1-v1.xlsx"
          filename = "elife-88253-fig4-data1-v1.xlsx"
          destination = pathlib.Path("case_output") / filename
          request = urllib.request.Request(url, headers={"User-Agent": "reference-matrix/1.0"})
          sha256 = hashlib.sha256()
          size = 0
          with urllib.request.urlopen(request, timeout=180) as response, destination.open("wb") as handle:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  handle.write(chunk)
                  sha256.update(chunk)
                  size += len(chunk)
          if size <= 0:
              raise SystemExit("Empty workbook")
          with zipfile.ZipFile(destination) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f"XLSX ZIP integrity failure: {bad}")
              members = archive.namelist()
              if "xl/workbook.xml" not in members:
                  raise SystemExit("Missing xl/workbook.xml")
          receipt = {
              "schema": "cybergenesis-reproductive-timecourse-download-receipt-v1",
              "source_url": url,
              "filename": filename,
              "bytes": size,
              "sha256": sha256.hexdigest(),
              "xlsx_member_count": len(members),
              "verified": True,
              "calorimetry_target_used": False,
          }
          pathlib.Path("case_output/DOWNLOAD_RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload fixed-case output
        uses: actions/upload-artifact@v4
        with:
          name: case-bio-reproductive-timecourse-88253-20260802
          path: case_output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
