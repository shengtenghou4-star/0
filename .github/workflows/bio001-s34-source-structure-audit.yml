name: BIO-001 S34 frozen result diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download immutable successful result artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --output s34_result.zip \
            https://api.github.com/repos/shengtenghou4-star/0/actions/artifacts/8936538518/zip
          mkdir -p s34_result
          unzip -q s34_result.zip -d s34_result

      - name: Expand horizon recording and model diagnostics
        run: |
          python - <<'PY'
          import hashlib
          import json
          import math
          from pathlib import Path

          root = Path('s34_result')
          results_path = next(root.rglob('development_results.json'))
          extraction_path = next(root.rglob('extraction_receipt.json'))
          model_path = next(root.rglob('frozen_model_pre_holdout.json'))
          audit_path = next(root.rglob('independent_audit.json'))
          run_path = next(root.rglob('run_receipt.json'))

          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()

          assert sha(extraction_path) == '4c4bf1bcd83efb3f1a2f9b3f3978cf6663a0e2279199f5041e19d372f7019896'
          assert sha(model_path) == '3f144cf66722794b7d40ec37e0c35cef7bf1f6e1af5a77d2da87c1513041c8a8'
          assert sha(results_path) == 'ffa190b1cd805ccbfe8619993c5fc23cce71b3b7abe897fbc51e8d8195888f30'

          results = json.loads(results_path.read_text())
          extraction = json.loads(extraction_path.read_text())
          model = json.loads(model_path.read_text())
          audit = json.loads(audit_path.read_text())
          run = json.loads(run_path.read_text())
          gate = results['development_gate']

          def selected_candidate(family, alpha):
              for candidate in family:
                  if float(candidate['alpha']) == float(alpha):
                      return candidate
              raise KeyError(alpha)

          m1_selected = selected_candidate(results['M1_candidates'], results['M1_selected_alpha'])
          m2_selected = selected_candidate(results['M2_candidates'], results['M2_selected_alpha'])

          per_horizon = {}
          per_recording = {}
          for horizon in ('1', '5', '10'):
              gm = gate['horizons'][horizon]
              m1_metrics = {x['recording_id']: x for x in m1_selected['development_metrics'][horizon]}
              m2_metrics = {x['recording_id']: x for x in m2_selected['development_metrics'][horizon]}
              rows = []
              for rid in sorted(m2_metrics):
                  m1 = m1_metrics[rid]
                  m2 = m2_metrics[rid]
                  rows.append({
                      'recording_id': rid,
                      'samples': m2['samples'],
                      'M2_to_M1_RMSE_ratio': m2['rmse'] / m1['rmse'],
                      'M2_to_persistence_RMSE_ratio': m2['model_to_persistence_rmse_ratio'],
                      'M1_RMSE': m1['rmse'],
                      'M2_RMSE': m2['rmse'],
                      'persistence_RMSE': m2['persistence_rmse'],
                      'M2_prediction_finite': m2['prediction_finite'],
                  })
              per_recording[horizon] = rows
              per_horizon[horizon] = {
                  'M2_to_M1_mean_ratio': gm['recording_balanced_mean_M2_to_M1_RMSE_ratio'],
                  'M2_to_persistence_mean_ratio': gm['recording_balanced_mean_M2_to_persistence_RMSE_ratio'],
                  'recordings_M2_beats_M1': sum(r['M2_to_M1_RMSE_ratio'] < 1 for r in rows),
                  'recording_count': len(rows),
              }

          alpha_curves = {
              'M1': [
                  {
                      'alpha': c['alpha'],
                      'recording_balanced_mean_NRMSE': c['selection_recording_balanced_mean_nrmse'],
                  }
                  for c in results['M1_candidates']
              ],
              'M2': [
                  {
                      'alpha': c['alpha'],
                      'recording_balanced_mean_NRMSE': c['selection_recording_balanced_mean_nrmse'],
                  }
                  for c in results['M2_candidates']
              ],
          }

          coefficient_diagnostics = {}
          for horizon, payload in model['M2_neural_plus_behavior']['models_by_horizon'].items():
              coef = payload['coef']
              behavior = coef[:14]
              neural = coef[14:]
              coefficient_diagnostics[horizon] = {
                  'behavior_L2': math.sqrt(sum(x*x for x in behavior)),
                  'neural_L2': math.sqrt(sum(x*x for x in neural)),
                  'behavior_abs_sum': sum(abs(x) for x in behavior),
                  'neural_abs_sum': sum(abs(x) for x in neural),
                  'nonzero_behavior': sum(abs(x) > 1e-12 for x in behavior),
                  'nonzero_neural': sum(abs(x) > 1e-12 for x in neural),
              }

          payload = {
              'schema': 'bio-001-s34-frozen-result-diagnostics-v1',
              'artifact_id': 8936538518,
              'source_run_id': 31020820102,
              'source_artifact_digest': 'sha256:9977815c63ce2b0676a703fdd70859d1711d5cb05304eb4d1635536ae46c5fa2',
              'run_status': run['status'],
              'development_pass': gate['pass'],
              'checks': gate['checks'],
              'selected_alpha': {
                  'M1_behavior_only': results['M1_selected_alpha'],
                  'M2_neural_plus_behavior': results['M2_selected_alpha'],
              },
              'per_horizon': per_horizon,
              'per_recording': per_recording,
              'alpha_curves': alpha_curves,
              'coefficient_diagnostics': coefficient_diagnostics,
              'training_recordings': extraction['training']['recordings'],
              'development_recordings': extraction['development']['recordings'],
              'sample_counts': extraction['sample_counts'],
              'independent_audit_status': audit['status'],
              'holdout_requested': False,
              'holdout_opened': False,
              'CeRSI_v2_delta': 0.0,
          }
          Path('s34_result_diagnostics.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True, allow_nan=False)
          )
          compact = {
              'status': payload['run_status'],
              'per_horizon': per_horizon,
              'h10_records': per_recording['10'],
              'alpha_curves': alpha_curves,
              'coefficient_diagnostics': coefficient_diagnostics,
              'training_recording_count': len(payload['training_recordings']),
              'development_recording_count': len(payload['development_recordings']),
          }
          print('BIO001_S34_DIAGNOSTICS=' + json.dumps(compact, sort_keys=True, allow_nan=False))
          PY

      - name: Upload frozen result diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: bio001-s34-frozen-result-diagnostics
          path: s34_result_diagnostics.json
          compression-level: 9
          retention-days: 30
          if-no-files-found: error
