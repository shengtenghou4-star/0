name: case-bio001-s26-osf

on:
  pull_request:
    paths:
      - 'cases/bio001-s26-osf/**'

permissions:
  contents: read

jobs:
  train-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade numpy scipy scikit-learn requests
      - run: python cases/bio001-s26-osf/train_dev.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bio001-s26-osf-train-dev
          path: cases/bio001-s26-osf/artifacts/
          if-no-files-found: error
          retention-days: 30
