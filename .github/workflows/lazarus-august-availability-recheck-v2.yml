name: LAZARUS August archive availability recheck v2

on:
  pull_request:
    paths:
      - ".github/workflows/lazarus-august-availability-recheck-v2.yml"
      - "cases/lazarus-august-commit-v1/hash_target.py"

permissions:
  contents: read

jobs:
  hash-only:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recheck exact archive without opening target files
        run: python cases/lazarus-august-commit-v1/hash_target.py
      - name: Enforce frozen isolation boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('cases/lazarus-august-commit-v1/artifacts/TARGET_ARCHIVE_HASH_COMMITMENT.json')
          value = json.loads(path.read_text())
          assert value['release'] == '2026-08-01'
          assert value['status'] in {
              'TARGET_ARCHIVE_HASH_COMMITTED',
              'ABORT_TARGET_UNAVAILABLE',
              'ABORT_TARGET_ARCHIVE_UNAVAILABLE_CURRENT_FILES_PUBLISHED',
          }
          assert value['archive_members_listed'] == 0
          assert value['archive_members_extracted'] == 0
          assert value['target_rows_parsed'] == 0
          assert value['target_values_read'] == 0
          assert value['model_fits'] == 0
          assert value['private_bytes_read'] == 0
          assert value['substitution_used'] is False
          assert value['current_files_opened'] == 0
          assert value['current_file_bytes_read'] == 0
          if value['status'] == 'TARGET_ARCHIVE_HASH_COMMITTED':
              assert value['archive_bytes'] > 0
              assert len(value['archive_sha256']) == 64
              assert value['http_status'] == 200
          else:
              assert value['archive_sha256'] is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lazarus-august-archive-availability-recheck-v2
          path: cases/lazarus-august-commit-v1/artifacts/TARGET_ARCHIVE_HASH_COMMITMENT.json
          if-no-files-found: error
          retention-days: 1
