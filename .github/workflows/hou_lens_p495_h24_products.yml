name: HOU-LENS P4.9.5 H24 product metadata

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-products:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - run: python -m py_compile hou_lens_p495_h24/p495_h24_resolve_products.py
      - run: python hou_lens_p495_h24/p495_h24_resolve_products.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p495-h24-product-metadata
          path: p495_h24_product_artifact/
          if-no-files-found: error
