name: Inspect Engine 8e47

on:
  push:
    paths:
      - '.github/workflows/inspect-engine-8e47.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Extract private engine sources
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile, urllib.parse, urllib.request
          token=os.environ['LAB_QUEUE_TOKEN']; repo='shengtenghou4-star/00'; ref='main'; cid='8e47fe6a0738c37c3107c46e1a8b8815'
          def fetch(path):
              q=urllib.parse.urlencode({'ref':ref})
              url=f'https://api.github.com/repos/{repo}/contents/{path}?{q}'
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'inspect-engine-8e47'})
              with urllib.request.urlopen(req,timeout=120) as r: env=json.load(r)
              return base64.b64decode(env['content'])
          wrapper=fetch(f'relay/requests/{cid}/payload.tar.gz.b64')
          raw=base64.b64decode(b''.join(wrapper.split()),validate=True)
          out={'schema':1,'capsule_id':cid,'archive_sha256':hashlib.sha256(raw).hexdigest(),'files':{}}
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              for name in ('run.sh','task.py','runner.cpp','input.json'):
                  m=tf.getmember(name); data=tf.extractfile(m).read()
                  out['files'][name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'content':data.decode('utf-8','replace')}
          payload=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode()
          path='relay/engine-inspections/8e47fe6a0738c37c3107c46e1a8b8815.json'
          body=json.dumps({'message':'Store opaque engine source inspection','content':base64.b64encode(payload).decode(),'branch':'results'},separators=(',',':')).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=body,method='PUT',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'inspect-engine-8e47'})
          with urllib.request.urlopen(req,timeout=120) as r: r.read()
          PY
