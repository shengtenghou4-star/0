name: BIO-001 S45 Phase A source freeze

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-freeze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install compile runtime
        run: python -m pip install "numpy==2.5.1" "scipy==1.17.0"
      - name: Print and compile public executable bytes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum tools/s42_canonical_reconstruction.py tools/s43_calcium_innovation.py tools/bio001_s42_acquire.py tools/s45_phaseA.py tools/s45_phaseA_audit.py
          python -m py_compile tools/s42_canonical_reconstruction.py tools/s43_calcium_innovation.py tools/bio001_s42_acquire.py tools/s45_phaseA.py tools/s45_phaseA_audit.py
          echo S45_SOURCE_FREEZE_DIAGNOSTIC_PASS
