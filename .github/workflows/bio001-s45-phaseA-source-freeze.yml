name: BIO-001 S45 audit source freeze

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-source-freeze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Print and compile corrected audit only
        shell: bash
        run: |
          set -euo pipefail
          sha256sum tools/s45_phaseA_portable.py tools/s45_phaseA_audit_portable.py
          python -m py_compile tools/s45_phaseA_portable.py tools/s45_phaseA_audit_portable.py
          echo S45_AUDIT_NULL_HANDLING_SOURCE_FREEZE_PASS
