name: HOU-LENS P4.9.8 Grade-A exact control coordinate recovery

on:
  pull_request:
    branches:
      - compute/hou-lens-control-coordinate-vizier-recovery
    paths:
      - '.github/workflows/hou_lens_gradea_control_coordinate_vizier_recovery.yml'
      - 'hou_lens_control_coord_recovery/recover_gradea_exact.py'
      - 'hou_lens_gradea_coord_recovery_launch.txt'

permissions:
  contents: read

jobs:
  recover-gradea:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compute/hou-lens-gradea-control-coordinate-vizier-recovery
          fetch-depth: 0

      - name: Generate one-time input recipient certificate
        run: |
          set -euo pipefail
          mkdir -p runner_handshake
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out runner_handshake/private.pem >/dev/null 2>&1
          openssl req -new -x509 -key runner_handshake/private.pem -out runner_handshake/cert.pem -days 1 -subj '/CN=HOU-LENS-P498-GradeA-Control-Coordinate-Recovery/' >/dev/null 2>&1
          sha256sum runner_handshake/cert.pem | awk '{print $1}' > runner_handshake/cert.sha256
          echo 'b18615d7f8a1e3be27baad05171edb7db38569d7901fecf80d74899ce5403caf' > runner_handshake/expected_request.sha256

      - name: Publish public handshake only
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p498-gradea-coordinate-public-handshake
          path: |
            runner_handshake/cert.pem
            runner_handshake/cert.sha256
            runner_handshake/expected_request.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Wait for encrypted exact-ID request
        run: |
          set -euo pipefail
          cert_sha=$(cat runner_handshake/cert.sha256)
          branch='compute/hou-lens-gradea-control-coordinate-vizier-recovery'
          ref="refs/remotes/origin/$branch"
          found=0
          for i in $(seq 1 210); do
            git fetch -q origin "+refs/heads/$branch:$ref"
            if git cat-file -e "$ref":hou_lens_gradea_coord_inbox/v1/envelope.json 2>/dev/null; then
              git show "$ref":hou_lens_gradea_coord_inbox/v1/envelope.json > /tmp/env.json
              addressed=$(python -c "import json;print(json.load(open('/tmp/env.json')).get('runner_cert_sha256',''))")
              part_count=$(python -c "import json;print(int(json.load(open('/tmp/env.json')).get('payload_part_count',0)))")
              if [ "$addressed" = "$cert_sha" ] && [ "$part_count" -gt 0 ] && [ "$part_count" -le 4 ]; then
                : > /tmp/payload.b64
                ok=1
                for part_index in $(seq 0 $((part_count-1))); do
                  part=$(printf 'hou_lens_gradea_coord_inbox/v1/part%02d.b64' "$part_index")
                  if ! git cat-file -e "$ref:$part" 2>/dev/null; then ok=0; break; fi
                  git show "$ref:$part" >> /tmp/payload.b64
                done
                if [ "$ok" = 1 ]; then found=1; break; fi
              fi
            fi
            sleep 8
          done
          [ "$found" = 1 ] || { echo 'No correctly addressed Grade-A coordinate ciphertext arrived'; exit 20; }
          python - <<'PY'
          import hashlib,json,pathlib
          e=json.load(open('/tmp/env.json')); raw=pathlib.Path('/tmp/payload.b64').read_bytes()
          if e.get('request_sha256')!='b18615d7f8a1e3be27baad05171edb7db38569d7901fecf80d74899ce5403caf': raise SystemExit('request envelope gate failed')
          if e.get('result_cert_sha256')!='3074cc6af3830060533d58d0f3b6aefc4c2d1dfaac4f257e2ab0590a8033b7e5': raise SystemExit('result cert envelope gate failed')
          if hashlib.sha256(raw).hexdigest()!=e.get('payload_base64_sha256'): raise SystemExit('payload base64 SHA gate failed')
          PY
          base64 -d /tmp/payload.b64 > /tmp/payload.der
          [ "$(sha256sum /tmp/payload.der | awk '{print $1}')" = "$(python -c "import json;print(json.load(open('/tmp/env.json'))['payload_der_sha256'])")" ] || exit 21
          openssl cms -decrypt -binary -inform DER -recip runner_handshake/cert.pem -inkey runner_handshake/private.pem -in /tmp/payload.der -out /tmp/private_input.tar.gz
          [ "$(sha256sum /tmp/private_input.tar.gz | awk '{print $1}')" = "$(python -c "import json;print(json.load(open('/tmp/env.json'))['payload_targz_sha256'])")" ] || exit 22
          mkdir private_input
          tar -xzf /tmp/private_input.tar.gz -C private_input
          test -f private_input/request.json
          test -f private_input/result-cert.pem
          echo 'Encrypted Grade-A exact-ID coordinate request decrypted; identifiers suppressed.'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact recovery dependency
        run: python -m pip install --disable-pip-version-check requests==2.34.2

      - name: Recover 48 exact catalog coordinates
        run: python hou_lens_control_coord_recovery/recover_gradea_exact.py

      - name: Encrypt private coordinate evidence
        if: always()
        run: |
          set -euo pipefail
          if [ ! -d private_output ] || [ ! -f private_input/result-cert.pem ]; then
            echo 'No encryptable coordinate evidence exists for this attempt.'
            exit 0
          fi
          mkdir -p public_result
          tar -czf /tmp/private_output.tar.gz private_output
          openssl cms -encrypt -aes-256-cbc -binary -outform DER -in /tmp/private_output.tar.gz -out public_result/encrypted_coordinate_result.cms.der private_input/result-cert.pem
          python - <<'PY'
          import hashlib,json,pathlib
          pre=pathlib.Path('public_result/public_summary.pre_encryption.json')
          p=pathlib.Path('public_result/encrypted_coordinate_result.cms.der')
          if pre.exists():
              d=json.loads(pre.read_text())
              pre.unlink()
          else:
              d={'schema_version':1,'protocol':'HOU-LENS-P4.9.8-GRADEA-CONTROL-COORDINATE-PROVENANCE-RECOVERY-VIZIER','status':'ENCRYPTED_FAIL_CLOSED_DIAGNOSTIC','request_sha256':'b18615d7f8a1e3be27baad05171edb7db38569d7901fecf80d74899ce5403caf'}
          d['encrypted_result_bytes']=p.stat().st_size
          d['encrypted_result_sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          d['result_cert_sha256']='3074cc6af3830060533d58d0f3b6aefc4c2d1dfaac4f257e2ab0590a8033b7e5'
          d['public_payload_contains_private_plaintext']=False
          pathlib.Path('public_result/public_summary.json').write_text(json.dumps(d,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps({k:d.get(k) for k in ['status','request_count','recovered_count','batch_count','encrypted_result_bytes','encrypted_result_sha256']},indent=2))
          PY
          rm -rf private_input private_output /tmp/private_input.tar.gz /tmp/private_output.tar.gz /tmp/payload.der /tmp/payload.b64 /tmp/env.json runner_handshake/private.pem

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p498-gradea-coordinate-encrypted-result
          path: public_result/
          if-no-files-found: warn
          retention-days: 90
