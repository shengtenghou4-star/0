name: BIO-001 S38 multiscale causal integrability

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s38-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install frozen runtime
        run: python -m pip install "numpy==2.3.5" "scipy==1.17.0"

      - name: Decode and verify frozen scientific pipeline
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum tools/s38_pipeline.py.gz.b64.part00 | awk '{print $1}')" = "46c9c9c1176b35d96be5321a0a5d3cc4cbab58a7751fb61a4998ee9790aa34fe"
          test "$(sha256sum tools/s38_pipeline.py.gz.b64.part01 | awk '{print $1}')" = "29b4222e386bad0cb77fe08b2efc545e32c85242eea551e32e8327de7ce83017"
          test "$(sha256sum tools/s38_pipeline.py.gz.b64.part02 | awk '{print $1}')" = "826e372e6033120301d8a266e19ed2cc8272ffc01c5f95ae7a258ed0f6d9102d"
          test "$(sha256sum tools/s38_pipeline.py.gz.b64.part03 | awk '{print $1}')" = "8b2fac4995c7930e86f688c8d0a5bfc3f61f3e6f2e60f3f77a92b7da256e4c57"
          cat tools/s38_pipeline.py.gz.b64.part00 tools/s38_pipeline.py.gz.b64.part01 tools/s38_pipeline.py.gz.b64.part02 tools/s38_pipeline.py.gz.b64.part03 > tools/s38_pipeline.py.gz.b64.joined
          test "$(sha256sum tools/s38_pipeline.py.gz.b64.joined | awk '{print $1}')" = "6b540745cbe47694651c0c18257c91d692d4431c0b054e99ec73579043a904a3"
          base64 -d tools/s38_pipeline.py.gz.b64.joined | gzip -d > tools/s38_pipeline.py
          test "$(sha256sum tools/s38_pipeline.py | awk '{print $1}')" = "077150c5846941ee38966f905cad8a1f4a662c9f476bc30e867626a11b754848"
          test "$(sha256sum tools/s38_audit.py | awk '{print $1}')" = "1340d731e4d655e2eae6b47e265a9534763a100111f4f70d3262df9ec8de5db8"
          python -m py_compile tools/s38_pipeline.py tools/s38_audit.py tools/bio001_s38_acquire.py

      - name: Acquire and extract verified training archive only
        shell: bash
        run: |
          set -euo pipefail
          python tools/bio001_s38_acquire.py
          mkdir -p s38_data/training
          tar -xzf s38_artifacts/raw/AML310_moving.tar.gz -C s38_data/training

      - name: Execute frozen primary and exact rerun
        shell: bash
        run: |
          set -euo pipefail
          python tools/s38_pipeline.py --training-root s38_data/training --output s38_output_primary
          python tools/s38_pipeline.py --training-root s38_data/training --output s38_output_rerun

      - name: Independent arithmetic controls causality and nonaccess audit
        run: python tools/s38_audit.py

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s38_evidence
          cp tools/s38_pipeline.py tools/s38_audit.py s38_evidence/
          cp s38_output_primary/*.json s38_evidence/
          cp s38_output_rerun/*.json s38_evidence/
          cp s38_independent_audit.json s38_evidence/
          cp s38_artifacts/source_manifest.json s38_evidence/
          cp s38_artifacts/holdout_nonaccess_receipt.json s38_evidence/
          (cd s38_evidence && sha256sum * > manifest.sha256)

      - name: Upload S38 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bio001-s38-multiscale-integrability-evidence
          path: s38_evidence/
          compression-level: 9
          retention-days: 30
          if-no-files-found: warn
