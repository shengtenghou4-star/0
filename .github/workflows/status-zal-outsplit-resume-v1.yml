name: Status ZAL outside split resume v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/status-zal-outsplit-resume-v1.yml'

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Store target workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url='https://api.github.com/repos/shengtenghou4-star/0/actions/workflows/matrix-zal-outsplit-resume-v1.yml/runs?per_page=5'
          req=urllib.request.Request(url,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'status-zal-resume'})
          with urllib.request.urlopen(req,timeout=120) as r:data=json.load(r)
          out={'schema':1,'workflow':'matrix-zal-outsplit-resume-v1.yml','runs':[{k:x.get(k) for k in ('id','status','conclusion','run_number','head_sha','created_at','updated_at','html_url')} for x in data.get('workflow_runs',[])]}
          open('status-zal-outsplit-resume-v1.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add status-zal-outsplit-resume-v1.json
          git commit -m 'Update bounded ZAL continuation status' || exit 0
          git push
