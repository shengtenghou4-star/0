name: Matrix ZAL Fourth2 Residual Attack

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/matrix-zal-fourth2-residual.yml'

permissions:
  contents: read

concurrency:
  group: matrix-zal-fourth2-residual
  cancel-in-progress: false

jobs:
  execute:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case_id:
          - b_8_9_9_9__n_8_8_10
          - b_8_9_9_9__n_8_9_9
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Recover parent evidence and frozen sources
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
          REQUEST_ID: 7a8f9b71d34e4a0c8f1256e7b903dc42
          CASE_ID: ${{ matrix.case_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zal /tmp/result
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.parse,urllib.request
          token=os.environ['LAB_QUEUE_TOKEN']; request=os.environ['REQUEST_ID']; case=os.environ['CASE_ID']; repo='shengtenghou4-star/00'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'zal-fourth2'}
          def fetch(path,ref='main'):
              q=urllib.parse.urlencode({'ref':ref}); req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}?{q}',headers=headers)
              with urllib.request.urlopen(req,timeout=180) as r: env=json.load(r)
              return base64.b64decode(env['content']),env['sha']
          raw,_=fetch(f'relay/requests/{request}/input.json'); inp=json.loads(raw)
          if inp.get('schema')!='profile37-fourth-orbit-two-case-request/v1' or inp.get('request_id')!=request or case not in inp['cases']: raise SystemExit('request identity failure')
          conf=inp['cases'][case]; auth=inp['authority']
          files={}
          for name,path,ref,expected_blob in [
              ('live26-checkpoint.json',auth['live26_path'],'main',auth['live26_git_blob']),
              ('profile37_outside_degree_split_cnf.py',auth['base_builder_path'],'main',auth['base_builder_git_blob']),
              ('profile37_outside_degree_dual_bound_case.py',auth['dual_builder_path'],'main',auth['dual_builder_git_blob']),
              ('profile37_dual_third_orbit_cover.py',auth['old_orbit_path'],'main',auth['old_orbit_git_blob']),
              ('profile37_local_codegree_moment_case.py',auth['moment_builder_path'],'main',auth['moment_builder_git_blob']),
              ('profile37_unknown_third_to_fourth_orbit_cover.py',auth['fourth_cover_path'],'main',auth['fourth_cover_git_blob']),
              ('cadical_assumption_cube_runner.cpp',auth['cube_runner_path'],'main',auth['cube_runner_git_blob']),
              ('open-frontier-v1.json',auth['frontier_path'],auth['frontier_ref'],auth['frontier_git_blob']),
          ]:
              data,blob=fetch(path,ref)
              if blob!=expected_blob: raise SystemExit(f'blob mismatch {name}: {blob} != {expected_blob}')
              files[name]=data
          prefix=conf['parent_prefix']; pref=conf['parent_ref']
          parent_cover,cover_blob=fetch(f'{prefix}/cover/third-orbit-cover.json',pref)
          parent_results,results_blob=fetch(f'{prefix}/orbit-results.tsv',pref)
          parent_summary,summary_blob=fetch(f'{prefix}/summary.json',pref)
          if cover_blob!=conf['parent_cover_git_blob'] or results_blob!=conf['parent_results_git_blob'] or summary_blob!=conf['parent_summary_git_blob']: raise SystemExit('parent git-blob binding failure')
          if hashlib.sha256(parent_cover).hexdigest()!=conf['parent_cover_sha256']: raise SystemExit('parent cover sha256 failure')
          summary=json.loads(parent_summary)
          if summary.get('case_id')!=case or summary.get('class_verdict')!='OPEN' or summary.get('completed_branches')!=conf['parent_branch_count'] or summary.get('status_counts')!={'SAT':0,'UNKNOWN':conf['parent_unknown_count'],'UNSAT':conf['parent_unsat_count']} or summary.get('dual_cnf_sha256')!=conf['dual_cnf_sha256'] or summary.get('rebuilt_base_cnf_sha256')!=conf['base_cnf_sha256'] or summary.get('binding_pass') is not True: raise SystemExit('parent summary contract failure')
          live=json.loads(files['live26-checkpoint.json'])
          if live.get('accepted_explicit_unsat_cases')!=26 or case not in live.get('residual_open_cases',[]): raise SystemExit('live26 contract failure')
          frontier=json.loads(files['open-frontier-v1.json']); rows={r.get('expected_case_id_from_payload') or r.get('directory'):r for r in frontier['open_cases']}; src=rows.get(case)
          if not src or src.get('cnf_sha256')!=conf['base_cnf_sha256']: raise SystemExit('frontier/base binding failure')
          root=pathlib.Path('/tmp/zal')
          for name,data in files.items(): (root/name).write_bytes(data)
          (root/'input.json').write_bytes(raw); (root/'parent-cover.json').write_bytes(parent_cover); (root/'parent-results.tsv').write_bytes(parent_results); (root/'parent-summary.json').write_bytes(parent_summary)
          meta={'case_id':case,'second_only':conf['second_only'],'neither':conf['neither'],'expected_base_cnf_sha256':conf['base_cnf_sha256'],'expected_dual_cnf_sha256':conf['dual_cnf_sha256'],'source_report_sha256':src['report_sha256'],'parent_cover_git_blob':cover_blob,'parent_results_git_blob':results_blob,'parent_summary_git_blob':summary_blob}
          (root/'case-meta.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'case_id':case,'parent_status_counts':summary['status_counts'],'expected_fourth':conf['retained_fourth_branches']},sort_keys=True))
          PY
          python -m py_compile /tmp/zal/*.py

      - name: Build fixed CaDiCaL and runner
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/arminbiere/cadical.git /tmp/cadical >/dev/null 2>&1
          git -C /tmp/cadical checkout c60730422e758ef1cebe7aeddf2dda31c996bf04 >/dev/null 2>&1
          (cd /tmp/cadical && ./configure >/dev/null && make -j2 >/dev/null)
          g++ -O3 -std=c++17 /tmp/zal/cadical_assumption_cube_runner.cpp -I/tmp/cadical/src /tmp/cadical/build/libcadical.a -lpthread -o /tmp/zal/orbit-runner
          git -C /tmp/cadical rev-parse HEAD > /tmp/result/cadical-source-commit.txt
          /tmp/cadical/build/cadical --version > /tmp/result/cadical-version.txt
          sha256sum /tmp/zal/orbit-runner > /tmp/result/orbit-runner.sha256
          sha256sum /tmp/zal/profile37_unknown_third_to_fourth_orbit_cover.py > /tmp/result/fourth-cover-source.sha256

      - name: Build Moment4 CNF and exact fourth residual cover
        env:
          CASE_ID: ${{ matrix.case_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/zal'); out=pathlib.Path('/tmp/result'); inp=json.loads((root/'input.json').read_text()); meta=json.loads((root/'case-meta.json').read_text()); conf=inp['cases'][os.environ['CASE_ID']]
          exact=out/'exact'; exact.mkdir(exist_ok=True)
          subprocess.run(['python',str(root/'profile37_local_codegree_moment_case.py'),'--inside','7,8,8,8,8,8,8,8,9','--t','4','--second-only',','.join(map(str,meta['second_only'])),'--neither',','.join(map(str,meta['neither'])),'--expected-case-id',meta['case_id'],'--expected-base-cnf-sha256',meta['expected_base_cnf_sha256'],'--expected-dual-cnf-sha256',meta['expected_dual_cnf_sha256'],'--source-report-sha256',meta['source_report_sha256'],'--frontier-git-blob',inp['authority']['frontier_git_blob'],'--workdir',str(exact),'--build-only'],check=True)
          report=json.loads((exact/'report.json').read_text())
          if report['binding_pass'] is not True or report['base_cnf_sha256']!=conf['base_cnf_sha256'] or report['dual_cnf_sha256']!=conf['dual_cnf_sha256']: raise SystemExit('Moment4 rebuild binding failure')
          cover=out/'cover4'; cover.mkdir(exist_ok=True)
          subprocess.run(['python',str(root/'profile37_unknown_third_to_fourth_orbit_cover.py'),'--second-only',','.join(map(str,meta['second_only'])),'--neither',','.join(map(str,meta['neither'])),'--expected-case-id',meta['case_id'],'--parent-cover',str(root/'parent-cover.json'),'--parent-results',str(root/'parent-results.tsv'),'--outdir',str(cover)],check=True)
          man=json.loads((cover/'fourth-orbit-cover.json').read_text())
          if man['parent_branch_count']!=conf['parent_branch_count'] or man['parent_unsat_count']!=conf['parent_unsat_count'] or man['parent_unknown_count']!=conf['parent_unknown_count'] or man['raw_fourth_count_vectors']!=conf['raw_fourth_count_vectors'] or man['retained_fourth_branches']!=conf['retained_fourth_branches']: raise SystemExit('fourth cover count audit failure')
          for name in ['input.json','case-meta.json','parent-summary.json']: (out/name).write_bytes((root/name).read_bytes())
          PY

      - name: Execute fourth-orbit residual cover
        env:
          CASE_ID: ${{ matrix.case_id }}
        shell: bash
        run: |
          set +e
          LIMIT=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/zal/input.json'))['solver']['conflict_limit_per_fourth_orbit'])
          PY
          )
          /tmp/zal/orbit-runner /tmp/result/exact/moment-model.cnf /tmp/result/cover4/fourth-orbit-tasks.txt "$LIMIT" /tmp/result/fourth-results.tsv > /tmp/result/fourth-runner.log 2>&1
          rc=$?
          printf '%s\n' "$rc" > /tmp/result/fourth-runner-exit.txt
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('/tmp/result'); inp=json.loads((root/'input.json').read_text()); case=os.environ['CASE_ID']; conf=inp['cases'][case]; meta=json.loads((root/'case-meta.json').read_text()); cover=json.loads((root/'cover4'/'fourth-orbit-cover.json').read_text()); exact=json.loads((root/'exact'/'report.json').read_text())
          rows=[]; p=root/'fourth-results.tsv'
          if p.exists():
              for line in p.read_text().splitlines()[1:]:
                  if not line.strip(): continue
                  i,status,seconds,nass=line.split('\t'); rows.append({'id':int(i),'status':status,'seconds':float(seconds),'assumptions':int(nass)})
          counts={s:sum(r['status']==s for r in rows) for s in ['UNSAT','SAT','UNKNOWN']}; expected=cover['retained_fourth_branches']; complete=len(rows)==expected
          verdict='UNSAT' if complete and counts['UNSAT']==expected else 'SAT_CANDIDATE' if counts['SAT'] else 'OPEN'
          summary={'schema':'profile37-fourth-orbit-result/v1','request_id':inp['request_id'],'case_id':case,'parent_run':inp['source_third_run'],'parent_cover_git_blob':meta['parent_cover_git_blob'],'parent_results_git_blob':meta['parent_results_git_blob'],'parent_summary_git_blob':meta['parent_summary_git_blob'],'parent_unsat_count':cover['parent_unsat_count'],'parent_unknown_count':cover['parent_unknown_count'],'source_base_cnf_sha256':conf['base_cnf_sha256'],'rebuilt_base_cnf_sha256':exact['base_cnf_sha256'],'source_dual_cnf_sha256':conf['dual_cnf_sha256'],'rebuilt_dual_cnf_sha256':exact['dual_cnf_sha256'],'moment_cnf_sha256':exact['moment_cnf_sha256'],'binding_pass':exact['binding_pass'] is True and exact['base_cnf_sha256']==conf['base_cnf_sha256'] and exact['dual_cnf_sha256']==conf['dual_cnf_sha256'],'fourth_cover_git_blob':inp['authority']['fourth_cover_git_blob'],'cover_sha256':hashlib.sha256((root/'cover4'/'fourth-orbit-cover.json').read_bytes()).hexdigest(),'tasks_sha256':hashlib.sha256((root/'cover4'/'fourth-orbit-tasks.txt').read_bytes()).hexdigest(),'expected_branches':expected,'completed_branches':len(rows),'status_counts':counts,'runner_exit_code':int((root/'fourth-runner-exit.txt').read_text()),'conflict_limit':inp['solver']['conflict_limit_per_fourth_orbit'],'class_verdict':verdict,'sat_witness_files':sorted(x.name for x in root.glob('fourth-results.tsv.sat.*'))}
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n'); print(json.dumps(summary,sort_keys=True))
          PY
          exit 0

      - name: Store fourth-orbit evidence
        if: always()
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
          REQUEST_ID: 7a8f9b71d34e4a0c8f1256e7b903dc42
          CASE_ID: ${{ matrix.case_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.error,urllib.request
          token=os.environ['LAB_QUEUE_TOKEN']; request=os.environ['REQUEST_ID']; case=os.environ['CASE_ID']; run=os.environ['RUN_ID']; attempt=os.environ['RUN_ATTEMPT']; repo='shengtenghou4-star/00'; root=pathlib.Path('/tmp/result')
          branch=f'zal-fourth2-stage-{run}-{attempt}-{case}'; headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'zal-fourth2-stage'}
          with urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/git/ref/heads/results',headers=headers),timeout=120) as r: base=json.load(r)['object']['sha']
          body=json.dumps({'ref':f'refs/heads/{branch}','sha':base}).encode()
          try: urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/git/refs',data=body,method='POST',headers=headers),timeout=120).read()
          except urllib.error.HTTPError as exc:
              if exc.code!=422: raise
          def put(path,data,msg):
              body=json.dumps({'message':msg,'content':base64.b64encode(data).decode(),'branch':branch},separators=(',',':')).encode(); req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=body,method='PUT',headers=headers); urllib.request.urlopen(req,timeout=300).read()
          prefix=f'relay/staging/{request}/{run}-{attempt}/{case}'
          for rel in ['summary.json','fourth-results.tsv','fourth-runner-exit.txt','cadical-source-commit.txt','cadical-version.txt','orbit-runner.sha256','fourth-cover-source.sha256','cover4/fourth-orbit-cover.json','cover4/fourth-orbit-cover.sha256','cover4/fourth-orbit-tasks.sha256','exact/report.json','exact/report.sha256','case-meta.json','parent-summary.json']:
              p=root/rel
              if p.exists(): put(f'{prefix}/{rel}',p.read_bytes(),f'Store ZAL fourth2 {case} {rel}')
          receipt={'schema':1,'request_id':request,'run_id':run,'run_attempt':attempt,'case_id':case,'staging_branch':branch,'summary_sha256':hashlib.sha256((root/'summary.json').read_bytes()).hexdigest() if (root/'summary.json').exists() else None}
          put(f'{prefix}/receipt.json',(json.dumps(receipt,indent=2,sort_keys=True)+'\n').encode(),f'Store ZAL fourth2 {case} receipt'); print(json.dumps(receipt,sort_keys=True))
          PY

  merge:
    if: always()
    needs: execute
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Merge fourth-orbit evidence
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
          REQUEST_ID: 7a8f9b71d34e4a0c8f1256e7b903dc42
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,urllib.error,urllib.parse,urllib.request,time
          token=os.environ['LAB_QUEUE_TOKEN']; request=os.environ['REQUEST_ID']; run=os.environ['RUN_ID']; attempt=os.environ['RUN_ATTEMPT']; repo='shengtenghou4-star/00'; cases=['b_8_9_9_9__n_8_8_10','b_8_9_9_9__n_8_9_9']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'zal-fourth2-merge'}
          def fetch(path,ref):
              q=urllib.parse.urlencode({'ref':ref}); req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}?{q}',headers=headers)
              with urllib.request.urlopen(req,timeout=180) as r: env=json.load(r)
              return base64.b64decode(env['content'])
          inp=json.loads(fetch(f'relay/requests/{request}/input.json','main')); summaries=[]; missing=[]; failures=[]
          for case in cases:
              branch=f'zal-fourth2-stage-{run}-{attempt}-{case}'; prefix=f'relay/staging/{request}/{run}-{attempt}/{case}'
              try: raw=fetch(f'{prefix}/summary.json',branch); receipt=json.loads(fetch(f'{prefix}/receipt.json',branch))
              except Exception: missing.append(case); continue
              s=json.loads(raw); conf=inp['cases'][case]
              checks=[s.get('request_id')==request,s.get('case_id')==case,s.get('binding_pass') is True,s.get('parent_cover_git_blob')==conf['parent_cover_git_blob'],s.get('parent_results_git_blob')==conf['parent_results_git_blob'],s.get('parent_summary_git_blob')==conf['parent_summary_git_blob'],s.get('expected_branches')==conf['retained_fourth_branches'],s.get('fourth_cover_git_blob')==inp['authority']['fourth_cover_git_blob'],receipt.get('summary_sha256')==hashlib.sha256(raw).hexdigest()]
              if not all(checks): failures.append(case); continue
              if s.get('class_verdict')=='UNSAT' and not (s.get('completed_branches')==s.get('expected_branches') and s.get('status_counts',{}).get('UNSAT')==s.get('expected_branches') and s.get('status_counts',{}).get('SAT')==0 and s.get('status_counts',{}).get('UNKNOWN')==0 and s.get('runner_exit_code')==20): failures.append(case); continue
              summaries.append(s)
          unsat=sorted(s['case_id'] for s in summaries if s['class_verdict']=='UNSAT'); sat=sorted(s['case_id'] for s in summaries if s['class_verdict']=='SAT_CANDIDATE'); open_ids=sorted(set(cases)-set(unsat)-set(sat))
          merged={'schema':'profile37-fourth2-merged-cover/v1','request_id':request,'run_id':run,'run_attempt':attempt,'expected_case_ids':cases,'received_case_ids':sorted(s['case_id'] for s in summaries),'missing_case_ids':missing,'integrity_failures':failures,'new_unsat_case_ids':unsat,'new_sat_candidate_case_ids':sat,'new_open_case_ids':open_ids,'summaries':sorted(summaries,key=lambda x:x['case_id']),'candidate_verdict':'BOTH_UNSAT_CANDIDATE' if len(unsat)==2 and not sat and not missing and not failures else 'SAT_CANDIDATE' if sat else 'PARTIAL_OPEN'}
          raw=(json.dumps(merged,indent=2,sort_keys=True)+'\n').encode(); final=f'zal-fourth2-final-{run}-{attempt}'
          with urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/git/ref/heads/results',headers=headers),timeout=120) as r: base=json.load(r)['object']['sha']
          body=json.dumps({'ref':f'refs/heads/{final}','sha':base}).encode()
          try: urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/git/refs',data=body,method='POST',headers=headers),timeout=120).read()
          except urllib.error.HTTPError as exc:
              if exc.code!=422: raise
          def put(path,data,msg):
              body=json.dumps({'message':msg,'content':base64.b64encode(data).decode(),'branch':final},separators=(',',':')).encode(); req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=body,method='PUT',headers=headers); urllib.request.urlopen(req,timeout=300).read()
          prefix=f'relay/results/{request}/{run}-{attempt}'; put(f'{prefix}/merged-cover.json',raw,'Store ZAL fourth2 merged cover')
          receipt={'schema':1,'request_id':request,'run_id':run,'run_attempt':attempt,'final_branch':final,'merged_cover_sha256':hashlib.sha256(raw).hexdigest(),'candidate_verdict':merged['candidate_verdict'],'finished_unix':int(time.time())}
          put(f'{prefix}/merged-receipt.json',(json.dumps(receipt,indent=2,sort_keys=True)+'\n').encode(),'Store ZAL fourth2 merged receipt'); print(json.dumps(receipt,sort_keys=True))
          PY
