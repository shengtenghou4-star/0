name: Audit ZAL Dual Bound Package

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-zal-dual-bound-package.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REQUEST_ID: 7a8fdb2c4e6f4189a0c3d5e7f1b29460
      SOURCE_RUN_ATTEMPT: 31026240938-2
      SOURCE_BRANCH: zal-dual-bound-31026240938-2
    steps:
      - name: Recover, unpack and adversarially verify
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile, urllib.parse, urllib.request
          token=os.environ['LAB_QUEUE_TOKEN']; request=os.environ['REQUEST_ID']; source=os.environ['SOURCE_RUN_ATTEMPT']; branch=os.environ['SOURCE_BRANCH']; repo='shengtenghou4-star/00'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'audit-zal-dual-bound'}
          def fetch(path,ref):
              q=urllib.parse.urlencode({'ref':ref})
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}?{q}',headers=headers)
              with urllib.request.urlopen(req,timeout=180) as r: env=json.load(r)
              return base64.b64decode(env['content'])
          prefix=f'relay/results/{request}/{source}'
          receipt_raw=fetch(f'{prefix}/receipt.json',branch); summary_raw=fetch(f'{prefix}/summary.json',branch); package=fetch(f'{prefix}/package.tar.gz',branch)
          receipt=json.loads(receipt_raw); summary=json.loads(summary_raw)
          failures=[]
          def check(name,value):
              if not value: failures.append(name)
          check('receipt_request',receipt.get('request_id')==request)
          check('receipt_source',f"{receipt.get('run_id')}-{receipt.get('run_attempt')}"==source)
          check('receipt_status',receipt.get('status')=='PASS_BUILD_ONLY_NO_PROOF_CREDIT')
          check('package_hash',hashlib.sha256(package).hexdigest()==receipt.get('package_sha256'))
          check('summary_hash',hashlib.sha256(summary_raw).hexdigest()==receipt.get('summary_sha256'))
          check('summary_status',summary.get('status')=='PASS_BUILD_ONLY_NO_PROOF_CREDIT')
          check('summary_case_count',summary.get('case_count')==9)
          check('summary_case_uniqueness',len(summary.get('case_ids',[]))==len(set(summary.get('case_ids',[])))==9)
          check('base_reproduction',summary.get('all_base_hashes_reproduced') is True)
          check('dual_hash_uniqueness',summary.get('unique_dual_cnf_hashes')==9)
          check('bounds',summary.get('pair_bound')==30 and summary.get('column_star_bound')==240)
          check('families',summary.get('pair_families')==136 and summary.get('column_star_families')==17)
          root=pathlib.Path('/tmp/unpack'); root.mkdir()
          with tarfile.open(fileobj=io.BytesIO(package),mode='r:gz') as tf:
              for member in tf.getmembers():
                  p=pathlib.Path(member.name)
                  if p.is_absolute() or '..' in p.parts or member.issym() or member.islnk() or member.isdev(): raise SystemExit('unsafe archive')
              tf.extractall(root,filter='data')
          check('archived_summary', (root/'summary.json').exists() and (root/'summary.json').read_bytes()==summary_raw)
          check('test_log_present',(root/'dual-bound-test.log').exists())
          if (root/'dual-bound-test.log').exists(): check('test_log_pass',"'status': 'PASS'" in (root/'dual-bound-test.log').read_text())
          reports=summary.get('reports',[]); check('reports_count',len(reports)==9)
          ids=[]; base_hashes=[]; dual_hashes=[]
          for row in reports:
              cid=row.get('case_id'); ids.append(cid); base_hashes.append(row.get('base_cnf_sha256')); dual_hashes.append(row.get('dual_cnf_sha256'))
              case_dir=root/'cases'/str(cid)
              check(f'{cid}:report_present',(case_dir/'report.json').exists())
              check(f'{cid}:report_sha_present',(case_dir/'report.sha256').exists())
              check(f'{cid}:cnf_discarded',not (case_dir/'base-model.cnf').exists() and not (case_dir/'dual-model.cnf').exists())
              if (case_dir/'report.json').exists():
                  report_raw=(case_dir/'report.json').read_bytes(); report=json.loads(report_raw)
                  check(f'{cid}:report_sha',hashlib.sha256(report_raw).hexdigest()==(case_dir/'report.sha256').read_text().strip())
                  check(f'{cid}:identity',report.get('case_id')==cid and report.get('status')=='BUILT_ONLY' and report.get('binding_pass') is True)
                  check(f'{cid}:base_hash',report.get('base_cnf_sha256')==row.get('base_cnf_sha256'))
                  check(f'{cid}:dual_hash',report.get('dual_cnf_sha256')==row.get('dual_cnf_sha256'))
                  dual=report.get('dual_bounds',{})
                  check(f'{cid}:dual_constants',dual.get('dual_column_pair_bound')==30 and dual.get('dual_column_star_bound')==240 and dual.get('dual_column_pair_families')==136 and dual.get('dual_column_star_families')==17)
                  check(f'{cid}:positive_delta',dual.get('added_variables',0)>0 and dual.get('added_clauses',0)>0)
          check('ids_match',ids==summary.get('case_ids'))
          check('base_hash_count',len(base_hashes)==9 and all(base_hashes))
          check('dual_hash_count',len(set(dual_hashes))==9 and all(dual_hashes))
          audit={'schema':'profile37-dual-bound-adversarial-audit/v1','request_id':request,'source_run_attempt':source,'source_branch':branch,'receipt_git_binding':{'package_sha256':receipt.get('package_sha256'),'summary_sha256':receipt.get('summary_sha256')},'audited_case_count':len(reports),'failures':failures,'verdict':'ACCEPT_METHOD_BUILD_AUDIT' if not failures else 'REJECT_NO_METHOD_CREDIT','global_checkpoint_increment':0,'paper_versions':summary.get('paper_versions')}
          raw=(json.dumps(audit,indent=2,sort_keys=True)+'\n').encode(); pathlib.Path('/tmp/adversarial-audit.json').write_bytes(raw)
          if failures: raise SystemExit(json.dumps(audit,sort_keys=True))
          print(json.dumps(audit,sort_keys=True))
          PY

      - name: Store private adversarial audit
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.request
          token=os.environ['LAB_QUEUE_TOKEN']; request=os.environ['REQUEST_ID']; source=os.environ['SOURCE_RUN_ATTEMPT']; repo='shengtenghou4-star/00'; branch=f'zal-dual-bound-audit-{source}'
          data=open('/tmp/adversarial-audit.json','rb').read(); headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'audit-zal-dual-bound-store'}
          with urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/git/ref/heads/results',headers=headers),timeout=120) as r: base=json.load(r)['object']['sha']
          body=json.dumps({'ref':f'refs/heads/{branch}','sha':base}).encode()
          try:
              with urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/git/refs',data=body,method='POST',headers=headers),timeout=120) as r: r.read()
          except urllib.error.HTTPError as exc:
              if exc.code!=422: raise
          path=f'relay/focused-inspections/{request}/{source}/adversarial-audit-v1.json'; body=json.dumps({'message':'Store ZAL dual-bound adversarial audit','content':base64.b64encode(data).decode(),'branch':branch},separators=(',',':')).encode()
          with urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=body,method='PUT',headers=headers),timeout=180) as r: r.read()
          PY
