name: Matrix G

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/g.yml'

permissions:
  contents: read

concurrency:
  group: matrix-g
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Inspect private opaque results
        shell: bash
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile, urllib.parse, urllib.request
          token=os.environ['LAB_QUEUE_TOKEN']; repo='shengtenghou4-star/00'; branch='results'
          targets=[
            ('8e47fe6a0738c37c3107c46e1a8b8815','30630015947-1'),
            ('b4dadfb90754737a047544541558dcc7','30630943505-1'),
          ]
          def api(path, *, accept='application/vnd.github+json', method='GET', data=None):
              safe='/'.join(urllib.parse.quote(x,safe='') for x in path.split('/'))
              url=f'https://api.github.com/repos/{repo}/contents/{safe}'
              if method=='GET': url += '?' + urllib.parse.urlencode({'ref':branch})
              headers={'Authorization':f'Bearer {token}','Accept':accept,'X-GitHub-Api-Version':'2022-11-28','User-Agent':'matrix-g'}
              if data is not None: headers['Content-Type']='application/json'
              req=urllib.request.Request(url,data=data,method=method,headers=headers)
              with urllib.request.urlopen(req,timeout=300) as r: return r.read()
          def put(path, content):
              body=json.dumps({'message':'Store opaque result inspection','content':base64.b64encode(content).decode(),'branch':branch},separators=(',',':')).encode()
              api(path,method='PUT',data=body)
          for cid,run in targets:
              source=f'relay/results/{cid}/{run}/result.tar.gz'
              raw=api(source,accept='application/vnd.github.raw+json')
              report={'schema':1,'capsule_id':cid,'run':run,'archive_bytes':len(raw),'archive_sha256':hashlib.sha256(raw).hexdigest(),'members':[],'text':{}}
              with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
                  for m in tf.getmembers():
                      p=pathlib.PurePosixPath(m.name)
                      if p.is_absolute() or '..' in p.parts or m.issym() or m.islnk() or m.isdev(): raise SystemExit('unsafe archive')
                      report['members'].append({'name':m.name,'size':m.size,'type':'file' if m.isfile() else 'other'})
                      if m.isfile() and m.size<=5_000_000 and (m.name.endswith(('.json','.jsonl','.txt','.sha256')) or m.name in ('stdout.txt','stderr.txt','return-code.txt')):
                          data=tf.extractfile(m).read()
                          report['text'][m.name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'content':data.decode('utf-8','replace')}
              out=(json.dumps(report,sort_keys=True,indent=2)+'\n').encode()
              put(f'relay/inspections/{cid}/{run}/inspection.json',out)
          print('Stored opaque inspections.')
          PY
