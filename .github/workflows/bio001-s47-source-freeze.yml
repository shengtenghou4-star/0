name: BIO-001 S47 interaction source freeze

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-freeze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install compile runtime
        run: python -m pip install "numpy==2.5.1" "scipy==1.17.0"
      - name: Print and compile public executable bytes only
        shell: bash
        run: |
          set -euo pipefail
          sha256sum tools/s42_canonical_reconstruction.py tools/s43_calcium_innovation.py tools/s47_interaction_audit.py tools/s47_audit.py tools/bio001_s42_acquire.py
          python -m py_compile tools/s42_canonical_reconstruction.py tools/s43_calcium_innovation.py tools/s47_interaction_audit.py tools/s47_audit.py tools/bio001_s42_acquire.py
          echo S47_SOURCE_FREEZE_PASS
