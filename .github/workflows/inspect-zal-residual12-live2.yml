name: Inspect ZAL Residual12 Live2

on:
  push:
    paths:
      - '.github/workflows/inspect-zal-residual12-live2.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Audit two completed private packages
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile, urllib.parse, urllib.request
          token=os.environ['LAB_QUEUE_TOKEN']
          repo='shengtenghou4-star/00'; branch='results'
          request='7a8f12c0e4b64d3a9f2e5c7b1d8a0f63'; run='30792311484-1'
          cases=['b_8_8_9_9__n_8_8_11','b_9_9_9_9__n_8_8_9']
          expected={
            'mode':'t4:7,8,8,8|8,8,8,8,9',
            'inside':[7,8,8,8,8,8,8,8,9],
            'frontier':'d8407d78795835cbdfe80737cf7b646561af8b91',
            'residual':'1ef1a69fbc5c418fa39028a6fb73c01d75782cf7',
            'cover':'0ada21e204825a2421c8fafef50395e829e27ebe4164fc34f4d5df3d80d1088b',
            'source_package':'6d09573322d84449b438f7c324602c804d276fcebcd226e21effd5066061c63a',
            'source_merged':'3a4702dc24755f2f4658454bbe9e711e0030f3c74abdb06afae4722912ef7a08',
          }
          def fetch(path):
              q=urllib.parse.urlencode({'ref':branch})
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}?{q}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'inspect-zal-residual12-live2'})
              with urllib.request.urlopen(req,timeout=180) as r: env=json.load(r)
              return base64.b64decode(env['content'])
          def put(path,data,message):
              body=json.dumps({'message':message,'content':base64.b64encode(data).decode(),'branch':branch},separators=(',',':')).encode()
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=body,method='PUT',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'inspect-zal-residual12-live2'})
              with urllib.request.urlopen(req,timeout=180) as r: r.read()
          rows=[]; failures=[]; solver_commits=set(); solver_versions=set(); solver_hashes=set()
          for cid in cases:
              prefix=f'relay/results/{request}/{run}/cases/{cid}'
              receipt_raw=fetch(f'{prefix}/receipt.json'); package=fetch(f'{prefix}/result.tar.gz')
              receipt=json.loads(receipt_raw)
              checks={
                'receipt_request':receipt.get('request_id')==request,
                'receipt_run':str(receipt.get('run_id'))=='30792311484' and str(receipt.get('run_attempt'))=='1',
                'receipt_case':receipt.get('case_id')==cid,
                'receipt_package':hashlib.sha256(package).hexdigest()==receipt.get('result_sha256'),
                'receipt_wrapper':receipt.get('wrapper_return_code')==0,
                'receipt_contract':receipt.get('contract_pass') is True,
                'receipt_status':receipt.get('solver_status')=='UNSAT' and receipt.get('solver_exit_code')==20,
              }
              root=pathlib.Path('/tmp')/hashlib.sha256(cid.encode()).hexdigest()[:16]; root.mkdir()
              with tarfile.open(fileobj=io.BytesIO(package),mode='r:gz') as tf:
                  for m in tf.getmembers():
                      p=pathlib.Path(m.name)
                      if p.is_absolute() or '..' in p.parts or m.issym() or m.islnk() or m.isdev(): raise SystemExit('unsafe package')
                  tf.extractall(root,filter='data')
              audit_path=root/'exact'/'case-audit.json'; report_path=root/'exact'/'case'/'report.json'; log_path=root/'exact'/'case'/'solver.log'; recovery_path=root/'source-recovery-receipt.json'
              if not all(p.exists() for p in [audit_path,report_path,log_path,recovery_path]):
                  failures.append(f'{cid}:missing_core_file'); continue
              audit=json.loads(audit_path.read_text()); report=json.loads(report_path.read_text()); recovery=json.loads(recovery_path.read_text())
              checks.update({
                'audit_schema':audit.get('schema')=='profile37-outside-degree-residual-case/v1',
                'audit_target':audit.get('mode')==expected['mode'] and audit.get('inside')==expected['inside'],
                'audit_case':audit.get('case_id')==cid,
                'audit_bindings':audit.get('frontier_git_blob')==expected['frontier'] and audit.get('residual_checkpoint_git_blob')==expected['residual'] and audit.get('complete_cover_patterns_sha256')==expected['cover'] and audit.get('source_package_sha256')==expected['source_package'] and audit.get('source_merged_sha256')==expected['source_merged'],
                'audit_contract':audit.get('contract_pass') is True,
                'report_equal':audit.get('result')==report,
                'report_case':report.get('case_id')==cid,
                'report_status':report.get('status')=='UNSAT' and report.get('exit_code')==20,
                'report_binding':report.get('binding_pass') is True and report.get('frontier_git_blob')==expected['frontier'] and report.get('cnf_sha256')==audit.get('source_cnf_sha256') and report.get('source_report_sha256')==audit.get('source_report_sha256'),
                'solver_log':('UNSATISFIABLE' in log_path.read_text(errors='replace')),
                'recovery':recovery.get('request_id')==request and recovery.get('case_id')==cid and recovery.get('frontier_git_blob')==expected['frontier'] and recovery.get('residual_checkpoint_git_blob')==expected['residual'],
              })
              for filename,target in [('solver-source-commit.txt',solver_commits),('solver-version.txt',solver_versions),('solver.sha256',solver_hashes)]:
                  path=root/filename
                  if not path.exists() or not path.read_text().strip(): checks[f'{filename}_present']=False
                  else: checks[f'{filename}_present']=True; target.add(path.read_text().strip())
              bad=sorted(k for k,v in checks.items() if not v)
              if bad: failures.append(f'{cid}:'+','.join(bad))
              rows.append({'case_id':cid,'checks':checks,'package_sha256':hashlib.sha256(package).hexdigest(),'case_audit_sha256':hashlib.sha256(audit_path.read_bytes()).hexdigest(),'report_sha256':hashlib.sha256(report_path.read_bytes()).hexdigest(),'cnf_sha256':report.get('cnf_sha256'),'variables':report.get('variables'),'clauses':report.get('clauses'),'solver_exit_code':report.get('exit_code'),'solver_status':report.get('status')})
          if len(solver_commits)!=1: failures.append('solver_source_commit_inconsistent')
          if len(solver_versions)!=1: failures.append('solver_version_inconsistent')
          if len(solver_hashes)!=1: failures.append('solver_binary_hash_inconsistent')
          summary={'schema':'profile37-residual12-live-completed-case-audit/v1','request_id':request,'run_attempt':run,'mode':expected['mode'],'inside':expected['inside'],'audited_case_ids':cases,'audited_case_count':len(rows),'explicit_unsat_exit20_count':sum(r['solver_exit_code']==20 and r['solver_status']=='UNSAT' for r in rows),'sat_count':0,'failures':failures,'solver_source_commits':sorted(solver_commits),'solver_versions':sorted(solver_versions),'solver_hashes':sorted(solver_hashes),'rows':rows,'verdict':'ACCEPT_TWO_CASE_LEVEL_UNSAT' if not failures and len(rows)==2 else 'REJECT_NO_PROOF_CREDIT','global_checkpoint_increment':0,'mode_terminal':False}
          raw=(json.dumps(summary,indent=2,sort_keys=True)+'\n').encode()
          put(f'relay/focused-inspections/{request}/{run}/live-completed-2-audit-v1.json',raw,'Store ZAL residual12 live two-case audit')
          if failures: raise SystemExit(json.dumps(failures))
          PY
