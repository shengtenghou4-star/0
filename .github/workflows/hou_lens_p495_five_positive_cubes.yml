name: HOU-LENS P4.9.5 five-positive cube construction

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hou_lens_p495_five_positive_cubes.yml'
      - 'hou_lens_p495_five_positive/**'
      - 'hou_lens_p495_cube_launch.txt'

permissions:
  contents: read

jobs:
  build-cubes:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compute/hou-lens-p495-five-positive-cubes
          fetch-depth: 0
      - name: Generate ephemeral input certificate
        run: |
          set -euo pipefail
          mkdir -p runner_handshake
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out runner_handshake/private.pem >/dev/null 2>&1
          openssl req -new -x509 -key runner_handshake/private.pem -out runner_handshake/cert.pem -days 1 -subj '/CN=HOU-LENS-P4.9.5-Five-Positive-Cubes/' >/dev/null 2>&1
          sha256sum runner_handshake/cert.pem | awk '{print $1}' > runner_handshake/cert.sha256
          echo '1528878b44099ceb27a7d65a364d57d0a018cd74b7b3eac005d48ce3750c7ae7' > runner_handshake/expected_input_manifest.sha256
      - name: Publish public handshake
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p495-five-positive-public-handshake
          path: |
            runner_handshake/cert.pem
            runner_handshake/cert.sha256
            runner_handshake/expected_input_manifest.sha256
          retention-days: 1
      - name: Wait for encrypted five-positive input
        run: |
          set -euo pipefail
          cert_sha=$(cat runner_handshake/cert.sha256)
          found=0
          for i in $(seq 1 180); do
            git fetch -q origin compute/hou-lens-p495-five-positive-cubes
            if git cat-file -e origin/compute/hou-lens-p495-five-positive-cubes:hou_lens_p495_cube_inbox/envelope.json 2>/dev/null && git cat-file -e origin/compute/hou-lens-p495-five-positive-cubes:hou_lens_p495_cube_inbox/payload.cms.b64 2>/dev/null; then
              git show origin/compute/hou-lens-p495-five-positive-cubes:hou_lens_p495_cube_inbox/envelope.json > /tmp/env.json
              addressed=$(python -c "import json;print(json.load(open('/tmp/env.json')).get('runner_cert_sha256',''))")
              if [ "$addressed" = "$cert_sha" ]; then
                git show origin/compute/hou-lens-p495-five-positive-cubes:hou_lens_p495_cube_inbox/payload.cms.b64 > /tmp/payload.b64
                found=1; break
              fi
            fi
            sleep 10
          done
          [ "$found" = 1 ] || exit 20
          python - <<'PY'
          import hashlib,json,pathlib
          e=json.load(open('/tmp/env.json')); raw=pathlib.Path('/tmp/payload.b64').read_bytes()
          gates={
            'input_manifest_sha256':'1528878b44099ceb27a7d65a364d57d0a018cd74b7b3eac005d48ce3750c7ae7',
            'result_cert_sha256':'37571101784b05edfcbb7e697685e1d6c69356c2c44c86a5c3a3158f6cccee16',
          }
          for k,v in gates.items():
              if e.get(k)!=v: raise SystemExit('envelope gate failed')
          if hashlib.sha256(raw).hexdigest()!=e['payload_base64_sha256']: raise SystemExit('base64 SHA gate failed')
          PY
          base64 -d /tmp/payload.b64 > /tmp/payload.der
          [ "$(sha256sum /tmp/payload.der | awk '{print $1}')" = "$(python -c "import json;print(json.load(open('/tmp/env.json'))['payload_der_sha256'])")" ] || exit 21
          openssl cms -decrypt -binary -inform DER -recip runner_handshake/cert.pem -inkey runner_handshake/private.pem -in /tmp/payload.der -out /tmp/private_input.tar
          mkdir private_input && tar -xf /tmp/private_input.tar -C private_input
          echo 'five-positive encrypted input decrypted; private identities suppressed'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install frozen imaging dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.1 scipy==1.18.0 astropy==8.0.1
      - name: Build deterministic cubes
        run: python hou_lens_p495_five_positive/build_cubes.py
      - name: Encrypt private cube evidence
        run: |
          set -euo pipefail
          mkdir public_cube_result
          tar -cf /tmp/private_output.tar private_output
          openssl cms -encrypt -aes-256-cbc -binary -outform DER -in /tmp/private_output.tar -out public_cube_result/encrypted_cube_result.cms.der private_input/result-recipient-cert.pem
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('public_cube_result/encrypted_cube_result.cms.der')
          d={'schema_version':1,'protocol':'HOU-LENS-P4.9.5-FIVE-POSITIVE-BASELINE-CUBE-CONSTRUCTION','status':'PASS_ENCRYPTED_CUBE_OUTPUT','positive_count':5,'input_manifest_sha256':'1528878b44099ceb27a7d65a364d57d0a018cd74b7b3eac005d48ce3750c7ae7','historical_imaging_core_git_blob_sha':'583b5929c05f46d671228cbccc52af5709a2caa0','encrypted_result_bytes':p.stat().st_size,'encrypted_result_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'private_plaintext_emitted':False,'scores_computed':False,'model_code_executed':False,'scenario_generation':False}
          pathlib.Path('public_cube_result/public_summary.json').write_text(json.dumps(d,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps({k:d[k] for k in ['status','positive_count','encrypted_result_bytes','encrypted_result_sha256']},indent=2))
          PY
          rm -rf private_input private_output /tmp/private_input.tar /tmp/private_output.tar /tmp/payload.der /tmp/payload.b64 /tmp/env.json runner_handshake/private.pem
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p495-five-positive-encrypted-result
          path: public_cube_result/
          if-no-files-found: warn
          retention-days: 90
