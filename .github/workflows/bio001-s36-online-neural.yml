name: BIO-001 S36 causal online neural training

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s36-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install frozen runtime
        run: python -m pip install "numpy==2.3.5" "scipy==1.17.0"

      - name: Decode and verify frozen scientific pipeline
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/s36_pipeline.py.gz.b64 | gzip -d > tools/s36_pipeline.py
          test "$(sha256sum tools/s36_pipeline.py | awk '{print $1}')" = "1ed1225d0c9efc0d6caeb93e733246f3a372f39529c050503726a7af95a69cc2"
          test "$(sha256sum tools/s36_audit.py | awk '{print $1}')" = "f2dbc17e9bddd1731380de86dd874cb45380fa738aa23d900c671bcb099d886e"
          python -m py_compile tools/s36_pipeline.py tools/s36_audit.py tools/bio001_s36_acquire.py

      - name: Acquire and extract verified training archive only
        shell: bash
        run: |
          set -euo pipefail
          python tools/bio001_s36_acquire.py
          mkdir -p s36_data/training
          tar -xzf s36_artifacts/raw/AML310_moving.tar.gz -C s36_data/training

      - name: Execute frozen primary and exact rerun
        shell: bash
        run: |
          set -euo pipefail
          python tools/s36_pipeline.py --training-root s36_data/training --output s36_output_primary
          python tools/s36_pipeline.py --training-root s36_data/training --output s36_output_rerun

      - name: Independent arithmetic provenance and causality audit
        run: python tools/s36_audit.py

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s36_evidence
          cp tools/s36_pipeline.py tools/s36_audit.py s36_evidence/
          cp s36_output_primary/*.json s36_evidence/
          cp s36_output_rerun/*.json s36_evidence/
          cp s36_independent_audit.json s36_evidence/
          cp s36_artifacts/source_manifest.json s36_evidence/
          cp s36_artifacts/holdout_nonaccess_receipt.json s36_evidence/
          (cd s36_evidence && sha256sum * > manifest.sha256)

      - name: Upload S36 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bio001-s36-online-neural-evidence
          path: s36_evidence/
          compression-level: 9
          retention-days: 30
          if-no-files-found: warn
