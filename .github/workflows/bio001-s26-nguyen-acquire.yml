name: BIO001 S26 Nguyen training acquisition

on:
  pull_request:
    paths:
      - 'cases/bio001-s26-nguyen/**'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download only preregistered individual source files
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json
          from pathlib import Path
          from urllib.parse import quote
          import requests

          allowed = [f'pnas.1507110112.sd{i:02d}.csv' for i in range(2, 11)]
          forbidden = {f'pnas.1507110112.sd{i:02d}.csv' for i in range(11, 14)}
          root = Path('bio001_s26_nguyen')
          raw = root / 'raw'
          raw.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/127 Safari/537.36',
              'Accept': 'text/csv,text/plain,application/octet-stream,*/*',
              'Referer': 'https://pmc.ncbi.nlm.nih.gov/articles/PMC4776509/',
          })

          def candidate_urls(name: str) -> list[str]:
              return [
                  f'https://pmc.ncbi.nlm.nih.gov/articles/instance/4776509/bin/{name}',
                  f'https://www.ncbi.nlm.nih.gov/pmc/articles/instance/4776509/bin/{name}',
                  f'https://www.pnas.org/action/downloadSupplement?doi=10.1073%2Fpnas.1507110112&file={quote(name)}',
                  f'https://www.pnas.org/action/downloadSupplement?doi=10.1073/pnas.1507110112&file={quote(name)}',
              ]

          receipts = []
          all_errors = {}
          for name in allowed:
              if name in forbidden:
                  raise RuntimeError('forbidden holdout request')
              payload = None
              source_url = None
              errors = []
              for url in candidate_urls(name):
                  try:
                      response = session.get(url, timeout=180, allow_redirects=True)
                      prefix = response.content[:500].lower()
                      content_type = response.headers.get('content-type', '')
                      valid = (
                          response.status_code == 200
                          and len(response.content) > 100
                          and b'<html' not in prefix
                          and b'<!doctype' not in prefix
                          and b'checking your browser' not in prefix
                          and '[error]' not in prefix.decode('utf-8', errors='ignore').lower()
                      )
                      if valid:
                          payload = response.content
                          source_url = response.url
                          break
                      errors.append({
                          'url': url,
                          'final_url': response.url,
                          'status': response.status_code,
                          'content_type': content_type,
                          'bytes': len(response.content),
                          'prefix': response.content[:160].decode('utf-8', errors='replace'),
                      })
                  except Exception as exc:
                      errors.append({'url': url, 'error': repr(exc)})
              all_errors[name] = errors
              if payload is None:
                  raise RuntimeError('could not acquire %s: %s' % (name, json.dumps(errors)))
              path = raw / name
              path.write_bytes(payload)
              receipts.append({
                  'name': name,
                  'source_url': source_url,
                  'bytes': len(payload),
                  'sha256': hashlib.sha256(payload).hexdigest(),
                  'first_lines': payload[:4096].decode('utf-8', errors='replace').splitlines()[:5],
              })

          extracted = {item['name'] for item in receipts}
          intersection = sorted(extracted & forbidden)
          if intersection:
              raise RuntimeError('holdout leakage: ' + repr(intersection))
          (root / 'allowed_file_receipts.json').write_text(json.dumps(receipts, indent=2), encoding='utf-8')
          (root / 'failed_candidate_receipts.json').write_text(json.dumps(all_errors, indent=2), encoding='utf-8')
          (root / 'holdout_nonaccess_receipt.json').write_text(json.dumps({
              'forbidden_filenames': sorted(forbidden),
              'requested_filenames': sorted(extracted),
              'forbidden_intersection': intersection,
              'holdout_accessed': False,
          }, indent=2), encoding='utf-8')
          print(json.dumps({'allowed_files': receipts, 'holdout_accessed': False}, indent=2))
          PY

      - name: Package only allowed source bytes
        run: |
          tar -czf bio001-s26-nguyen-train-dev.tar.gz bio001_s26_nguyen
          sha256sum bio001-s26-nguyen-train-dev.tar.gz > bio001-s26-nguyen-train-dev.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: bio001-s26-nguyen-train-dev
          path: |
            bio001-s26-nguyen-train-dev.tar.gz
            bio001-s26-nguyen-train-dev.sha256
          retention-days: 30
          if-no-files-found: error
