name: BIO001 S26 Nguyen training acquisition

on:
  pull_request:
    paths:
      - 'cases/bio001-s26-nguyen/**'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download only preregistered train and development files
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json
          from pathlib import Path
          import requests

          names = [f'pnas.1507110112.sd{i:02d}.csv' for i in range(2, 11)]
          forbidden = {f'pnas.1507110112.sd{i:02d}.csv' for i in range(11, 14)}
          out = Path('bio001_s26_nguyen')
          raw = out / 'raw'
          raw.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent': 'BIO-001-S26-Nguyen-acquisition/1.0'})

          def candidates(name: str):
              return [
                  f'https://pmc.ncbi.nlm.nih.gov/articles/PMC4776509/bin/{name}',
                  f'https://www.pnas.org/doi/suppl/10.1073/pnas.1507110112/suppl_file/{name}',
                  f'https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4776509/bin/{name}',
              ]

          receipts = []
          for name in names:
              if name in forbidden:
                  raise RuntimeError('forbidden holdout request')
              errors = []
              payload = None
              source = None
              for url in candidates(name):
                  try:
                      response = session.get(url, timeout=90, allow_redirects=True)
                      if response.status_code == 200 and len(response.content) > 100:
                          prefix = response.content[:200].lower()
                          if b'<html' not in prefix and b'<!doctype' not in prefix:
                              payload = response.content
                              source = response.url
                              break
                      errors.append({'url': url, 'status': response.status_code, 'bytes': len(response.content)})
                  except Exception as exc:
                      errors.append({'url': url, 'error': repr(exc)})
              if payload is None:
                  raise RuntimeError(f'could not acquire {name}: {errors}')
              path = raw / name
              path.write_bytes(payload)
              first_lines = path.read_text(encoding='utf-8', errors='replace').splitlines()[:5]
              receipts.append({
                  'name': name,
                  'source_url': source,
                  'bytes': len(payload),
                  'sha256': hashlib.sha256(payload).hexdigest(),
                  'first_lines': first_lines,
              })

          (out / 'acquisition_receipt.json').write_text(json.dumps(receipts, indent=2), encoding='utf-8')
          requested = {record['name'] for record in receipts}
          if requested & forbidden:
              raise RuntimeError('holdout leakage')
          (out / 'holdout_nonaccess_receipt.json').write_text(json.dumps({
              'forbidden_names': sorted(forbidden),
              'requested_names': sorted(requested),
              'intersection': sorted(requested & forbidden),
          }, indent=2), encoding='utf-8')
          PY

      - name: Package acquired source bytes
        run: |
          tar -czf bio001-s26-nguyen-train-dev.tar.gz bio001_s26_nguyen
          sha256sum bio001-s26-nguyen-train-dev.tar.gz > bio001-s26-nguyen-train-dev.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: bio001-s26-nguyen-train-dev
          path: |
            bio001-s26-nguyen-train-dev.tar.gz
            bio001-s26-nguyen-train-dev.sha256
          retention-days: 30
          if-no-files-found: error
