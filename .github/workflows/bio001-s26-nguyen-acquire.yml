name: BIO001 S26 Nguyen training acquisition

on:
  pull_request:
    paths:
      - 'cases/bio001-s26-nguyen/**'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Probe allowed supplementary item 7 only
        run: |
          set -euo pipefail
          mkdir -p bio001_s26_nguyen/probe
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json
          from pathlib import Path
          import requests

          url = 'https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/supplmat.cgi/bioc_json/26712014/7'
          response = requests.get(url, timeout=120, allow_redirects=True, headers={'User-Agent': 'BIO-001-S26/1.0'})
          out = Path('bio001_s26_nguyen/probe')
          body = out / 'item7.response'
          body.write_bytes(response.content)
          receipt = {
              'requested_index': 7,
              'expected_name_from_article_order': 'pnas.1507110112.sd02.csv',
              'url': url,
              'final_url': response.url,
              'status': response.status_code,
              'headers': dict(response.headers),
              'bytes': len(response.content),
              'sha256': hashlib.sha256(response.content).hexdigest(),
              'first_1000_text': response.content[:1000].decode('utf-8', errors='replace'),
          }
          (out / 'item7.receipt.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          print(json.dumps(receipt, indent=2))
          if response.status_code != 200 or len(response.content) < 100:
              raise RuntimeError('single supplementary item probe failed')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: bio001-s26-nguyen-item7-probe
          path: bio001_s26_nguyen/probe
          retention-days: 30
          if-no-files-found: error
