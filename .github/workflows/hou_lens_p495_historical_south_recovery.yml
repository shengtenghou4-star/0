name: HOU-LENS P4.9.5 historical South recovery relay

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout recovery executor
        uses: actions/checkout@v4
        with:
          ref: compute/hou-lens-p495-historical-south-recovery
          path: executor0
      - name: Materialize blob-verified historical source
        run: |
          mkdir -p source12/relay_jobs
          cp -a executor0/hou_lens_p495_historical_south/source12_exact source12/relay_jobs/k4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install historical pipeline dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 astropy numpy scipy
      - name: Execute exact locked byte recovery
        run: python executor0/hou_lens_p495_historical_south/recover_exact.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p495-historical-south-evidence
          path: p495_historical_south_evidence/
          if-no-files-found: error
          retention-days: 90
