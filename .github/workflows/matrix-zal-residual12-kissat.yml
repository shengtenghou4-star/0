name: Matrix ZAL Residual12 Kissat

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/matrix-zal-residual12-kissat.yml'

permissions:
  contents: read

concurrency:
  group: matrix-zal-residual12-kissat
  cancel-in-progress: false

jobs:
  execute:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        case_id:
          - b_8_8_8_10__n_8_9_10
          - b_8_8_8_10__n_9_9_9
          - b_8_8_8_9__n_8_10_10
          - b_8_8_8_9__n_9_9_10
          - b_8_8_9_10__n_8_8_10
          - b_8_8_9_10__n_8_9_9
          - b_8_8_9_9__n_8_8_11
          - b_8_8_9_9__n_8_9_10
          - b_8_8_9_9__n_9_9_9
          - b_8_9_9_9__n_8_8_10
          - b_8_9_9_9__n_8_9_9
          - b_9_9_9_9__n_8_8_9
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Recover authority-bound sources and frozen frontiers
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
          REQUEST_ID: 7a8f12c0e4b64d3a9f2e5c7b1d8a0f63
          CASE_ID: ${{ matrix.case_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zal /tmp/result
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.parse, urllib.request
          token=os.environ['LAB_QUEUE_TOKEN']; request=os.environ['REQUEST_ID']; case_id=os.environ['CASE_ID']
          repo='shengtenghou4-star/00'
          def fetch(path, ref):
              q=urllib.parse.urlencode({'ref':ref})
              url=f'https://api.github.com/repos/{repo}/contents/{path}?{q}'
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'zal-residual12-kissat'})
              with urllib.request.urlopen(req,timeout=120) as r: env=json.load(r)
              return base64.b64decode(env['content'])
          def blob_sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          root=pathlib.Path('/tmp/zal')
          input_data=fetch(f'relay/requests/{request}/input.json','main')
          request_json=json.loads(input_data)
          expected_cases=request_json['residual_case_ids']
          if len(expected_cases)!=12 or len(set(expected_cases))!=12 or case_id not in expected_cases: raise SystemExit('matrix/request case mismatch')
          if request_json.get('mode')!='t4:7,8,8,8|8,8,8,8,9' or request_json.get('inside')!=[7,8,8,8,8,8,8,8,9]: raise SystemExit('request target mismatch')
          sources={
            'profile37_outside_degree_split_cnf.py':('relay/requests/7a8f0d51de9c4b72a630f184c2e5d9b7/profile37_outside_degree_split_cnf.py','main','58e21a354e2c22dfa9f5404d6f7c048f5877ef4f'),
            'profile37_outside_degree_bound_case.py':('relay/requests/7a8f5e7c2a4d4b3e9f1a6c8d0e2f4b61/profile37_outside_degree_bound_case.py','main','1d9e96048c28da717b295db0740e0b4983006d32'),
            'profile37_outside_degree_residual_case.py':(f'relay/requests/{request}/profile37_outside_degree_residual_case.py','main','a8126e4f8f2a0d6d4dc8e6dd01d2999ccb9ca62c'),
          }
          recovered={}
          for name,(path,ref,want) in sources.items():
              data=fetch(path,ref); got=blob_sha(data)
              if got!=want: raise SystemExit(f'source blob mismatch {name}: {got} != {want}')
              (root/name).write_bytes(data); recovered[name]=got
          residual=fetch(f'relay/requests/{request}/residual12-checkpoint.json','main')
          if blob_sha(residual)!='1ef1a69fbc5c418fa39028a6fb73c01d75782cf7': raise SystemExit('residual checkpoint blob mismatch')
          frontier=fetch('relay/focused-inspections/7a8f0d51de9c4b72a630f184c2e5d9b7/30703350166-1/open-frontier-v1.json','results')
          if blob_sha(frontier)!='d8407d78795835cbdfe80737cf7b646561af8b91': raise SystemExit('frontier blob mismatch')
          (root/'input.json').write_bytes(input_data)
          (root/'residual12-checkpoint.json').write_bytes(residual)
          (root/'open-frontier-v1.json').write_bytes(frontier)
          receipt={'schema':'profile37-residual12-source-recovery/v1','request_id':request,'case_id':case_id,'input_sha256':hashlib.sha256(input_data).hexdigest(),'source_git_blobs':recovered,'residual_checkpoint_git_blob':'1ef1a69fbc5c418fa39028a6fb73c01d75782cf7','frontier_git_blob':'d8407d78795835cbdfe80737cf7b646561af8b91'}
          (root/'source-recovery-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Build and record Kissat
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/arminbiere/kissat.git /tmp/kissat >/dev/null 2>&1
          git -C /tmp/kissat rev-parse HEAD > /tmp/result/solver-source-commit.txt
          cd /tmp/kissat
          ./configure >/dev/null
          make -j2 >/dev/null
          build/kissat --version > /tmp/result/solver-version.txt
          sha256sum build/kissat > /tmp/result/solver.sha256

      - name: Execute one frozen exact case
        env:
          CASE_ID: ${{ matrix.case_id }}
        shell: bash
        run: |
          set +e
          python /tmp/zal/profile37_outside_degree_residual_case.py \
            --frontier /tmp/zal/open-frontier-v1.json \
            --residual /tmp/zal/residual12-checkpoint.json \
            --case-script /tmp/zal/profile37_outside_degree_bound_case.py \
            --solver /tmp/kissat/build/kissat \
            --case-id "$CASE_ID" \
            --workdir /tmp/result/exact \
            --timeout 19500 \
            > /tmp/result/stdout.txt 2> /tmp/result/stderr.txt
          rc=$?
          printf '%s\n' "$rc" > /tmp/result/return-code.txt
          cp /tmp/zal/input.json /tmp/result/
          cp /tmp/zal/source-recovery-receipt.json /tmp/result/
          exit 0

      - name: Store private case result
        if: always()
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
          REQUEST_ID: 7a8f12c0e4b64d3a9f2e5c7b1d8a0f63
          CASE_ID: ${{ matrix.case_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile, time, urllib.request
          token=os.environ['LAB_QUEUE_TOKEN']; request=os.environ['REQUEST_ID']; case_id=os.environ['CASE_ID']; run=os.environ['RUN_ID']; attempt=os.environ['RUN_ATTEMPT']
          repo='shengtenghou4-star/00'; branch='results'; root=pathlib.Path('/tmp/result')
          stream=io.BytesIO()
          with tarfile.open(fileobj=stream,mode='w:gz',format=tarfile.PAX_FORMAT) as tf:
              for p in sorted(root.rglob('*')):
                  if p.is_symlink(): raise SystemExit('unsafe result')
                  tf.add(p,arcname=p.relative_to(root),recursive=False)
          package=stream.getvalue()
          if len(package)>90*1024*1024: raise SystemExit('result too large')
          rc=int((root/'return-code.txt').read_text().strip()) if (root/'return-code.txt').exists() else 255
          status=None; exit_code=None; contract_pass=False
          audit=root/'exact'/'case-audit.json'
          if audit.exists():
              parsed=json.loads(audit.read_text()); status=parsed.get('result',{}).get('status'); exit_code=parsed.get('result',{}).get('exit_code'); contract_pass=parsed.get('contract_pass') is True
          receipt={'schema':1,'request_id':request,'run_id':run,'run_attempt':attempt,'case_id':case_id,'wrapper_return_code':rc,'solver_status':status,'solver_exit_code':exit_code,'contract_pass':contract_pass,'result_bytes':len(package),'result_sha256':hashlib.sha256(package).hexdigest(),'finished_unix':int(time.time())}
          def put(path,data,message):
              url=f'https://api.github.com/repos/{repo}/contents/{path}'
              body=json.dumps({'message':message,'content':base64.b64encode(data).decode(),'branch':branch},separators=(',',':')).encode()
              req=urllib.request.Request(url,data=body,method='PUT',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'zal-residual12-kissat'})
              with urllib.request.urlopen(req,timeout=300) as r: r.read()
          prefix=f'relay/results/{request}/{run}-{attempt}/cases/{case_id}'
          put(f'{prefix}/result.tar.gz',package,'Store ZAL residual12 Kissat case package')
          put(f'{prefix}/receipt.json',(json.dumps(receipt,indent=2,sort_keys=True)+'\n').encode(),'Store ZAL residual12 Kissat case receipt')
          PY

  merge:
    if: always()
    needs: execute
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Merge and audit all twelve cases
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
          REQUEST_ID: 7a8f12c0e4b64d3a9f2e5c7b1d8a0f63
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile, time, urllib.parse, urllib.request
          token=os.environ['LAB_QUEUE_TOKEN']; request=os.environ['REQUEST_ID']; run=os.environ['RUN_ID']; attempt=os.environ['RUN_ATTEMPT']
          repo='shengtenghou4-star/00'; branch='results'
          cases=['b_8_8_8_10__n_8_9_10','b_8_8_8_10__n_9_9_9','b_8_8_8_9__n_8_10_10','b_8_8_8_9__n_9_9_10','b_8_8_9_10__n_8_8_10','b_8_8_9_10__n_8_9_9','b_8_8_9_9__n_8_8_11','b_8_8_9_9__n_8_9_10','b_8_8_9_9__n_9_9_9','b_8_9_9_9__n_8_8_10','b_8_9_9_9__n_8_9_9','b_9_9_9_9__n_8_8_9']
          def fetch(path):
              q=urllib.parse.urlencode({'ref':branch})
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}?{q}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'zal-residual12-kissat-merge'})
              with urllib.request.urlopen(req,timeout=180) as r: env=json.load(r)
              return base64.b64decode(env['content'])
          rows=[]; missing=[]; integrity=[]; solver_commits=set(); solver_versions=set(); solver_hashes=set()
          for case_id in cases:
              prefix=f'relay/results/{request}/{run}-{attempt}/cases/{case_id}'
              try:
                  receipt_data=fetch(f'{prefix}/receipt.json'); package=fetch(f'{prefix}/result.tar.gz')
              except Exception as exc:
                  missing.append(case_id); continue
              receipt=json.loads(receipt_data)
              if receipt.get('case_id')!=case_id or hashlib.sha256(package).hexdigest()!=receipt.get('result_sha256'):
                  integrity.append(f'{case_id}:receipt_or_package_binding'); continue
              root=pathlib.Path('/tmp')/('case-'+hashlib.sha256(case_id.encode()).hexdigest()[:12]); root.mkdir(exist_ok=True)
              with tarfile.open(fileobj=io.BytesIO(package),mode='r:gz') as tf:
                  for m in tf.getmembers():
                      p=pathlib.Path(m.name)
                      if p.is_absolute() or '..' in p.parts or m.issym() or m.islnk() or m.isdev(): raise SystemExit('unsafe case package')
                  tf.extractall(root,filter='data')
              audit_path=root/'exact'/'case-audit.json'
              if not audit_path.exists(): integrity.append(f'{case_id}:missing_audit'); continue
              audit=json.loads(audit_path.read_text()); result=audit.get('result',{})
              checks=[audit.get('case_id')==case_id,audit.get('contract_pass') is True,result.get('case_id')==case_id,result.get('binding_pass') is True,result.get('cnf_sha256')==audit.get('source_cnf_sha256'),result.get('source_report_sha256')==audit.get('source_report_sha256'),result.get('frontier_git_blob')=='d8407d78795835cbdfe80737cf7b646561af8b91']
              if not all(checks): integrity.append(f'{case_id}:audit_binding'); continue
              for filename,target in [('solver-source-commit.txt',solver_commits),('solver-version.txt',solver_versions),('solver.sha256',solver_hashes)]:
                  path=root/filename
                  if not path.exists(): integrity.append(f'{case_id}:missing_{filename}')
                  else: target.add(path.read_text().strip())
              rows.append({'case_id':case_id,'status':result.get('status'),'exit_code':result.get('exit_code'),'cnf_sha256':result.get('cnf_sha256'),'clauses':result.get('clauses'),'variables':result.get('variables'),'report_sha256':hashlib.sha256((root/'exact'/'case'/'report.json').read_bytes()).hexdigest(),'case_audit_sha256':hashlib.sha256(audit_path.read_bytes()).hexdigest(),'package_sha256':receipt.get('result_sha256'),'witness_audit':result.get('witness_audit')})
          ids=[r['case_id'] for r in rows]
          duplicate=len(ids)!=len(set(ids)); unexpected=sorted(set(ids)-set(cases)); absent=sorted(set(cases)-set(ids))
          unsat=sorted(r['case_id'] for r in rows if r['status']=='UNSAT' and r['exit_code']==20)
          sat=[]; invalid_sat=[]
          for r in rows:
              if r['status']=='SAT' or r['exit_code']==10:
                  w=r.get('witness_audit') or {}
                  if w.get('row_sums_match') and w.get('column_sums_match') and w.get('k33_free'): sat.append(r['case_id'])
                  else: invalid_sat.append(r['case_id'])
          open_cases=sorted(set(cases)-set(unsat)-set(sat))
          contract_pass=not missing and not integrity and not duplicate and not unexpected and not absent and not invalid_sat and len(rows)==12 and len(solver_commits)==1 and len(solver_versions)==1 and len(solver_hashes)==1
          merged={'schema':'profile37-residual12-kissat-merged/v1','request_id':request,'run_id':run,'run_attempt':attempt,'mode':'t4:7,8,8,8|8,8,8,8,9','inside':[7,8,8,8,8,8,8,8,9],'frontier_git_blob':'d8407d78795835cbdfe80737cf7b646561af8b91','residual_checkpoint_git_blob':'1ef1a69fbc5c418fa39028a6fb73c01d75782cf7','complete_cover_patterns_sha256':'0ada21e204825a2421c8fafef50395e829e27ebe4164fc34f4d5df3d80d1088b','source_package_sha256':'6d09573322d84449b438f7c324602c804d276fcebcd226e21effd5066061c63a','source_merged_sha256':'3a4702dc24755f2f4658454bbe9e711e0030f3c74abdb06afae4722912ef7a08','expected_cases':cases,'missing_receipts':missing,'integrity_failures':integrity,'duplicate_case':duplicate,'unexpected_cases':unexpected,'absent_cases':absent,'invalid_sat_cases':invalid_sat,'solver_source_commits':sorted(solver_commits),'solver_versions':sorted(solver_versions),'solver_binary_hashes':sorted(solver_hashes),'new_unsat_case_ids':unsat,'sat_case_ids':sat,'residual_open_case_ids':open_cases,'new_unsat_count':len(unsat),'sat_count':len(sat),'residual_open_count':len(open_cases),'previous_explicit_unsat_count':18,'total_explicit_unsat_count':18+len(unsat),'complete_30_class_terminal_unsat_candidate':contract_pass and len(unsat)==12 and not sat and not open_cases,'contract_pass':contract_pass,'proof_status':'TERMINAL_UNSAT_CANDIDATE_PENDING_ADVERSARIAL_AUDIT' if contract_pass and len(unsat)==12 else 'PARTIAL_OPEN_PENDING_ADVERSARIAL_AUDIT' if contract_pass else 'REJECT_INTEGRITY_FAILURE','rows':rows,'finished_unix':int(time.time())}
          raw=(json.dumps(merged,indent=2,sort_keys=True)+'\n').encode()
          receipt={'schema':1,'request_id':request,'run_id':run,'run_attempt':attempt,'merged_sha256':hashlib.sha256(raw).hexdigest(),'contract_pass':contract_pass,'new_unsat_count':len(unsat),'sat_count':len(sat),'residual_open_count':len(open_cases),'proof_status':merged['proof_status']}
          def put(path,data,message):
              url=f'https://api.github.com/repos/{repo}/contents/{path}'
              body=json.dumps({'message':message,'content':base64.b64encode(data).decode(),'branch':branch},separators=(',',':')).encode()
              req=urllib.request.Request(url,data=body,method='PUT',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'zal-residual12-kissat-merge'})
              with urllib.request.urlopen(req,timeout=300) as r: r.read()
          prefix=f'relay/results/{request}/{run}-{attempt}'
          put(f'{prefix}/merged-cover.json',raw,'Store ZAL residual12 Kissat merged cover')
          put(f'{prefix}/merged-receipt.json',(json.dumps(receipt,indent=2,sort_keys=True)+'\n').encode(),'Store ZAL residual12 Kissat merged receipt')
          print(json.dumps(receipt,sort_keys=True))
          PY
