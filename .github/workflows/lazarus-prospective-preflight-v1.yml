name: LAZARUS prospective runner preflight v1

on:
  pull_request:
    paths:
      - ".github/workflows/lazarus-prospective-preflight-v1.yml"
      - "lazarus-public-compute/payload/lazarus_prospective_snapshot_compute.py.gz.b64"
      - "lazarus-public-compute/payload/lazarus_public_compute.py.gz.b64"
      - "lazarus-public-compute/payload/lazarus_orth_residual_compute.py.gz.b64"
      - "lazarus-public-compute/frozen/primary_family_components_v1.csv"
      - "cases/7838a640602a3a78463d52e06e2a614a/fetch_archive.py"

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen runtime
        run: python -m pip install "numpy==2.3.2" "scipy==1.16.1" "scikit-learn==1.7.1" --quiet --progress-bar off
      - name: Decode and verify reviewed payloads
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          payloads = [
              ('lazarus-public-compute/payload/lazarus_public_compute.py.gz.b64', 'lazarus-public-compute/lazarus_public_compute.py', '7429d615a4fcbcff529270ed25dbfb6e1395b07883dda59d4f9317724bfd6a2c'),
              ('lazarus-public-compute/payload/lazarus_orth_residual_compute.py.gz.b64', 'lazarus-public-compute/lazarus_orth_residual_compute.py', '42c284c9f06f713a59443fae04987292b6fc39ff1de1f85e903207c6857a8c33'),
              ('lazarus-public-compute/payload/lazarus_prospective_snapshot_compute.py.gz.b64', 'lazarus-public-compute/lazarus_prospective_snapshot_compute.py', '3e27e43dc33ba8deac14d4b981cd8fe9d7d220cd01e908f31fee51fb4e9a200c'),
          ]
          for source_name, target_name, expected in payloads:
              source = Path(source_name)
              target = Path(target_name)
              target.write_bytes(gzip.decompress(base64.b64decode(source.read_text().strip())))
              actual = hashlib.sha256(target.read_bytes()).hexdigest()
              assert actual == expected, (target_name, actual, expected)
          family = Path('lazarus-public-compute/frozen/primary_family_components_v1.csv')
          assert hashlib.sha256(family.read_bytes()).hexdigest() == '6e7080e2d22e66322ea0884515be9ae5c6762eeb24acc16005ca45d68ecba788'
          PY
      - name: Restore exact July training snapshot
        run: python cases/7838a640602a3a78463d52e06e2a614a/fetch_archive.py
      - name: Run deterministic no-target self-test
        run: python lazarus-public-compute/lazarus_prospective_snapshot_compute.py --self-test
      - name: Reconstruct full July training universe without fitting
        run: |
          python lazarus-public-compute/lazarus_prospective_snapshot_compute.py \
            --legacy lazarus-public-compute/lazarus_public_compute.py \
            --training-data cases/7838a640602a3a78463d52e06e2a614a/artifacts/catnap-2026-07-01 \
            --families lazarus-public-compute/frozen/primary_family_components_v1.csv \
            --output lazarus-public-compute/prospective-preflight-artifacts \
            --preflight-training
      - name: Enforce isolation and fit budget
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path('lazarus-public-compute/prospective-preflight-artifacts/PROSPECTIVE_PREFLIGHT_RECEIPT.json')
          value = json.loads(path.read_text())
          assert value['status'] == 'PROSPECTIVE_PREFLIGHT_PASS'
          assert value['training_release'] == '2026-07-01'
          assert value['training_pairs'] > 0
          assert value['training_pairs'] == value['unique_training_keys']
          assert value['family_graph_groups'] == 229
          assert value['family_graph_antibodies'] == 576
          assert value['supervised_fits'] == 0
          assert value['target_rows_parsed'] == 0
          assert value['target_values_read'] == 0
          assert value['confirmation_targets_read'] == 0
          assert value['private_bytes_read'] == 0
          assert value['frozen_supervised_fit_budget'] == 2
          assert value['alternative_candidates_allowed'] == 0
          value['runner_sha256'] = hashlib.sha256(Path('lazarus-public-compute/lazarus_prospective_snapshot_compute.py').read_bytes()).hexdigest()
          value['legacy_sha256'] = hashlib.sha256(Path('lazarus-public-compute/lazarus_public_compute.py').read_bytes()).hexdigest()
          value['orth_sha256'] = hashlib.sha256(Path('lazarus-public-compute/lazarus_orth_residual_compute.py').read_bytes()).hexdigest()
          value['family_graph_sha256'] = hashlib.sha256(Path('lazarus-public-compute/frozen/primary_family_components_v1.csv').read_bytes()).hexdigest()
          path.write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')
          print(json.dumps(value, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lazarus-prospective-runner-preflight-v1
          path: lazarus-public-compute/prospective-preflight-artifacts/PROSPECTIVE_PREFLIGHT_RECEIPT.json
          if-no-files-found: error
          retention-days: 1
