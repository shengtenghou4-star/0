name: BIO-001 S42 canonical neural signal reconstruction

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s42-canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install frozen runtime
        run: python -m pip install "numpy==2.5.1" "scipy==1.17.0"

      - name: Verify syntax and expose exact public bytes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum tools/s42_canonical_reconstruction.py tools/s42_audit.py tools/bio001_s42_acquire.py
          python -m py_compile tools/s42_canonical_reconstruction.py tools/s42_audit.py tools/bio001_s42_acquire.py

      - name: Acquire verified AML310 moving training archive only
        shell: bash
        run: |
          set -euo pipefail
          python tools/bio001_s42_acquire.py
          mkdir -p s42_data/training
          tar -xzf s42_artifacts/raw/AML310_moving.tar.gz -C s42_data/training

      - name: Execute source-faithful primary and exact rerun
        shell: bash
        run: |
          set -euo pipefail
          rm -rf s42_output
          python tools/s42_canonical_reconstruction.py
          mv s42_output s42_primary
          python tools/s42_canonical_reconstruction.py
          mv s42_output s42_rerun

      - name: Independent source, rerun, gate and nonaccess audit
        run: python tools/s42_audit.py

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s42_evidence
          cp tools/s42_canonical_reconstruction.py tools/s42_audit.py tools/bio001_s42_acquire.py s42_evidence/ || true
          cp s42_primary/*.json s42_evidence/ 2>/dev/null || true
          cp s42_rerun/*.json s42_evidence/ 2>/dev/null || true
          cp s42_independent_audit.json s42_evidence/ 2>/dev/null || true
          cp s42_artifacts/source_manifest.json s42_evidence/ 2>/dev/null || true
          (cd s42_evidence && sha256sum * > manifest.sha256)

      - name: Upload S42 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bio001-s42-canonical-signal-evidence
          path: s42_evidence/
          compression-level: 9
          retention-days: 30
          if-no-files-found: warn
