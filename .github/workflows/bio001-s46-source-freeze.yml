name: BIO-001 S46 frozen sparse behavioral specificity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s46-specificity:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install frozen runtime
        run: python -m pip install "numpy==2.5.1" "scipy==1.17.0"
      - name: Assemble and verify frozen executables
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum tools/s44_pipeline.py.chunk0 | awk '{print $1}')" = "60e373edce0c02da7f5eecef25bbdd1b13525705e24e60b1000fe959af38dbc2"
          test "$(sha256sum tools/s44_pipeline.py.chunk1 | awk '{print $1}')" = "b33d9a1e696c119d3f406b6da1c390d56fd16df3b4b7489b10594d9ee0409030"
          test "$(sha256sum tools/s44_pipeline.py.chunk2 | awk '{print $1}')" = "8b960a040ffb3c15721b7244156d8ff4142629f2eb84a4f003ddb87b7eed341b"
          test "$(sha256sum tools/s44_pipeline.py.chunk3 | awk '{print $1}')" = "f55aa7b4cea6262db21f026da731f2673e05e633c8db0095d1772d71fa9a0977"
          cat tools/s44_pipeline.py.chunk0 tools/s44_pipeline.py.chunk1 tools/s44_pipeline.py.chunk2 tools/s44_pipeline.py.chunk3 > tools/s44_pipeline.py
          test "$(sha256sum tools/s44_pipeline.py | awk '{print $1}')" = "dd7717532903848bc1d1c4f3f77c32488496133c4dc3059e8ed03fc899a8ee4a"
          test "$(sha256sum tools/s42_canonical_reconstruction.py | awk '{print $1}')" = "302cb2b12699f450edffb587b2b9f943f6d46b6b8044d7bad46213ba71380c47"
          test "$(sha256sum tools/s43_calcium_innovation.py | awk '{print $1}')" = "45ed3827caf051a042ca68eea97dba3357c22bddcb06f9b13ac4eba745bf84e8"
          test "$(sha256sum tools/s45_phaseA.py | awk '{print $1}')" = "95c96b2dbb0b5ebf672140199deedb16482439a5a905a70c30acb369cf53d58f"
          test "$(sha256sum tools/s45_phaseA_portable.py | awk '{print $1}')" = "904f3112aab1a8bea95d035f365a9b78a10cad7fef9dea65a21921d30485eec9"
          test "$(sha256sum tools/s46_pipeline.py | awk '{print $1}')" = "e9a0ba5a6eb67782c7214a4eea1c669e5e7cd0d833a17f4ea5a60780c7808513"
          test "$(sha256sum tools/s46_audit.py | awk '{print $1}')" = "80a9b9a91f2305a24378f1914629804906a0b6bc81610e99100a30e845c75c96"
          test "$(sha256sum tools/bio001_s42_acquire.py | awk '{print $1}')" = "469951d266436cdc406c3ee978ab8c73f592cf8904395d02aaa53aa93db479a8"
          python -m py_compile tools/s42_canonical_reconstruction.py tools/s43_calcium_innovation.py tools/s45_phaseA.py tools/s45_phaseA_portable.py tools/s44_pipeline.py tools/s46_pipeline.py tools/s46_audit.py tools/bio001_s42_acquire.py
      - name: Acquire verified AML310 moving training archive only
        shell: bash
        run: |
          set -euo pipefail
          python tools/bio001_s42_acquire.py
          mkdir -p s46_data/training s46_artifacts
          tar -xzf s42_artifacts/raw/AML310_moving.tar.gz -C s46_data/training
          cp s42_artifacts/source_manifest.json s46_artifacts/source_manifest.json
      - name: Execute frozen primary and exact rerun
        shell: bash
        run: |
          set -euo pipefail
          rm -rf s46_output
          python tools/s46_pipeline.py
          mv s46_output s46_primary
          python tools/s46_pipeline.py
          mv s46_output s46_rerun
      - name: Independent frozen sparse specificity and nonaccess audit
        run: python tools/s46_audit.py
      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s46_evidence
          cp tools/s42_canonical_reconstruction.py tools/s43_calcium_innovation.py tools/s45_phaseA.py tools/s45_phaseA_portable.py tools/s44_pipeline.py tools/s46_pipeline.py tools/s46_audit.py tools/bio001_s42_acquire.py s46_evidence/ || true
          cp s46_primary/*.json s46_evidence/ 2>/dev/null || true
          cp s46_rerun/*.json s46_evidence/ 2>/dev/null || true
          cp s46_independent_audit.json s46_evidence/ 2>/dev/null || true
          cp s46_artifacts/source_manifest.json s46_evidence/ 2>/dev/null || true
          (cd s46_evidence && sha256sum * > manifest.sha256)
      - name: Upload S46 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bio001-s46-frozen-sparse-behavioral-specificity-evidence
          path: s46_evidence/
          compression-level: 9
          retention-days: 30
          if-no-files-found: warn
