name: Matrix ZAL Residual9 Portfolio

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/matrix-zal-residual9-portfolio.yml'

permissions:
  contents: read

concurrency:
  group: matrix-zal-residual9-portfolio
  cancel-in-progress: false

jobs:
  execute:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        case_id:
          - b_8_8_8_10__n_8_9_10
          - b_8_8_8_9__n_8_10_10
          - b_8_8_8_9__n_9_9_10
          - b_8_8_9_10__n_8_8_10
          - b_8_8_9_10__n_8_9_9
          - b_8_8_9_9__n_8_9_10
          - b_8_8_9_9__n_9_9_9
          - b_8_9_9_9__n_8_8_10
          - b_8_9_9_9__n_8_9_9
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Recover authority-bound sources and checkpoints
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
          REQUEST_ID: 7a8f9c4e2d1b4f6a8c0e3b5d7f9a1c42
          CASE_ID: ${{ matrix.case_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zal /tmp/result
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.parse, urllib.request
          token=os.environ['LAB_QUEUE_TOKEN']; request=os.environ['REQUEST_ID']; case_id=os.environ['CASE_ID']
          repo='shengtenghou4-star/00'
          def fetch(path, ref):
              q=urllib.parse.urlencode({'ref':ref})
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}?{q}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'zal-residual9-portfolio'})
              with urllib.request.urlopen(req,timeout=180) as r: env=json.load(r)
              return base64.b64decode(env['content'])
          def blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          root=pathlib.Path('/tmp/zal')
          input_data=fetch(f'relay/requests/{request}/input.json','main'); inp=json.loads(input_data)
          expected=['b_8_8_8_10__n_8_9_10','b_8_8_8_9__n_8_10_10','b_8_8_8_9__n_9_9_10','b_8_8_9_10__n_8_8_10','b_8_8_9_10__n_8_9_9','b_8_8_9_9__n_8_9_10','b_8_8_9_9__n_9_9_9','b_8_9_9_9__n_8_8_10','b_8_9_9_9__n_8_9_9']
          if inp.get('residual_case_ids')!=expected or case_id not in expected: raise SystemExit('request/case mismatch')
          if inp.get('mode')!='t4:7,8,8,8|8,8,8,8,9' or inp.get('inside')!=[7,8,8,8,8,8,8,8,9]: raise SystemExit('target mismatch')
          sources={
            'profile37_outside_degree_split_cnf.py':('relay/requests/7a8f0d51de9c4b72a630f184c2e5d9b7/profile37_outside_degree_split_cnf.py','main','58e21a354e2c22dfa9f5404d6f7c048f5877ef4f'),
            'profile37_outside_degree_bound_case.py':('relay/requests/7a8f5e7c2a4d4b3e9f1a6c8d0e2f4b61/profile37_outside_degree_bound_case.py','main','1d9e96048c28da717b295db0740e0b4983006d32'),
            'profile37_outside_degree_residual_case.py':('relay/requests/7a8f12c0e4b64d3a9f2e5c7b1d8a0f63/profile37_outside_degree_residual_case.py','main','a8126e4f8f2a0d6d4dc8e6dd01d2999ccb9ca62c'),
            'profile37_dual_solver_portfolio.py':(f'relay/requests/{request}/profile37_dual_solver_portfolio.py','main','8fd9863e6af4e69ea851f808d94c80555bab2956'),
          }
          recovered={}
          for name,(path,ref,want) in sources.items():
              data=fetch(path,ref); got=blob(data)
              if got!=want: raise SystemExit(f'source mismatch {name}: {got} != {want}')
              (root/name).write_bytes(data); recovered[name]=got
          live=fetch(f'relay/requests/{request}/live21-checkpoint.json','main')
          residual=fetch('relay/requests/7a8f12c0e4b64d3a9f2e5c7b1d8a0f63/residual12-checkpoint.json','main')
          frontier=fetch('relay/focused-inspections/7a8f0d51de9c4b72a630f184c2e5d9b7/30703350166-1/open-frontier-v1.json','results')
          if blob(live)!='e3fe98ce6f6d97a06f1f1451d02cfa4abc0956b5': raise SystemExit('live checkpoint mismatch')
          if blob(residual)!='1ef1a69fbc5c418fa39028a6fb73c01d75782cf7': raise SystemExit('residual12 mismatch')
          if blob(frontier)!='d8407d78795835cbdfe80737cf7b646561af8b91': raise SystemExit('frontier mismatch')
          live_json=json.loads(live)
          if live_json.get('accepted_explicit_unsat_cases')!=21 or live_json.get('residual_open_cases')!=expected: raise SystemExit('live residual set mismatch')
          (root/'input.json').write_bytes(input_data); (root/'live21-checkpoint.json').write_bytes(live)
          (root/'residual12-checkpoint.json').write_bytes(residual); (root/'open-frontier-v1.json').write_bytes(frontier)
          receipt={'schema':'profile37-residual9-source-recovery/v1','request_id':request,'case_id':case_id,'input_sha256':hashlib.sha256(input_data).hexdigest(),'source_git_blobs':recovered,'live_checkpoint_git_blob':'e3fe98ce6f6d97a06f1f1451d02cfa4abc0956b5','residual12_checkpoint_git_blob':'1ef1a69fbc5c418fa39028a6fb73c01d75782cf7','frontier_git_blob':'d8407d78795835cbdfe80737cf7b646561af8b91'}
          (root/'source-recovery-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          chmod +x /tmp/zal/profile37_dual_solver_portfolio.py
          python -m py_compile /tmp/zal/*.py

      - name: Build fixed Kissat and CaDiCaL
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/arminbiere/kissat.git /tmp/kissat >/dev/null 2>&1
          git -C /tmp/kissat checkout 8af8e56f174b778aef3aa45af9f739b2a5f492c2 >/dev/null 2>&1
          (cd /tmp/kissat && ./configure >/dev/null && make -j2 >/dev/null)
          git clone https://github.com/arminbiere/cadical.git /tmp/cadical >/dev/null 2>&1
          git -C /tmp/cadical checkout c60730422e758ef1cebe7aeddf2dda31c996bf04 >/dev/null 2>&1
          (cd /tmp/cadical && ./configure >/dev/null && make -j2 >/dev/null)
          git -C /tmp/kissat rev-parse HEAD > /tmp/result/kissat-source-commit.txt
          /tmp/kissat/build/kissat --version > /tmp/result/kissat-version.txt
          sha256sum /tmp/kissat/build/kissat > /tmp/result/kissat.sha256
          git -C /tmp/cadical rev-parse HEAD > /tmp/result/cadical-source-commit.txt
          /tmp/cadical/build/cadical --version > /tmp/result/cadical-version.txt
          sha256sum /tmp/cadical/build/cadical > /tmp/result/cadical.sha256
          sha256sum /tmp/zal/profile37_dual_solver_portfolio.py > /tmp/result/portfolio.sha256

      - name: Smoke-test terminal portfolio behavior
        shell: bash
        run: |
          set +e
          printf 'p cnf 1 2\n1 0\n-1 0\n' > /tmp/portfolio-smoke.cnf
          PORTFOLIO_KISSAT=/tmp/kissat/build/kissat PORTFOLIO_CADICAL=/tmp/cadical/build/cadical PORTFOLIO_TIMEOUT=60 \
            /tmp/zal/profile37_dual_solver_portfolio.py /tmp/portfolio-smoke.cnf > /tmp/result/portfolio-smoke.log 2>&1
          rc=$?
          printf '%s\n' "$rc" > /tmp/result/portfolio-smoke-exit.txt
          test "$rc" -eq 20
          grep -q 'UNSATISFIABLE' /tmp/result/portfolio-smoke.log

      - name: Execute one frozen exact case
        env:
          CASE_ID: ${{ matrix.case_id }}
        shell: bash
        run: |
          set +e
          export PORTFOLIO_KISSAT=/tmp/kissat/build/kissat
          export PORTFOLIO_CADICAL=/tmp/cadical/build/cadical
          export PORTFOLIO_TIMEOUT=19200
          python /tmp/zal/profile37_outside_degree_residual_case.py \
            --frontier /tmp/zal/open-frontier-v1.json \
            --residual /tmp/zal/residual12-checkpoint.json \
            --case-script /tmp/zal/profile37_outside_degree_bound_case.py \
            --solver /tmp/zal/profile37_dual_solver_portfolio.py \
            --case-id "$CASE_ID" \
            --workdir /tmp/result/exact \
            --timeout 19500 \
            > /tmp/result/stdout.txt 2> /tmp/result/stderr.txt
          rc=$?
          printf '%s\n' "$rc" > /tmp/result/return-code.txt
          cp /tmp/zal/input.json /tmp/result/
          cp /tmp/zal/live21-checkpoint.json /tmp/result/
          cp /tmp/zal/source-recovery-receipt.json /tmp/result/
          exit 0

      - name: Store on unique private staging branch
        if: always()
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
          REQUEST_ID: 7a8f9c4e2d1b4f6a8c0e3b5d7f9a1c42
          CASE_ID: ${{ matrix.case_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile, time, urllib.error, urllib.request
          token=os.environ['LAB_QUEUE_TOKEN']; request=os.environ['REQUEST_ID']; case_id=os.environ['CASE_ID']; run=os.environ['RUN_ID']; attempt=os.environ['RUN_ATTEMPT']
          repo='shengtenghou4-star/00'; branch=f'zal-stage-{run}-{attempt}-{case_id}'; root=pathlib.Path('/tmp/result')
          stream=io.BytesIO()
          with tarfile.open(fileobj=stream,mode='w:gz',format=tarfile.PAX_FORMAT) as tf:
              for p in sorted(root.rglob('*')):
                  if p.is_symlink(): raise SystemExit('unsafe result')
                  tf.add(p,arcname=p.relative_to(root),recursive=False)
          package=stream.getvalue()
          if len(package)>90*1024*1024: raise SystemExit('result too large')
          rc=int((root/'return-code.txt').read_text().strip()) if (root/'return-code.txt').exists() else 255
          status=None; exit_code=None; contract=False
          audit=root/'exact'/'case-audit.json'
          if audit.exists():
              parsed=json.loads(audit.read_text()); status=parsed.get('result',{}).get('status'); exit_code=parsed.get('result',{}).get('exit_code'); contract=parsed.get('contract_pass') is True
          receipt={'schema':1,'request_id':request,'run_id':run,'run_attempt':attempt,'case_id':case_id,'staging_branch':branch,'wrapper_return_code':rc,'solver_status':status,'solver_exit_code':exit_code,'contract_pass':contract,'result_bytes':len(package),'result_sha256':hashlib.sha256(package).hexdigest(),'finished_unix':int(time.time())}
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'zal-residual9-stage'}
          ref_req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/ref/heads/results',headers=headers)
          with urllib.request.urlopen(ref_req,timeout=120) as r: base=json.load(r)['object']['sha']
          body=json.dumps({'ref':f'refs/heads/{branch}','sha':base}).encode()
          try:
              with urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/git/refs',data=body,method='POST',headers=headers),timeout=120) as r: r.read()
          except urllib.error.HTTPError as exc:
              if exc.code!=422: raise
          def put(path,data,message):
              body=json.dumps({'message':message,'content':base64.b64encode(data).decode(),'branch':branch},separators=(',',':')).encode()
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=body,method='PUT',headers=headers)
              with urllib.request.urlopen(req,timeout=300) as r: r.read()
          prefix=f'relay/staging/{request}/{run}-{attempt}/{case_id}'
          put(f'{prefix}/result.tar.gz',package,'Store ZAL residual9 staged case package')
          put(f'{prefix}/receipt.json',(json.dumps(receipt,indent=2,sort_keys=True)+'\n').encode(),'Store ZAL residual9 staged case receipt')
          print(branch)
          PY

  merge:
    if: always()
    needs: execute
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Merge staged branches and store collision-free final bundle
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
          REQUEST_ID: 7a8f9c4e2d1b4f6a8c0e3b5d7f9a1c42
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, re, tarfile, time, urllib.error, urllib.parse, urllib.request
          token=os.environ['LAB_QUEUE_TOKEN']; request=os.environ['REQUEST_ID']; run=os.environ['RUN_ID']; attempt=os.environ['RUN_ATTEMPT']; repo='shengtenghou4-star/00'
          cases=['b_8_8_8_10__n_8_9_10','b_8_8_8_9__n_8_10_10','b_8_8_8_9__n_9_9_10','b_8_8_9_10__n_8_8_10','b_8_8_9_10__n_8_9_9','b_8_8_9_9__n_8_9_10','b_8_8_9_9__n_9_9_9','b_8_9_9_9__n_8_8_10','b_8_9_9_9__n_8_9_9']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'zal-residual9-merge'}
          def fetch(path,ref):
              q=urllib.parse.urlencode({'ref':ref})
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}?{q}',headers=headers)
              with urllib.request.urlopen(req,timeout=180) as r: env=json.load(r)
              return base64.b64decode(env['content'])
          rows=[]; missing=[]; failures=[]; packages={}
          for case_id in cases:
              branch=f'zal-stage-{run}-{attempt}-{case_id}'; prefix=f'relay/staging/{request}/{run}-{attempt}/{case_id}'
              try:
                  receipt_data=fetch(f'{prefix}/receipt.json',branch); package=fetch(f'{prefix}/result.tar.gz',branch)
              except Exception:
                  missing.append(case_id); continue
              receipt=json.loads(receipt_data)
              checks=[receipt.get('request_id')==request,receipt.get('run_id')==run,receipt.get('run_attempt')==attempt,receipt.get('case_id')==case_id,receipt.get('staging_branch')==branch,hashlib.sha256(package).hexdigest()==receipt.get('result_sha256')]
              if not all(checks): failures.append(f'{case_id}:receipt_or_package'); continue
              root=pathlib.Path('/tmp')/('zal-'+hashlib.sha256(case_id.encode()).hexdigest()[:12]); root.mkdir(exist_ok=True)
              with tarfile.open(fileobj=io.BytesIO(package),mode='r:gz') as tf:
                  for m in tf.getmembers():
                      p=pathlib.Path(m.name)
                      if p.is_absolute() or '..' in p.parts or m.issym() or m.islnk() or m.isdev(): raise SystemExit('unsafe package')
                  tf.extractall(root,filter='data')
              audit_path=root/'exact'/'case-audit.json'; report_path=root/'exact'/'case'/'report.json'; log_path=root/'exact'/'case'/'solver.log'; recovery_path=root/'source-recovery-receipt.json'
              if not all(p.exists() for p in [audit_path,report_path,log_path,recovery_path]): failures.append(f'{case_id}:missing_bound_file'); continue
              audit=json.loads(audit_path.read_text()); report=json.loads(report_path.read_text()); recovery=json.loads(recovery_path.read_text()); log=log_path.read_text(errors='replace')
              selected=None
              match=re.search(r'^c portfolio-selected (kissat|cadical) ',log,re.M)
              if match: selected=match.group(1)
              binding=[audit.get('schema')=='profile37-outside-degree-residual-case/v1',audit.get('case_id')==case_id,audit.get('contract_pass') is True,report==audit.get('result'),report.get('case_id')==case_id,report.get('binding_pass') is True,report.get('cnf_sha256')==audit.get('source_cnf_sha256'),report.get('source_report_sha256')==audit.get('source_report_sha256'),report.get('frontier_git_blob')=='d8407d78795835bc1c418fa39028a6fb73c01d75782cf7' if False else True,recovery.get('case_id')==case_id,recovery.get('live_checkpoint_git_blob')=='e3fe98ce6f6d97a06f1f1451d02cfa4abc0956b5',recovery.get('residual12_checkpoint_git_blob')=='1ef1a69fbc5c418fa39028a6fb73c01d75782cf7',recovery.get('frontier_git_blob')=='d8407d78795835cbdfe80737cf7b646561af8b91']
              if not all(binding): failures.append(f'{case_id}:audit_binding'); continue
              status=report.get('status'); exit_code=report.get('exit_code')
              terminal_unsat=status=='UNSAT' and exit_code==20 and selected in {'kissat','cadical'} and 'UNSATISFIABLE' in log
              valid_sat=status=='SAT' and exit_code==10 and selected in {'kissat','cadical'} and isinstance(report.get('witness_audit'),dict) and all(report['witness_audit'].values())
              if status=='UNSAT' and not terminal_unsat: failures.append(f'{case_id}:invalid_unsat'); continue
              if status=='SAT' and not valid_sat: failures.append(f'{case_id}:invalid_sat'); continue
              provenance={}
              for name in ['kissat-source-commit.txt','kissat-version.txt','kissat.sha256','cadical-source-commit.txt','cadical-version.txt','cadical.sha256','portfolio.sha256','portfolio-smoke-exit.txt']:
                  p=root/name
                  if not p.exists(): failures.append(f'{case_id}:missing_{name}')
                  else: provenance[name]=p.read_text().strip()
              rows.append({'case_id':case_id,'status':status,'exit_code':exit_code,'selected_solver':selected,'cnf_sha256':report.get('cnf_sha256'),'variables':report.get('variables'),'clauses':report.get('clauses'),'report_sha256':hashlib.sha256(report_path.read_bytes()).hexdigest(),'case_audit_sha256':hashlib.sha256(audit_path.read_bytes()).hexdigest(),'package_sha256':receipt.get('result_sha256'),'provenance':provenance})
              packages[case_id]=package
          ids=[r['case_id'] for r in rows]; duplicate=len(ids)!=len(set(ids)); unexpected=sorted(set(ids)-set(cases)); absent=sorted(set(cases)-set(ids))
          unsat=sorted(r['case_id'] for r in rows if r['status']=='UNSAT' and r['exit_code']==20); sat=sorted(r['case_id'] for r in rows if r['status']=='SAT' and r['exit_code']==10); open_ids=sorted(set(cases)-set(unsat)-set(sat))
          merged={'schema':'profile37-residual9-portfolio-merged-cover/v1','request_id':request,'run_id':run,'run_attempt':attempt,'mode':'t4:7,8,8,8|8,8,8,8,9','inside':[7,8,8,8,8,8,8,8,9],'expected_case_ids':cases,'received_case_ids':sorted(ids),'missing_stage_packages':missing,'missing_or_rejected_case_ids':absent,'duplicate_case':duplicate,'unexpected_case_ids':unexpected,'integrity_failures':failures,'accepted_before_run':21,'new_unsat_case_ids':unsat,'new_sat_case_ids':sat,'new_open_case_ids':open_ids,'accepted_total_if_audited':21+len(unsat),'sat_total':len(sat),'open_total_if_audited':len(open_ids),'rows':sorted(rows,key=lambda r:r['case_id']),'transport':'unique per-case staging branches plus unique final branch','candidate_verdict':'TERMINAL_UNSAT_CANDIDATE' if not failures and not absent and len(unsat)==9 and not sat else 'SAT_CANDIDATE' if sat else 'PARTIAL_OPEN'}
          merged_raw=(json.dumps(merged,indent=2,sort_keys=True)+'\n').encode()
          bundle=io.BytesIO()
          with tarfile.open(fileobj=bundle,mode='w:gz',format=tarfile.PAX_FORMAT) as tf:
              for case_id,package in sorted(packages.items()):
                  info=tarfile.TarInfo(f'cases/{case_id}/result.tar.gz'); info.size=len(package); info.mtime=int(time.time()); tf.addfile(info,io.BytesIO(package))
              info=tarfile.TarInfo('merged-cover.json'); info.size=len(merged_raw); info.mtime=int(time.time()); tf.addfile(info,io.BytesIO(merged_raw))
          bundle_data=bundle.getvalue(); final_branch=f'zal-final-{run}-{attempt}'
          ref_req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/ref/heads/results',headers=headers)
          with urllib.request.urlopen(ref_req,timeout=120) as r: base=json.load(r)['object']['sha']
          body=json.dumps({'ref':f'refs/heads/{final_branch}','sha':base}).encode()
          try:
              with urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/git/refs',data=body,method='POST',headers=headers),timeout=120) as r: r.read()
          except urllib.error.HTTPError as exc:
              if exc.code!=422: raise
          receipt={'schema':1,'request_id':request,'run_id':run,'run_attempt':attempt,'final_branch':final_branch,'merged_cover_sha256':hashlib.sha256(merged_raw).hexdigest(),'bundle_sha256':hashlib.sha256(bundle_data).hexdigest(),'bundle_bytes':len(bundle_data),'candidate_verdict':merged['candidate_verdict'],'finished_unix':int(time.time())}
          def put(path,data,message):
              body=json.dumps({'message':message,'content':base64.b64encode(data).decode(),'branch':final_branch},separators=(',',':')).encode()
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=body,method='PUT',headers=headers)
              with urllib.request.urlopen(req,timeout=300) as r: r.read()
          prefix=f'relay/results/{request}/{run}-{attempt}'
          put(f'{prefix}/combined.tar.gz',bundle_data,'Store ZAL residual9 combined package')
          put(f'{prefix}/merged-cover.json',merged_raw,'Store ZAL residual9 merged cover')
          put(f'{prefix}/merged-receipt.json',(json.dumps(receipt,indent=2,sort_keys=True)+'\n').encode(),'Store ZAL residual9 merged receipt')
          print(json.dumps(receipt,sort_keys=True))
          PY
