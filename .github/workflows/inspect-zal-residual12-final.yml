name: Inspect ZAL Residual12 Final

on:
  push:
    paths:
      - '.github/workflows/inspect-zal-residual12-final.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Audit all existing case packages
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile, time, urllib.error, urllib.parse, urllib.request
          token=os.environ['LAB_QUEUE_TOKEN']; repo='shengtenghou4-star/00'; branch='results'
          request='7a8f12c0e4b64d3a9f2e5c7b1d8a0f63'; run='30792311484'; attempt='1'
          expected=['b_8_8_8_10__n_8_9_10','b_8_8_8_10__n_9_9_9','b_8_8_8_9__n_8_10_10','b_8_8_8_9__n_9_9_10','b_8_8_9_10__n_8_8_10','b_8_8_9_10__n_8_9_9','b_8_8_9_9__n_8_8_11','b_8_8_9_9__n_8_9_10','b_8_8_9_9__n_9_9_9','b_8_9_9_9__n_8_8_10','b_8_9_9_9__n_8_9_9','b_9_9_9_9__n_8_8_9']
          accepted_before={'b_8_8_9_9__n_8_8_11','b_9_9_9_9__n_8_8_9'}
          def fetch(path):
              q=urllib.parse.urlencode({'ref':branch})
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}?{q}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'zal-final-audit'})
              with urllib.request.urlopen(req,timeout=180) as r: env=json.load(r)
              return base64.b64decode(env['content'])
          def maybe(path):
              try: return fetch(path)
              except urllib.error.HTTPError as e:
                  if e.code==404: return None
                  raise
          rows=[]; missing_packages=[]; failures=[]
          for cid in expected:
              prefix=f'relay/results/{request}/{run}-{attempt}/cases/{cid}'
              package=maybe(f'{prefix}/result.tar.gz'); receipt_raw=maybe(f'{prefix}/receipt.json')
              if package is None:
                  missing_packages.append(cid); continue
              root=pathlib.Path('/tmp')/('zal-'+hashlib.sha256(cid.encode()).hexdigest()[:16]); root.mkdir(exist_ok=True)
              with tarfile.open(fileobj=io.BytesIO(package),mode='r:gz') as tf:
                  for m in tf.getmembers():
                      p=pathlib.Path(m.name)
                      if p.is_absolute() or '..' in p.parts or m.issym() or m.islnk() or m.isdev(): raise SystemExit('unsafe package')
                  tf.extractall(root,filter='data')
              auditp=root/'exact'/'case-audit.json'; reportp=root/'exact'/'case'/'report.json'; logp=root/'exact'/'case'/'solver.log'; recoveryp=root/'source-recovery-receipt.json'
              local=[]
              if not all(p.exists() for p in [auditp,reportp,logp,recoveryp,root/'solver-source-commit.txt',root/'solver-version.txt',root/'solver.sha256']): local.append('missing_internal_file')
              if local:
                  failures.append(f'{cid}:{local}'); continue
              audit=json.loads(auditp.read_text()); report=json.loads(reportp.read_text()); recovery=json.loads(recoveryp.read_text())
              checks={
                'audit_schema':audit.get('schema')=='profile37-outside-degree-residual-case/v1',
                'audit_target':audit.get('mode')=='t4:7,8,8,8|8,8,8,8,9' and audit.get('inside')==[7,8,8,8,8,8,8,8,9],
                'audit_case':audit.get('case_id')==cid and report.get('case_id')==cid,
                'contract':audit.get('contract_pass') is True and report.get('binding_pass') is True,
                'frontier':audit.get('frontier_git_blob')=='d8407d78795835cbdfe80737cf7b646561af8b91' and report.get('frontier_git_blob')=='d8407d78795835cbdfe80737cf7b646561af8b91',
                'residual':audit.get('residual_checkpoint_git_blob')=='1ef1a69fbc5c418fa39028a6fb73c01d75782cf7',
                'cover':audit.get('complete_cover_patterns_sha256')=='0ada21e204825a2421c8fafef50395e829e27ebe4164fc34f4d5df3d80d1088b',
                'source_package':audit.get('source_package_sha256')=='6d09573322d84449b438f7c324602c804d276fcebcd226e21effd5066061c63a',
                'source_merged':audit.get('source_merged_sha256')=='3a4702dc24755f2f4658454bbe9e711e0030f3c74abdb06afae4722912ef7a08',
                'cnf':report.get('cnf_sha256')==audit.get('source_cnf_sha256')==report.get('expected_cnf_sha256'),
                'source_report':report.get('source_report_sha256')==audit.get('source_report_sha256'),
                'recovery':recovery.get('request_id')==request and recovery.get('case_id')==cid and recovery.get('frontier_git_blob')=='d8407d78795835cbdfe80737cf7b646561af8b91' and recovery.get('residual_checkpoint_git_blob')=='1ef1a69fbc5c418fa39028a6fb73c01d75782cf7',
                'solver_commit':(root/'solver-source-commit.txt').read_text().strip()=='8af8e56f174b778aef3aa45af9f739b2a5f492c2',
                'solver_version':(root/'solver-version.txt').read_text().strip()=='4.0.4',
                'solver_hash_record':len((root/'solver.sha256').read_text().strip().split()[0])==64,
                'report_equal':audit.get('result')==report,
              }
              status=report.get('status'); exit_code=report.get('exit_code'); log=logp.read_text(errors='replace')
              terminal_unsat=status=='UNSAT' and exit_code==20 and 'UNSATISFIABLE' in log
              sat=status=='SAT' or exit_code==10
              witness_ok=(report.get('witness_audit') is not None and report.get('witness_audit',{}).get('valid') is True) if sat else None
              if not all(checks.values()): failures.append(f'{cid}:binding')
              receipt=None if receipt_raw is None else json.loads(receipt_raw)
              receipt_ok=(receipt is not None and receipt.get('request_id')==request and receipt.get('run_id')==run and receipt.get('run_attempt')==attempt and receipt.get('case_id')==cid and receipt.get('result_sha256')==hashlib.sha256(package).hexdigest() and receipt.get('contract_pass') is True and receipt.get('wrapper_return_code')==0)
              rows.append({'case_id':cid,'package_sha256':hashlib.sha256(package).hexdigest(),'receipt_present':receipt is not None,'receipt_ok':receipt_ok,'checks':checks,'status':status,'exit_code':exit_code,'terminal_unsat':terminal_unsat and all(checks.values()),'sat':sat,'witness_ok':witness_ok,'cnf_sha256':report.get('cnf_sha256'),'report_sha256':hashlib.sha256(reportp.read_bytes()).hexdigest(),'case_audit_sha256':hashlib.sha256(auditp.read_bytes()).hexdigest(),'solver_source_commit':(root/'solver-source-commit.txt').read_text().strip(),'solver_version':(root/'solver-version.txt').read_text().strip(),'solver_binary_hash_record':(root/'solver.sha256').read_text().strip()})
          ids=[r['case_id'] for r in rows]
          new_unsat=sorted(r['case_id'] for r in rows if r['terminal_unsat'] and r['case_id'] not in accepted_before)
          timeouts=sorted(r['case_id'] for r in rows if not r['terminal_unsat'] and not r['sat'])
          invalid_sat=sorted(r['case_id'] for r in rows if r['sat'] and r['witness_ok'] is not True)
          audit={'schema':'profile37-residual12-final-adversarial-audit/v1','request_id':request,'run_attempt':f'{run}-{attempt}','mode':'t4:7,8,8,8|8,8,8,8,9','inside':[7,8,8,8,8,8,8,8,9],'expected_case_count':12,'package_case_count':len(rows),'missing_packages':missing_packages,'duplicate_cases':len(ids)!=len(set(ids)),'unexpected_cases':sorted(set(ids)-set(expected)),'failures':failures,'new_unsat_case_ids':new_unsat,'new_unsat_count':len(new_unsat),'accepted_total_if_applied':20+len(new_unsat),'timeout_or_open_case_ids':timeouts,'timeout_or_open_count':len(timeouts)+len(missing_packages),'invalid_sat_cases':invalid_sat,'sat_count':sum(r['sat'] and r['witness_ok'] is True for r in rows),'receiptless_but_package_audited':sorted(r['case_id'] for r in rows if not r['receipt_present']),'rows':rows,'verdict':'ACCEPT_PARTIAL_CASE_LEVEL_CREDIT' if new_unsat and not failures and not invalid_sat else 'NO_NEW_CREDIT' if not new_unsat and not failures else 'REJECT_AUDIT_FAILURE','global_checkpoint_increment':0,'finished_unix':int(time.time())}
          data=(json.dumps(audit,indent=2,sort_keys=True)+'\n').encode()
          def put(path,data):
              url=f'https://api.github.com/repos/{repo}/contents/{path}'
              body=json.dumps({'message':'Store final ZAL residual12 adversarial audit','content':base64.b64encode(data).decode(),'branch':branch},separators=(',',':')).encode()
              req=urllib.request.Request(url,data=body,method='PUT',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'zal-final-audit'})
              with urllib.request.urlopen(req,timeout=180) as r: r.read()
          put(f'relay/focused-inspections/{request}/{run}-{attempt}/final-adversarial-audit-v1.json',data)
          print(json.dumps({'new_unsat':new_unsat,'open':audit['timeout_or_open_count'],'missing_packages':missing_packages,'receiptless':audit['receiptless_but_package_audited'],'verdict':audit['verdict']},sort_keys=True))
          PY
