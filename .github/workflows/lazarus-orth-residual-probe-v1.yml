name: LAZARUS orth-residual frozen public execution v1

on:
  pull_request:
    paths:
      - ".github/workflows/lazarus-orth-residual-probe-v1.yml"

permissions:
  contents: read

concurrency:
  group: lazarus-orth-residual-frozen-public-v1
  cancel-in-progress: false

jobs:
  execute:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen runtime
        run: python -m pip install "numpy==2.3.2" "scipy==1.16.1" "scikit-learn==1.7.1" --quiet --progress-bar off
      - name: Decode and verify exact payloads
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          pairs = [
              ('lazarus-public-compute/payload/lazarus_public_compute.py.gz.b64', 'lazarus-public-compute/lazarus_public_compute.py', '7429d615a4fcbcff529270ed25dbfb6e1395b07883dda59d4f9317724bfd6a2c'),
              ('lazarus-public-compute/payload/lazarus_orth_residual_compute.py.gz.b64', 'lazarus-public-compute/lazarus_orth_residual_compute.py', '42c284c9f06f713a59443fae04987292b6fc39ff1de1f85e903207c6857a8c33'),
          ]
          for source_name, target_name, expected in pairs:
              source = Path(source_name)
              target = Path(target_name)
              target.write_bytes(gzip.decompress(base64.b64decode(source.read_text().strip())))
              actual = hashlib.sha256(target.read_bytes()).hexdigest()
              assert actual == expected, (target_name, actual, expected)
          family = Path('lazarus-public-compute/frozen/primary_family_components_v1.csv')
          assert hashlib.sha256(family.read_bytes()).hexdigest() == '6e7080e2d22e66322ea0884515be9ae5c6762eeb24acc16005ca45d68ecba788'
          PY
      - name: Restore exact CATNAP 2026-07 public inputs
        run: python cases/7838a640602a3a78463d52e06e2a614a/fetch_archive.py
      - name: Execute exactly 25 frozen development fits
        run: |
          python lazarus-public-compute/lazarus_orth_residual_compute.py \
            --legacy lazarus-public-compute/lazarus_public_compute.py \
            --data cases/7838a640602a3a78463d52e06e2a614a/artifacts/catnap-2026-07-01 \
            --families lazarus-public-compute/frozen/primary_family_components_v1.csv \
            --output lazarus-public-compute/orthogonal-artifacts
      - name: Enforce isolation, budget and sealed receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('lazarus-public-compute/orthogonal-artifacts/PUBLIC_ORTHOGONAL_RELAY_RECEIPT.json').read_text())
          assert receipt['public_compute'] is True
          assert receipt['private_bytes_read'] == 0
          assert receipt['confirmation_targets_read'] == 0
          assert receipt['model_fits'] == 25
          result = receipt['result']
          assert result['model_fits'] == 25
          assert result['fit_budget']['adaptive_expansion_allowed'] == 0
          assert result['seed631_targets_read'] == 0
          assert result['nature_targets_read'] == 0
          assert result['seed706_targets_read'] == 0
          assert len(result['candidate_models']) == 4
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazarus-orth-residual-frozen-public-v1
          path: |
            lazarus-public-compute/orthogonal-artifacts/
            cases/7838a640602a3a78463d52e06e2a614a/artifacts/PUBLIC_INPUT_RECEIPT.json
          if-no-files-found: error
          retention-days: 1
