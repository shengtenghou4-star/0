name: Opaque task relay

on:
  workflow_dispatch:
    inputs:
      capsule_id:
        description: Opaque 32-character capsule identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: opaque-relay-${{ inputs.capsule_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out fixed launcher
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify launcher contract
        run: python -m unittest discover -s tests -v

      - name: Validate queue credential
        shell: bash
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
        run: |
          if [[ -z "${LAB_QUEUE_TOKEN}" ]]; then
            echo "::error title=Relay credential missing::LAB_QUEUE_TOKEN is missing or empty."
            exit 2
          fi

      - name: Execute isolated opaque capsule
        shell: bash
        env:
          RELAY_CAPSULE_ID: ${{ inputs.capsule_id }}
          LAB_QUEUE_REPOSITORY: shengtenghou4-star/00
          LAB_QUEUE_REF: main
          LAB_QUEUE_WRITE_BRANCH: results
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
          RELAY_RUN_ID: ${{ github.run_id }}
          RELAY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set +e
          relay_output="$(python scripts/relay_runner.py 2>&1)"
          relay_status=$?
          printf '%s\n' "${relay_output}"
          if [[ ${relay_status} -ne 0 ]]; then
            detail="$(printf '%s\n' "${relay_output}" | tail -n 1 | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
            if [[ -z "${detail}" ]]; then
              detail="Relay exited with status ${relay_status}."
            fi
            echo "::error title=Opaque relay failed closed::${detail}"
            exit "${relay_status}"
          fi
