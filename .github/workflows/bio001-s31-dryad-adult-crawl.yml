name: BIO-001 S31 Dryad adult crawling transport

on:
  push:
    branches:
      - bio001-s31-dryad-adult-crawl-20260804
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Acquire frozen Dryad archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/extracted
          python - <<'PY'
          import pathlib, requests
          urls = [
              'https://datadryad.org/api/v2/datasets/doi%3A10.5061%2Fdryad.stqjq2c8p/download',
              'https://datadryad.org/api/v2/datasets/doi%253A10.5061%252Fdryad.stqjq2c8p/download',
          ]
          headers={'User-Agent':'BIO-001-reproducibility-audit/1.0','Accept':'application/zip,application/octet-stream,*/*'}
          diagnostics=[]
          output=pathlib.Path('artifacts/dryad_dataset.zip')
          for url in urls:
              try:
                  response=requests.get(url,headers=headers,timeout=180,allow_redirects=True)
                  diagnostics.append({'url':url,'status':response.status_code,'final_url':response.url,'bytes':len(response.content),'content_type':response.headers.get('content-type')})
                  if response.ok and len(response.content)>100000 and response.content[:2]==b'PK':
                      output.write_bytes(response.content)
                      break
              except Exception as exc:
                  diagnostics.append({'url':url,'error':repr(exc)})
          pathlib.Path('artifacts/TRANSPORT_DIAGNOSTICS.json').write_text(__import__('json').dumps(diagnostics,indent=2)+'\n')
          if not output.exists():
              raise SystemExit('Dryad API package download failed')
          PY
          sha256sum artifacts/dryad_dataset.zip | tee artifacts/SHA256SUMS.txt
          stat --printf='%s\n' artifacts/dryad_dataset.zip | tee artifacts/BYTES.txt
          unzip -t artifacts/dryad_dataset.zip
          unzip -q artifacts/dryad_dataset.zip -d artifacts/extracted
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('artifacts/extracted')
          # The DOI package may wrap the published dryad.zip as a file; extract every nested ZIP once.
          for nested in list(root.rglob('*.zip')):
              target=nested.with_suffix('')
              target.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(nested) as archive:
                  archive.extractall(target)
          paths=[p for p in root.rglob('*') if p.is_file()]
          Path('artifacts/FILE_LIST.txt').write_text('\n'.join(sorted(p.relative_to(root).as_posix() for p in paths))+'\n')
          eligible=[]
          for p in paths:
              q=p.relative_to(root).as_posix().lower()
              if p.suffix.lower()=='.txt' and 'adult' in q and ('crawl' in q or 'crawling' in q):
                  eligible.append(p)
          Path('artifacts/ELIGIBLE_FILE_LIST.txt').write_text('\n'.join(sorted(p.relative_to(root).as_posix() for p in eligible))+'\n')
          print('eligible',len(eligible))
          if len(eligible)<5:
              raise SystemExit('fewer than five preregistered adult crawling text files')
          PY

      - name: Upload raw archive and extracted text files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bio001-s31-dryad-adult-crawl
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
