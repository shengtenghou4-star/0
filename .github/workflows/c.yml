name: Matrix C

on:
  workflow_dispatch:
    inputs:
      capsule_id:
        description: 32-character case identifier
        required: true
        type: string
  push:
    paths:
      - 'cases/c/*.txt'

permissions:
  contents: read

concurrency:
  group: matrix-c-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare workspace
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Configure runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate fixtures
        run: python -m unittest discover -s tests -v

      - name: Resolve case
        id: capsule
        shell: bash
        env:
          DISPATCH_CAPSULE: ${{ inputs.capsule_id }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            capsule="${DISPATCH_CAPSULE}"
          else
            mapfile -t trigger_files < <(
              git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" \
                | grep -E '^cases/c/[0-9a-f]{32}\.txt$'
            )
            if [[ "${#trigger_files[@]}" -ne 1 ]]; then
              echo "::error title=Case trigger invalid::Expected exactly one case trigger file."
              exit 2
            fi
            capsule="$(tr -d '\r\n' < "${trigger_files[0]}")"
          fi
          if [[ ! "${capsule}" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error title=Case identifier invalid::Identifier must be 32 lowercase hexadecimal characters."
            exit 2
          fi
          echo "capsule_id=${capsule}" >> "${GITHUB_OUTPUT}"

      - name: Check access
        shell: bash
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
        run: |
          if [[ -z "${LAB_QUEUE_TOKEN}" ]]; then
            echo "::error title=Access check failed::Required runtime key is missing."
            exit 2
          fi

      - name: Update case index
        shell: bash
        env:
          RELAY_CAPSULE_ID: ${{ steps.capsule.outputs.capsule_id }}
          LAB_QUEUE_REPOSITORY: shengtenghou4-star/00
          LAB_QUEUE_RESULTS_REF: results
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
        run: |
          set +e
          index_output="$(python scripts/c.py 2>&1)"
          index_status=$?
          if [[ ${index_status} -ne 0 ]]; then
            echo "::error title=Index update failed::Case index was not updated."
            exit "${index_status}"
          fi
          printf '%s\n' "Case index updated."
