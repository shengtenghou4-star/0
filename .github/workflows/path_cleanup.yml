name: Path maintenance

on:
  push:
    paths:
      - '.github/workflows/path_cleanup.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare current tree
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Normalize ordinary paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import shutil

          moves = [
              ('scripts/relay_runner.py', 'scripts/a.py'),
              ('scripts/public_fetch_runner.py', 'scripts/b.py'),
              ('scripts/public_fetch_worker.py', 'scripts/b_worker.py'),
              ('scripts/verify_public_fetch_result.py', 'scripts/b_check.py'),
              ('scripts/index_public_fetch_result.py', 'scripts/c.py'),
              ('scripts/store_fixed_tool.py', 'scripts/d_store.py'),
              ('scripts/verify_fixed_tool.py', 'scripts/d_check.py'),
              ('scripts/make_sample_capsule.py', 'scripts/fixture.py'),
              ('tests/test_contract.py', 'tests/test_a.py'),
              ('tests/test_public_fetch_contract.py', 'tests/test_b.py'),
              ('tests/test_public_fetch_verifier.py', 'tests/test_b_check.py'),
              ('tests/test_public_fetch_index.py', 'tests/test_c.py'),
              ('tests/test_fixed_tool_contract.py', 'tests/test_d.py'),
          ]
          for old, new in moves:
              source = Path(old)
              if source.exists():
                  target = Path(new)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  os.replace(source, target)

          shutil.rmtree('relay-triggers', ignore_errors=True)

          replacements = [
              ('scripts/index_public_fetch_result.py', 'scripts/c.py'),
              ('scripts/verify_public_fetch_result.py', 'scripts/b_check.py'),
              ('scripts/public_fetch_runner.py', 'scripts/b.py'),
              ('scripts/public_fetch_worker.py', 'scripts/b_worker.py'),
              ('scripts/store_fixed_tool.py', 'scripts/d_store.py'),
              ('scripts/verify_fixed_tool.py', 'scripts/d_check.py'),
              ('scripts/relay_runner.py', 'scripts/a.py'),
              ('scripts/make_sample_capsule.py', 'scripts/fixture.py'),
              ('index_public_fetch_result', 'c'),
              ('verify_public_fetch_result', 'b_check'),
              ('public_fetch_runner', 'b'),
              ('public_fetch_worker', 'b_worker'),
              ('store_fixed_tool', 'd_store'),
              ('verify_fixed_tool', 'd_check'),
              ('relay_runner', 'a'),
              ('make_sample_capsule', 'fixture'),
              ('public_fetch', 'matrix_b'),
              ('fixed_tool', 'matrix_d'),
          ]
          for folder in (Path('scripts'), Path('tests')):
              for path in folder.rglob('*.py'):
                  text = path.read_text(encoding='utf-8')
                  updated = text
                  for old, new in replacements:
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
          PY

      - name: Validate normalized modules
        run: |
          cp -a .github/workflows /tmp/workflows-original
          python - <<'PY'
          from pathlib import Path
          replacements = [
              ('scripts/index_public_fetch_result.py', 'scripts/c.py'),
              ('scripts/verify_public_fetch_result.py', 'scripts/b_check.py'),
              ('scripts/public_fetch_runner.py', 'scripts/b.py'),
              ('scripts/public_fetch_worker.py', 'scripts/b_worker.py'),
              ('scripts/store_fixed_tool.py', 'scripts/d_store.py'),
              ('scripts/verify_fixed_tool.py', 'scripts/d_check.py'),
              ('scripts/relay_runner.py', 'scripts/a.py'),
              ('scripts/make_sample_capsule.py', 'scripts/fixture.py'),
              ('relay-triggers/public-fetch-index', 'cases/c'),
              ('relay-triggers/public-fetch', 'cases/b'),
              ('relay-triggers/fixed-tool', 'cases/d'),
              ('public_fetch', 'matrix_b'),
              ('fixed_tool', 'matrix_d'),
          ]
          for path in Path('.github/workflows').glob('*.yml'):
              if path.name == 'path_cleanup.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          rm -rf .github/workflows
          mv /tmp/workflows-original .github/workflows

      - name: Store normalized ordinary paths
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts tests relay-triggers 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize matrix paths [skip ci]"
          git push origin HEAD:main
