name: Inspect Audit 531c v1
# refresh after robust frontier-map parser
on:
  push:
    paths:
      - '.github/workflows/inspect-audit-531c-v1.yml'
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Query audit workflow
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,urllib.request
          gh=os.environ['GH_TOKEN']; lab=os.environ['LAB_QUEUE_TOKEN']
          url='https://api.github.com/repos/shengtenghou4-star/0/actions/workflows/audit-result-531c-v1.yml/runs?per_page=5'
          req=urllib.request.Request(url,headers={'Authorization':f'Bearer {gh}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'inspect-audit-531c'})
          with urllib.request.urlopen(req,timeout=120) as r: data=json.load(r)
          out={'schema':1,'runs':[{'id':x['id'],'status':x['status'],'conclusion':x['conclusion'],'head_sha':x['head_sha'],'created_at':x['created_at'],'updated_at':x['updated_at']} for x in data.get('workflow_runs',[])]}
          payload=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode()
          path='relay/status/audit-531c-v1/latest.json'
          api=f'https://api.github.com/repos/shengtenghou4-star/00/contents/{path}'
          headers={'Authorization':f'Bearer {lab}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'inspect-audit-531c'}
          try:
              with urllib.request.urlopen(urllib.request.Request(api+'?ref=results',headers=headers),timeout=120) as r: old=json.load(r); sha=old['sha']
          except Exception: sha=None
          body={'message':'Store ZAL 531c audit status','content':base64.b64encode(payload).decode(),'branch':'results'}
          if sha: body['sha']=sha
          req=urllib.request.Request(api,data=json.dumps(body,separators=(',',':')).encode(),method='PUT',headers={**headers,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=120) as r: r.read()
          PY
