name: BIO001 S26 OSF neural-behavior acquisition

on:
  pull_request:
    paths:
      - 'cases/bio001-s26-osf/**'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install scientific Python
        run: python -m pip install requests scipy h5py

      - name: Acquire only frozen training and development recordings
        run: |
          set -euo pipefail
          mkdir -p s26_osf/raw s26_osf/extracted s26_osf/results
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, tarfile
          from pathlib import Path
          import requests

          root = Path('s26_osf')
          raw = root / 'raw'
          extracted = root / 'extracted'
          results = root / 'results'
          session = requests.Session()
          session.headers['User-Agent'] = 'BIO-001-S26-Hallinen/1.0'

          def get_json(url):
              response = session.get(url, timeout=120)
              response.raise_for_status()
              return response.json()

          def iter_pages(url):
              while url:
                  payload = get_json(url)
                  yield from payload.get('data', [])
                  url = payload.get('links', {}).get('next')

          inventory = []
          queue = ['https://api.osf.io/v2/nodes/dpr3h/files/osfstorage/']
          seen = set()
          while queue:
              url = queue.pop(0)
              if url in seen:
                  continue
              seen.add(url)
              for item in iter_pages(url):
                  attrs = item.get('attributes', {})
                  record = {
                      'id': item.get('id'),
                      'name': attrs.get('name', ''),
                      'kind': attrs.get('kind'),
                      'path': attrs.get('materialized_path'),
                      'size': attrs.get('size'),
                      'download': item.get('links', {}).get('download'),
                  }
                  inventory.append(record)
                  if record['kind'] == 'folder':
                      related = item.get('relationships', {}).get('files', {}).get('links', {}).get('related', {}).get('href')
                      if related:
                          queue.append(related)
          (results / 'osf_inventory.json').write_text(json.dumps(inventory, indent=2), encoding='utf-8')

          targets = [
              record for record in inventory
              if record['kind'] == 'file'
              and any(token in record['name'].lower() for token in ('aml310_moving', 'aml32_moving'))
              and record['name'].lower().endswith(('.tar.gz', '.tgz'))
          ]
          if len(targets) != 2:
              raise RuntimeError('Expected exactly AML310_moving and AML32_moving archives: ' + json.dumps(targets))

          archive_receipts = []
          for record in sorted(targets, key=lambda item: item['name']):
              destination = raw / record['name']
              with session.get(record['download'], stream=True, timeout=300) as response:
                  response.raise_for_status()
                  with destination.open('wb') as handle:
                      for chunk in response.iter_content(1024 * 1024):
                          if chunk:
                              handle.write(chunk)
              archive_receipts.append({
                  'name': destination.name,
                  'bytes': destination.stat().st_size,
                  'sha256': hashlib.sha256(destination.read_bytes()).hexdigest(),
                  'osf_file_id': record['id'],
              })
          (results / 'archive_receipts.json').write_text(json.dumps(archive_receipts, indent=2), encoding='utf-8')

          frozen_aliases = {
              'AML310_moving': {'train': ['A', 'B'], 'dev': ['C'], 'holdout': ['D']},
              'AML32_moving': {'train': ['A', 'B', 'C', 'D'], 'dev': ['E'], 'holdout': ['F', 'G']},
          }
          split_receipt = {}
          for archive in sorted(raw.iterdir()):
              condition = 'AML310_moving' if 'aml310_moving' in archive.name.lower() else 'AML32_moving'
              with tarfile.open(archive, 'r:gz') as tar:
                  members = tar.getmembers()
                  lists = [member for member in members if member.isfile() and member.name.endswith('_datasets.txt')]
                  if len(lists) != 1:
                      raise RuntimeError(f'{condition}: expected one datasets list, got {len(lists)}')
                  lines = tar.extractfile(lists[0]).read().decode('utf-8').splitlines()
                  identifiers = sorted({
                      line.split('#', 1)[0].strip().split()[0]
                      for line in lines
                      if line.split('#', 1)[0].strip()
                  })
                  alias_map = {chr(65 + index): identifier for index, identifier in enumerate(identifiers)}
                  required = sum(frozen_aliases[condition].values(), [])
                  if any(alias not in alias_map for alias in required):
                      raise RuntimeError(f'{condition}: insufficient recordings: {identifiers}')
                  split = {
                      part: [alias_map[alias] for alias in letters]
                      for part, letters in frozen_aliases[condition].items()
                  }
                  split_receipt[condition] = {
                      'identifiers_lexicographic': identifiers,
                      'alias_map': alias_map,
                      'split': split,
                  }
                  allowed_ids = set(split['train'] + split['dev'])
                  for member in members:
                      if member.isfile() and (member == lists[0] or any(identifier in member.name for identifier in allowed_ids)):
                          tar.extract(member, extracted)
          (results / 'split_receipt.json').write_text(json.dumps(split_receipt, indent=2), encoding='utf-8')

          forbidden = [identifier for receipt in split_receipt.values() for identifier in receipt['split']['holdout']]
          extracted_paths = [str(path) for path in extracted.rglob('*')]
          leaked = [identifier for identifier in forbidden if any(identifier in path for path in extracted_paths)]
          if leaked:
              raise RuntimeError('holdout extraction leak: ' + repr(leaked))
          (results / 'holdout_nonaccess_receipt.json').write_text(json.dumps({
              'holdout_identifiers': forbidden,
              'leaked_identifiers': leaked,
              'holdout_extracted': False,
          }, indent=2), encoding='utf-8')

          import scipy.io
          schemas = []
          for path in sorted(extracted.rglob('heatDataMS.mat')):
              try:
                  data = scipy.io.loadmat(path)
                  fields = {key: list(value.shape) for key, value in data.items() if not key.startswith('__')}
                  fmt = 'mat-v5'
              except NotImplementedError:
                  import h5py
                  with h5py.File(path, 'r') as handle:
                      fields = {key: list(handle[key].shape) for key in handle.keys()}
                  fmt = 'hdf5'
              schemas.append({'path': str(path.relative_to(extracted)), 'format': fmt, 'fields': fields})
          if len(schemas) != 8:
              raise RuntimeError(f'Expected 8 train/dev neural recordings, got {len(schemas)}')
          (results / 'train_dev_schemas.json').write_text(json.dumps(schemas, indent=2), encoding='utf-8')
          PY

      - name: Package source and permitted extracted records
        run: |
          tar -czf bio001-s26-osf-train-dev.tar.gz s26_osf
          sha256sum bio001-s26-osf-train-dev.tar.gz > bio001-s26-osf-train-dev.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: bio001-s26-osf-train-dev
          path: |
            bio001-s26-osf-train-dev.tar.gz
            bio001-s26-osf-train-dev.sha256
          retention-days: 30
          if-no-files-found: error
