name: Inspect ZAL Dual Bound

on:
  push:
    paths:
      - '.github/workflows/inspect-zal-dual-bound.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Query workflow states and commit status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.request
          token=os.environ['GH_TOKEN']; repo='shengtenghou4-star/0'; path='status-zal-dual-bound.json'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'inspect-zal-dual-bound'}
          workflows=['zal-dual-bound-build-audit.yml','audit-zal-dual-bound-package.yml']
          out={'schema':2,'workflows':{}}
          for workflow in workflows:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?per_page=5',headers=headers)
              with urllib.request.urlopen(req,timeout=120) as r: data=json.load(r)
              out['workflows'][workflow]=[{'id':x['id'],'status':x['status'],'conclusion':x['conclusion'],'run_number':x['run_number'],'run_attempt':x['run_attempt'],'head_sha':x['head_sha'],'created_at':x['created_at'],'updated_at':x['updated_at'],'html_url':x['html_url']} for x in data.get('workflow_runs',[])]
          payload=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode()
          sha=None
          try:
              with urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',headers=headers),timeout=120) as r: sha=json.load(r)['sha']
          except urllib.error.HTTPError as exc:
              if exc.code!=404: raise
          body={'message':'Update ZAL dual-bound workflow status','content':base64.b64encode(payload).decode(),'branch':'main'}
          if sha: body['sha']=sha
          request=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=json.dumps(body).encode(),method='PUT',headers=headers)
          with urllib.request.urlopen(request,timeout=120) as r: r.read()
          PY
