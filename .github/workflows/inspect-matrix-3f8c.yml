name: Inspect Matrix 3f8c

on:
  push:
    paths:
      - '.github/workflows/inspect-matrix-3f8c.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Query workflow state and store privately
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
          INSPECT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          gh=os.environ['GH_TOKEN']; lab=os.environ['LAB_QUEUE_TOKEN']; inspect=os.environ['INSPECT_RUN_ID']
          url='https://api.github.com/repos/shengtenghou4-star/0/actions/workflows/matrix-3f8c.yml/runs?per_page=5'
          req=urllib.request.Request(url,headers={'Authorization':f'Bearer {gh}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'inspect-matrix-3f8c'})
          with urllib.request.urlopen(req,timeout=120) as r: data=json.load(r)
          out={'schema':1,'workflow':'matrix-3f8c.yml','runs':[{'id':x['id'],'status':x['status'],'conclusion':x['conclusion'],'run_number':x['run_number'],'head_sha':x['head_sha'],'created_at':x['created_at'],'updated_at':x['updated_at'],'html_url':x['html_url']} for x in data.get('workflow_runs',[])]}
          payload=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode()
          path=f'relay/status/3f8c/{inspect}.json'
          body=json.dumps({'message':'Store matrix status inspection','content':base64.b64encode(payload).decode(),'branch':'results'},separators=(',',':')).encode()
          put=urllib.request.Request(f'https://api.github.com/repos/shengtenghou4-star/00/contents/{path}',data=body,method='PUT',headers={'Authorization':f'Bearer {lab}','Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'inspect-matrix-3f8c'})
          with urllib.request.urlopen(put,timeout=120) as r: r.read()
          PY
