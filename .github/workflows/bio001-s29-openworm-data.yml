name: BIO-001 S29B Arena N2 real data transport

on:
  push:
    branches:
      - bio001-s29-transport-20260804
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download exact preregistered ArenaWormTracker release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/extracted
          url='https://github.com/albrechtLab/ArenaWormTracker/releases/download/1.0.0/N2_IAA-7_stripe2_sample.zip'
          curl --fail --location --retry 3 --retry-delay 2 \
            --output artifacts/N2_IAA-7_stripe2_sample.zip "$url"
          test "$(stat -c%s artifacts/N2_IAA-7_stripe2_sample.zip)" -gt 1000000
          unzip -t artifacts/N2_IAA-7_stripe2_sample.zip
          unzip -q artifacts/N2_IAA-7_stripe2_sample.zip -d artifacts/extracted

      - name: Freeze byte and inventory receipt
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import zipfile

          archive = pathlib.Path('artifacts/N2_IAA-7_stripe2_sample.zip')
          with zipfile.ZipFile(archive) as zf:
              inventory = [
                  {
                      'path': item.filename,
                      'bytes': item.file_size,
                      'crc32': f'{item.CRC:08x}',
                  }
                  for item in zf.infolist()
                  if not item.is_dir()
              ]
          receipt = {
              'schema': 'bio-001-s29b-arena-n2-transport-v1',
              'target_url': 'https://github.com/albrechtLab/ArenaWormTracker/releases/download/1.0.0/N2_IAA-7_stripe2_sample.zip',
              'filename': archive.name,
              'bytes': archive.stat().st_size,
              'sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'file_count': len(inventory),
              'inventory': inventory,
          }
          pathlib.Path('artifacts/transport_manifest.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True, allow_nan=False) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload exact raw ZIP, extraction and manifest
        uses: actions/upload-artifact@v4
        with:
          name: bio001-s29b-arena-n2-real-data
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
