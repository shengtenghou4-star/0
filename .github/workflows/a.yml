name: Matrix A

on:
  workflow_dispatch:
    inputs:
      capsule_id:
        description: 32-character case identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: matrix-a-${{ inputs.capsule_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Prepare workspace
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate fixtures
        run: python -m unittest discover -s tests -v

      - name: Check access
        shell: bash
        env:
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
        run: |
          if [[ -z "${LAB_QUEUE_TOKEN}" ]]; then
            echo "::error title=Access check failed::Required runtime key is missing."
            exit 2
          fi

      - name: Run selected case
        shell: bash
        env:
          RELAY_CAPSULE_ID: ${{ inputs.capsule_id }}
          LAB_QUEUE_REPOSITORY: shengtenghou4-star/00
          LAB_QUEUE_REF: main
          LAB_QUEUE_WRITE_BRANCH: results
          LAB_QUEUE_TOKEN: ${{ secrets.LAB_QUEUE_TOKEN }}
          RELAY_RUN_ID: ${{ github.run_id }}
          RELAY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set +e
          relay_output="$(python scripts/a.py 2>&1)"
          relay_status=$?
          printf '%s\n' "${relay_output}"
          if [[ ${relay_status} -ne 0 ]]; then
            detail="$(printf '%s\n' "${relay_output}" | tail -n 1 | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
            if [[ -z "${detail}" ]]; then
              detail="Case exited with status ${relay_status}."
            fi
            echo "::error title=Case failed::${detail}"
            exit "${relay_status}"
          fi
