name: LAZARUS regime router untouched v1

on:
  pull_request:
    paths:
      - ".github/workflows/lazarus-regime-router-untouched-v1.yml"
      - "lazarus-public-compute/payload/lazarus_regime_router_untouched_v1.py.gz.b64.part01"
      - "lazarus-public-compute/payload/lazarus_regime_router_untouched_v1.py.gz.b64.part02"

permissions:
  contents: read

jobs:
  regime-router-untouched:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen runtime
        run: python -m pip install "numpy==2.3.2" "scipy==1.16.1" "scikit-learn==1.7.1" --quiet --progress-bar off
      - name: Decode and verify reviewed payloads
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path

          payloads = [
              ('lazarus-public-compute/payload/lazarus_public_compute.py.gz.b64', 'lazarus-public-compute/lazarus_public_compute.py', '7429d615a4fcbcff529270ed25dbfb6e1395b07883dda59d4f9317724bfd6a2c'),
              ('lazarus-public-compute/payload/lazarus_orth_residual_compute.py.gz.b64', 'lazarus-public-compute/lazarus_orth_residual_compute.py', '42c284c9f06f713a59443fae04987292b6fc39ff1de1f85e903207c6857a8c33'),
              ('lazarus-public-compute/payload/lazarus_prospective_snapshot_compute.py.gz.b64', 'lazarus-public-compute/lazarus_prospective_snapshot_compute.py', '3e27e43dc33ba8deac14d4b981cd8fe9d7d220cd01e908f31fee51fb4e9a200c'),
          ]
          for source_name, target_name, expected in payloads:
              source = Path(source_name)
              target = Path(target_name)
              target.write_bytes(gzip.decompress(base64.b64decode(source.read_text().strip())))
              actual = hashlib.sha256(target.read_bytes()).hexdigest()
              assert actual == expected, (target_name, actual, expected)

          parts = [
              Path('lazarus-public-compute/payload/lazarus_regime_router_untouched_v1.py.gz.b64.part01'),
              Path('lazarus-public-compute/payload/lazarus_regime_router_untouched_v1.py.gz.b64.part02'),
          ]
          encoded = ''.join(path.read_text().strip() for path in parts)
          router = Path('lazarus-public-compute/lazarus_regime_router_untouched_v1.py')
          router.write_bytes(gzip.decompress(base64.b64decode(encoded)))
          original_router_sha = hashlib.sha256(router.read_bytes()).hexdigest()
          assert original_router_sha == '5d8ced1d50e0193ce4d4a16037d2d043e36f09b8ff3731ab9ba9e62d49cbe606'

          old = 'f488903da02dc66191875f64bce17eeba74114e3'
          new = 'eea8bca3aa52832c2f2e6ab1ad62ea973c238bc757cbd8a7391f6a1a7044fdc3'
          text = router.read_text()
          assert text.count(old) == 1
          assert new not in text
          router.write_text(text.replace(old, new))
          patched_router_sha = hashlib.sha256(router.read_bytes()).hexdigest()
          assert patched_router_sha == 'e5fb3ab06575dbf3b8deffb08efb321afdf093a18ed7c71b91538a950301ec7a'

          fixed = {
              'lazarus-public-compute/lazarus_prospective_sealed_wrapper_v2.py': '5d354d5482c59be02fe7775849e6841b333d35617262e91c46fae633efd8cdf1',
              'lazarus-public-compute/lazarus_historical_monthly_delta_v1.py': new,
              'lazarus-public-compute/frozen/primary_family_components_v1.csv': '6e7080e2d22e66322ea0884515be9ae5c6762eeb24acc16005ca45d68ecba788',
          }
          for name, expected in fixed.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == expected, (name, actual, expected)
          PY
      - name: Compile frozen router
        run: python -m py_compile lazarus-public-compute/lazarus_regime_router_untouched_v1.py
      - name: Execute untouched Jan-to-Apr windows
        run: |
          python lazarus-public-compute/lazarus_regime_router_untouched_v1.py \
            --runner lazarus-public-compute/lazarus_prospective_snapshot_compute.py \
            --legacy lazarus-public-compute/lazarus_public_compute.py \
            --orth lazarus-public-compute/lazarus_orth_residual_compute.py \
            --wrapper lazarus-public-compute/lazarus_prospective_sealed_wrapper_v2.py \
            --historical lazarus-public-compute/lazarus_historical_monthly_delta_v1.py \
            --families lazarus-public-compute/frozen/primary_family_components_v1.csv \
            --output lazarus-public-compute/regime-router-untouched-v1-artifacts
      - name: Seal recursive artifact manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('lazarus-public-compute/regime-router-untouched-v1-artifacts')
          summary = json.loads((root / 'REGIME_ROUTER_SUMMARY.json').read_text())
          receipt = json.loads((root / 'REGIME_ROUTER_RECEIPT.json').read_text())
          assert summary['windows_declared'] == 3
          assert 0 <= summary['windows_fitted'] <= 3
          assert 0 <= summary['router_holdout_supervised_fits'] <= 9
          assert summary['router_holdout_supervised_fits'] == receipt['router_holdout_supervised_fits']
          for value in (summary, receipt):
              assert value['real_august_rows_read'] == 0
              assert value['real_august_values_read'] == 0
              assert value['prospective_scientific_fits'] == 0
              assert value['private_bytes_read'] == 0
          files = {}
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.name == 'RECURSIVE_ARTIFACT_MANIFEST.json':
                  continue
              files[str(path.relative_to(root))] = {
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          manifest = {
              'schema_version': '1.0',
              'status': 'SEALED',
              'files': files,
              'file_count': len(files),
              'real_august_rows_read': 0,
              'real_august_values_read': 0,
              'prospective_scientific_fits': 0,
              'private_bytes_read': 0,
          }
          (root / 'RECURSIVE_ARTIFACT_MANIFEST.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps({
              'status': summary['status'],
              'windows_fitted': summary['windows_fitted'],
              'fits': summary['router_holdout_supervised_fits'],
              'files': len(files),
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazarus-regime-router-untouched-v1
          path: lazarus-public-compute/regime-router-untouched-v1-artifacts
          if-no-files-found: error
          retention-days: 1
