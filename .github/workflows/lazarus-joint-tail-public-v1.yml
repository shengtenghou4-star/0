name: LAZARUS joint-tail public relay v1

on:
  pull_request:
    paths:
      - "lazarus-public-compute/**"
      - ".github/workflows/lazarus-joint-tail-public-v1.yml"

permissions:
  contents: read

concurrency:
  group: lazarus-joint-tail-public-v1
  cancel-in-progress: false

jobs:
  public-development-relay:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen public runtime
        run: |
          python -m pip install --upgrade pip --quiet --progress-bar off
          python -m pip install "numpy==2.3.2" "scipy==1.16.1" "scikit-learn==1.7.1" --quiet --progress-bar off

      - name: Decode reviewed compute payload
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          source = Path("lazarus-public-compute/payload/lazarus_public_compute.py.gz.b64")
          target = Path("lazarus-public-compute/lazarus_public_compute.py")
          target.write_bytes(gzip.decompress(base64.b64decode(source.read_text().strip())))
          PY
          python -m py_compile lazarus-public-compute/lazarus_public_compute.py

      - name: Restore official CATNAP 2026-07 frozen public inputs
        run: |
          python cases/7838a640602a3a78463d52e06e2a614a/fetch_archive.py

      - name: Execute exact public-safe development relay
        run: |
          python lazarus-public-compute/lazarus_public_compute.py \
            --data cases/7838a640602a3a78463d52e06e2a614a/artifacts/catnap-2026-07-01 \
            --families lazarus-public-compute/frozen/primary_family_components_v1.csv \
            --output lazarus-public-compute/artifacts

      - name: Enforce isolation and fit budget
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("lazarus-public-compute/artifacts/PUBLIC_RELAY_RECEIPT.json").read_text())
          assert receipt["public_compute"] is True
          assert receipt["private_bytes_read"] == 0
          assert receipt["confirmation_targets_read"] == 0
          assert receipt["model_fits"] == 30
          summary = receipt["result"]
          assert summary["seed631_targets_read"] == 0
          assert summary["nature_targets_read"] == 0
          assert summary["seed706_targets_read"] == 0
          PY

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lazarus-joint-tail-public-relay-v1
          path: |
            lazarus-public-compute/artifacts/
            cases/7838a640602a3a78463d52e06e2a614a/artifacts/PUBLIC_INPUT_RECEIPT.json
          if-no-files-found: error
          retention-days: 1
