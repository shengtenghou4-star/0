name: Status ZAL Residual12 Kissat

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/status-zal-residual12-kissat.yml'

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Query workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['GH_TOKEN']
          url='https://api.github.com/repos/shengtenghou4-star/0/actions/workflows/matrix-zal-residual12-kissat.yml/runs?per_page=5'
          req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'status-zal-residual12-kissat'})
          with urllib.request.urlopen(req,timeout=120) as r: data=json.load(r)
          out={'schema':1,'workflow':'matrix-zal-residual12-kissat.yml','runs':[{'id':x['id'],'run_number':x['run_number'],'status':x['status'],'conclusion':x['conclusion'],'head_sha':x['head_sha'],'created_at':x['created_at'],'updated_at':x['updated_at'],'html_url':x['html_url']} for x in data.get('workflow_runs',[])]}
          open('status-zal-residual12-kissat.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add status-zal-residual12-kissat.json
          git commit -m 'Update ZAL residual12 Kissat status' || exit 0
          git push
