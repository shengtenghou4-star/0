name: case-4c9e1b7a2d6f8e0c3a5b7d9f1e2c4a6b

on:
  pull_request:
    paths:
      - ".github/workflows/case_4c9e1b7a2d6f8e0c3a5b7d9f1e2c4a6b.yml"

permissions:
  contents: read

jobs:
  fixed-case:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Discover fixed public-data candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p case_output
          python - <<'PY'
          import html
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          excluded = {"1026507", "1029071", "1191748", "1201276", "1191045"}
          headers = {"User-Agent": "reference-matrix/1.0", "Accept": "application/json"}
          candidates = []
          seen = set()

          for query in ["days_of_adulthood", '"CGC N2 (Bristol, UK)"', '"Open Worm Movement Database"']:
              for page in range(1, 11):
                  url = "https://zenodo.org/api/records?" + urllib.parse.urlencode({"q": query, "size": 100, "page": page, "sort": "mostrecent"})
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=120) as response:
                      payload = json.load(response)
                  hits = payload.get("hits", {}).get("hits", [])
                  if not hits:
                      break
                  for record in hits:
                      record_id = str(record.get("id", ""))
                      if not record_id or record_id in excluded or record_id in seen:
                          continue
                      metadata = record.get("metadata", {})
                      description = html.unescape(re.sub(r"<[^>]+>", "\n", metadata.get("description", "")))
                      title = metadata.get("title", "")
                      combined = title + "\n" + description
                      if "Open Worm Movement Database" not in combined and "behavioural database" not in combined:
                          continue
                      if "CGC N2 (Bristol, UK)" not in combined and "N2 lab reference strain" not in combined:
                          continue
                      day_match = re.search(r"days_of_adulthood\s*:\s*(\d+)", combined, re.I)
                      base_match = re.search(r"base_name\s*:\s*([^\n]+)", combined, re.I)
                      fps_match = re.search(r"frames per second\s*:\s*([0-9.]+)", combined, re.I)
                      wcon = [entry for entry in record.get("files", []) if entry.get("key", "").endswith(".wcon.zip")]
                      if len(wcon) != 1:
                          continue
                      entry = wcon[0]
                      checksum = entry.get("checksum", "")
                      if not checksum.startswith("md5:"):
                          continue
                      row = {
                          "record_id": record_id,
                          "title": title,
                          "doi": metadata.get("doi"),
                          "days_of_adulthood": int(day_match.group(1)) if day_match else None,
                          "base_name": base_match.group(1).strip() if base_match else None,
                          "fps": float(fps_match.group(1)) if fps_match else None,
                          "filename": entry.get("key"),
                          "md5": checksum.split(":", 1)[1],
                          "bytes": entry.get("size"),
                          "content_url": entry.get("links", {}).get("content") or entry.get("links", {}).get("self"),
                          "created": record.get("created"),
                      }
                      candidates.append(row)
                      seen.add(record_id)
                  total = payload.get("hits", {}).get("total", 0)
                  if isinstance(total, dict):
                      total = total.get("value", 0)
                  if page * 100 >= int(total or 0):
                      break

          candidates.sort(key=lambda row: (
              row["days_of_adulthood"] is None,
              row["days_of_adulthood"] if row["days_of_adulthood"] is not None else 999,
              row["record_id"],
          ))
          result = {
              "schema": "reference-matrix-candidate-discovery-v1",
              "case": "4c9e1b7a2d6f8e0c3a5b7d9f1e2c4a6b",
              "excluded_record_ids": sorted(excluded),
              "candidate_count": len(candidates),
              "candidates": candidates,
          }
          pathlib.Path("case_output/CANDIDATES.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2, sort_keys=True))
          if not candidates:
              raise SystemExit("No eligible candidates discovered")
          PY

      - name: Upload fixed-case output
        uses: actions/upload-artifact@v4
        with:
          name: case-4c9e1b7a2d6f8e0c3a5b7d9f1e2c4a6b
          path: case_output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
